<!DOCTYPE html>
<html lang="ko">
<!-- JMFC GAS web app · mockup-parity UI -->
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>JMFC풋살 매니저</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg:#ffffff; --surf:#ffffff; --text:#111827; --muted:#4b5563;
      --line:#c5cad3; --accent:#2563eb; --accent-soft:#dbeafe;
      --danger:#e03528; --neon:#b8ff3c; --own:#f1a53b; --modal-accent:#f1a53b;
      --red:#dc2626; --blue:#2563eb; --yellow-text:#CA8A04; --yellow-fill:#EAB308; --black:#111827;
      --end-session-bg:rgb(224,53,40); --end-session-fg:rgb(245,238,238);
      --glass:rgba(255,255,255,.92); --glass-strong:#ffffff;
      --glass-border:1px solid var(--line);
      --glass-edge:#ffffff;
      --raise:0 10px 28px rgba(15,23,42,.16), 0 2px 6px rgba(15,23,42,.08);
      --raise-sm:0 6px 16px rgba(15,23,42,.14), 0 1px 3px rgba(15,23,42,.08);
      --press:inset 2px 2px 6px rgba(15,23,42,.10);
      --safe-b:env(safe-area-inset-bottom,0px);
      --touch-min:48px; --font-btn:0.92rem;
      --blur:blur(12px) saturate(1.1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Apple SD Gothic Neo','Segoe UI',sans-serif;background:#ffffff;color:var(--text);min-height:100dvh;display:flex;justify-content:center;padding:12px 10px calc(16px + var(--safe-b));-webkit-font-smoothing:antialiased}
    .phone{width:100%;max-width:420px;background:#ffffff;border-radius:28px;border:1px solid #e5e7eb;box-shadow:0 18px 50px rgba(15,23,42,.12);overflow:hidden;display:flex;flex-direction:column;min-height:min(100dvh - 24px,920px);position:relative}
    .glass{background:var(--glass);border:var(--glass-border);box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .jmfc-bar{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;background:transparent;flex-shrink:0}
    .jmfc-bar img.logo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:var(--raise-sm);border:1px solid rgba(0,0,0,.08);background:#111}
    .jmfc-brand{display:flex;align-items:center;min-height:56px}
    .jmfc-brand strong{display:block;font-family:'Bebas Neue','Arial Black',Impact,'Helvetica Neue',sans-serif;font-size:1.55rem;font-weight:400;letter-spacing:0.04em;color:#111827;line-height:1;text-transform:uppercase}
    .jmfc-brand span,#bar-sub{display:none!important}
    .steps-wrap{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:6px;margin:0 10px 10px;flex-shrink:0}
    .steps-nav{width:48px;height:48px;border:var(--glass-border);border-radius:999px;background:var(--glass-strong);box-shadow:var(--raise-sm);color:#000;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;padding:0;align-self:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .steps-nav svg{width:22px;height:22px;display:block}
    .steps{display:flex;gap:4px;padding:6px;overflow-x:auto;border-radius:999px;background:#f3f4f6;border:1px solid var(--line);box-shadow:var(--press);-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;align-items:center;min-height:48px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .steps::-webkit-scrollbar{display:none}
    .steps button{flex:0 0 auto;padding:8px 12px;border-radius:999px;font-size:0.72rem;font-weight:700;font-family:inherit;color:#6b7280;background:transparent;border:none;cursor:pointer}
    .steps button.on{background:rgba(255,255,255,.92);color:#111827;box-shadow:0 4px 14px rgba(15,23,42,.12)}
    .steps button.done{color:#374151}
    .body{padding:8px 14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
    h2{font-size:1.1rem;font-weight:900;margin-bottom:8px;color:#111827;letter-spacing:0}
    .sub{font-size:0.8rem;color:var(--muted);margin-bottom:10px;line-height:1.45;letter-spacing:0}
    .field{width:100%;min-height:46px;border-radius:999px;border:var(--glass-border);padding:8px 16px;font:inherit;font-weight:700;margin-bottom:10px;background:var(--glass);box-shadow:var(--press);color:var(--text);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .field.date-compact{min-height:42px;height:42px;padding:0 14px;font-size:0.88rem;font-weight:800;margin-bottom:10px;line-height:42px}
    .label-sm{display:block;font-size:0.78rem;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:0}
    .seg{display:flex;gap:6px;padding:6px;border-radius:999px;margin-bottom:12px;background:#f3f4f6;border:1px solid var(--line);box-shadow:var(--press);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .seg button{flex:1;min-height:42px;border:none;background:transparent;font-weight:800;font-size:0.88rem;font-family:inherit;color:#4b5563;cursor:pointer;border-radius:999px}
    .seg button.on{background:#2563eb;color:#fff;box-shadow:var(--raise-sm)}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .chip-row.one-line{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex-wrap:nowrap}
    .chip-row.one-line .mini{width:100%;min-height:44px;text-align:center;font-size:0.7rem;padding:10px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;justify-content:center}
    .mini{padding:8px 12px;border-radius:999px;border:var(--glass-border);background:var(--glass-strong);font-size:0.75rem;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:var(--raise-sm);color:#111827;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .mini.on{background:#2563eb;color:#fff;border-color:transparent;box-shadow:var(--raise-sm)}
    .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
    .chip{min-height:52px;border-radius:999px;border:var(--glass-border);background:var(--glass-strong);font-weight:700;font-size:0.92rem;font-family:inherit;color:#111827;cursor:pointer;padding:12px 8px;line-height:1.2;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .chip.on{background:#5b9cff;border-color:#1d4ed8;color:#fff;box-shadow:var(--raise)}
    .chip.off{opacity:1}
    .chip.merc{border-style:dashed}
    .chip.taken{opacity:.35;pointer-events:none;box-shadow:none}
    .coach-slots{display:grid;gap:10px;margin-bottom:12px}
    .coach-slots.m2,.coach-slots.m3,.coach-slots.m4{grid-template-columns:1fr 1fr}
    .cslot{min-height:78px;border-radius:18px;border:var(--glass-border);padding:14px 10px;text-align:center;font-size:0.72rem;font-weight:800;color:#4b5563;background:var(--glass);cursor:pointer;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .cslot.active{border-color:#1d4ed8;border-width:2px;background:rgba(147,197,253,.55);box-shadow:var(--raise-sm)}
    .cslot.filled{color:#111827}
    .cslot .slot-team{display:block;font-size:0.72rem;font-weight:900;letter-spacing:.02em}
    .cslot .slot-name{display:block;font-size:1.02rem;font-weight:900;margin-top:6px;color:#111827}
    .cslot .slot-name.empty{color:#9ca3af;font-weight:800}
    .section-card{border:var(--glass-border);border-radius:18px;padding:12px;background:var(--glass);margin-bottom:12px;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .section-card h3{font-size:0.88rem;font-weight:900;margin-bottom:8px;color:#111827;letter-spacing:0}
    .draft-board{display:grid;grid-template-columns:0.9fr 1.2fr;gap:8px;align-items:start}
    .draft-board .section-card{padding:10px}
    .draft-board .chip-grid{grid-template-columns:1fr 1fr;gap:6px;margin:0}
    .draft-board .chip{min-height:40px;padding:8px 4px;font-size:0.78rem}
    @media (max-width:380px){.draft-board{grid-template-columns:1fr}}
    .draft-list{max-height:380px;overflow:auto;padding-right:2px}
    .draft-row{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;margin-bottom:6px;cursor:grab}
    .draft-row.dragging{opacity:.55}
    .draft-row .num{font-size:0.65rem;font-weight:800;color:#374151;text-align:center}
    .draft-team{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:8px;min-height:40px;border-radius:999px;border:var(--glass-border);padding:4px 8px 4px 6px;background:var(--glass-strong);box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .team-chip{display:inline-flex;align-items:center;gap:4px;border:1.5px dashed #64748b;background:#f8fafc;border-radius:999px;padding:4px 8px 4px 6px;cursor:pointer;font-family:inherit;min-height:28px}
    .team-chip:active{transform:scale(.97)}
    .team-chip .dot{width:12px;height:12px;border-radius:50%;display:block;flex-shrink:0}
    .team-chip .dot.RED{background:var(--red)} .team-chip .dot.BLUE{background:var(--blue)}
    .team-chip .dot.YELLOW{background:var(--yellow-fill)} .team-chip .dot.BLACK{background:#4b5563}
    .team-chip .chip-lab{font-size:0.62rem;font-weight:800;color:#475569;letter-spacing:0;white-space:nowrap}
    .draft-team .pname{font-size:0.84rem;font-weight:900;color:#111827;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:0}
    .draft-team .pname.empty{color:#6b7280;font-weight:700}
    .draft-team .clear-x{justify-self:end}
    .draft-team.current{border-color:#1d4ed8;background:rgba(147,197,253,.55);box-shadow:var(--raise-sm)}
    .team-cards{display:flex;flex-direction:column;gap:12px;margin:14px 0}
    .team-stat-card{padding:14px;border-radius:18px;border:var(--glass-border);background:var(--glass);min-height:96px;box-shadow:var(--raise);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .team-stat-card.drag-over{outline:2px dashed #2563eb;outline-offset:2px}
    .team-stat-card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
    .team-stat-card .head h4{font-size:calc(0.9rem + 1pt);font-weight:900;letter-spacing:0}
    .team-stat-card .head .val{font-size:0.9rem;font-weight:900;text-align:right;line-height:1.25;color:#111827;letter-spacing:0}
    .team-stat-card .meta{font-size:0.86rem;font-weight:800;color:#1f2937;margin-bottom:8px;letter-spacing:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .team-stat-card .card-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .team-stat-card .card-acts button{min-height:40px;border:none;border-radius:999px;background:#111;color:var(--neon);font-weight:900;font-size:0.78rem;font-family:inherit;cursor:pointer}
    .team-stat-card .names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .team-stat-card .names > span{display:block;text-align:center;font-size:0.8rem;font-weight:800;padding:8px 4px;border-radius:12px;background:var(--glass-strong);border:var(--glass-border);box-shadow:var(--raise-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111827;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);letter-spacing:0;cursor:grab}
    .team-stat-card .names > span.name-coach{background:#111;color:#fff;border-color:#111;overflow:visible;text-overflow:clip;grid-column:span 2;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;font-size:0.86rem;white-space:nowrap;cursor:default}
    .team-stat-card .names .cap,.prow .cap,table.data .cap{display:inline-flex;align-items:center;justify-content:center;min-width:1.15rem;height:1.15rem;font-size:0.68rem;font-weight:900;background:#000;padding:0 4px;border-radius:999px;color:#d4ff00;letter-spacing:0;border:1px solid #d4ff00;margin-left:4px;vertical-align:middle}
    .team-stat-card .names .name-coach .cap{background:#000;border:1px solid #d4ff00;color:#d4ff00}
    table.data td.player-cell{text-align:left;white-space:nowrap}
    .team-pick{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:20px;border:var(--glass-border);background:var(--glass);font-weight:900;font-size:1rem;margin-bottom:10px;cursor:pointer;font-family:inherit;width:100%;text-align:left;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .team-pick.picked{border-color:#1d4ed8;background:rgba(219,234,254,.75);box-shadow:var(--raise-sm);color:var(--accent)}
    .hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .hist-item{width:100%;text-align:left;padding:12px 10px;border-radius:16px;border:var(--glass-border);background:var(--glass);margin-bottom:0;font-family:inherit;cursor:pointer;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .hist-item b{font-size:0.82rem;color:#111827;letter-spacing:0;display:block}
    .hist-item .scoreline{font-size:0.8rem;font-weight:800;margin-top:4px;letter-spacing:0}
    .hist-item span{display:block;font-size:0.68rem;color:#374151;margin-top:4px;font-weight:700;letter-spacing:0;line-height:1.3}
    .flow-note{font-size:0.78rem;color:#1f2937;font-weight:700;padding:10px 12px;background:var(--glass);border-radius:16px;border:var(--glass-border);margin-bottom:10px;line-height:1.45;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);letter-spacing:0}
    .score-big{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;padding:12px 12px;border-radius:18px;border:var(--glass-border);margin-bottom:12px;text-align:center;font-weight:900;background:var(--glass);box-shadow:var(--raise);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .score-big .sep{font-size:1.05rem;color:#111827;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-width:2.8rem;padding-top:0}
    .score-big .sep .match-no{font-size:0.95rem;font-weight:900;letter-spacing:0;color:#111827;line-height:1.2;height:1.2em;display:flex;align-items:center}
    .score-big .sep .colon{font-size:1.55rem;color:#6b7280;line-height:1;font-weight:800;margin-top:2px}
    .score-big .side{font-size:1rem;font-weight:900;letter-spacing:0;display:flex;flex-direction:column;align-items:center}
    .score-big .side .tn{font-size:0.95rem;font-weight:900;line-height:1.2;height:1.2em;display:flex;align-items:center}
    .score-big .side .sc{font-size:1.85rem;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1}
    .score-big .pwr{display:none}
    .ctrl-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px}
    .timer-ring-wrap{width:108px;height:108px;position:relative;justify-self:center;border-radius:50%;background:var(--glass-strong);border:var(--glass-border);box-shadow:var(--raise-sm);display:grid;place-items:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .timer-ring-wrap svg{width:96px;height:96px;transform:rotate(-90deg)}
    .timer-ring-wrap .track{fill:none;stroke:rgba(148,163,184,.45);stroke-width:6}
    .timer-ring-wrap .prog{fill:none;stroke:#2563eb;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
    .timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
    .timer-center .t{font-family:-apple-system,BlinkMacSystemFont,ui-monospace,monospace;font-size:1.25rem;font-weight:800;color:#111827;letter-spacing:0}
    .timer-center .l{font-size:0.62rem;font-weight:600;color:#9ca3af;margin-top:2px;letter-spacing:0}
    .btn-sm{width:100%;min-height:48px;padding:12px 10px;border-radius:999px;border:none;font-size:0.86rem;font-weight:800;font-family:inherit;cursor:pointer}
    .btn-sm.gray{background:var(--glass-strong);color:#4b5563;border:var(--glass-border);box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .btn-sm.blue{background:#111111;color:#b8ff3c;box-shadow:0 8px 16px rgba(0,0,0,.18)}
    .btn-sm.blue:active{transform:scale(.98)}
    .tabs{display:flex;gap:6px;margin-bottom:12px;padding:6px;border-radius:999px;background:#f3f4f6;border:1px solid var(--line);box-shadow:var(--press);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .tabs button{flex:1;padding:11px 6px;font-size:0.8rem;font-weight:800;color:#4b5563;border:none;background:transparent;border-radius:999px;font-family:inherit;cursor:pointer;letter-spacing:0}
    .tabs button.on{color:#111827;background:rgba(255,255,255,.92);font-weight:900;box-shadow:0 4px 12px rgba(15,23,42,.14)}
    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .lineup-col{border-radius:20px;overflow:hidden;border:var(--glass-border);background:var(--glass);box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .lineup-col .team-head{padding:12px 8px;text-align:center;font-family:Cinzel,Georgia,serif;font-size:0.82rem;font-weight:900;letter-spacing:0.04em;background:rgba(255,255,255,.45);border-bottom:1px solid rgba(148,163,184,.35)}
    .lineup-col.team-RED .team-head{color:var(--red)}
    .lineup-col.team-BLUE .team-head{color:var(--blue)}
    .lineup-col.team-YELLOW .team-head{color:var(--yellow-text)}
    .lineup-col.team-BLACK .team-head{color:var(--black)}
    .lineup-col .roster{padding:8px}
    .prow{margin-bottom:8px}
    .prow button{width:100%;font-family:inherit;border-radius:999px;text-align:left;padding:12px 14px;font-size:0.95rem;font-weight:900;background:var(--glass-strong);border:var(--glass-border);min-height:48px;cursor:pointer;box-shadow:var(--raise-sm);color:#111827;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);letter-spacing:0;display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;white-space:nowrap}
    .prow button .pname{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .prow button.tap{border-color:#1d4ed8;background:rgba(147,197,253,.65);box-shadow:var(--raise-sm)}
    .prow button.is-coach{background:#111;color:#fff;border-color:#111}
    .lineup-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 8px 10px}
    .lineup-actions.shared{margin-top:10px;margin-bottom:14px;padding:0}
    .btn-sub,.btn-add,.btn-remove{width:100%;margin:0;min-height:46px;padding:10px 4px;border:none;border-radius:999px;background:#111;color:#b8ff3c;font-weight:900;font-size:0.82rem;font-family:inherit;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18)}
    .timeline-card{margin-top:0;margin-bottom:14px}
    .act2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
    .act2 button{padding:12px;min-height:var(--touch-min);border:none;border-radius:999px;font-weight:800;font-size:0.86rem;font-family:inherit;cursor:pointer;background:#111;color:#b8ff3c;box-shadow:0 6px 14px rgba(0,0,0,.16)}
    .act2 .u,.act2 .e{color:#b8ff3c}
    .act2 .s,.btn-end-session{grid-column:1/-1;background:var(--end-session-bg)!important;color:var(--end-session-fg)!important;font-size:calc(0.94rem + 1pt)!important;font-weight:900!important;border:none!important;box-shadow:var(--raise)!important}
    .btn{width:100%;min-height:50px;border:none;border-radius:999px;font-weight:800;font-size:0.94rem;font-family:inherit;cursor:pointer;box-shadow:var(--raise-sm);background:var(--glass-strong);color:#111827;border:var(--glass-border);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .btn-cta{background:#111;color:#b8ff3c;border:none;box-shadow:0 8px 16px rgba(0,0,0,.18)}
    .btn-green{background:#111;color:#b8ff3c;border:none}
    .btn-danger{background:var(--end-session-bg);color:var(--end-session-fg);border:none;font-size:calc(0.94rem + 1pt);font-weight:900;box-shadow:var(--raise)}
    .btn-sec{background:var(--glass-strong);color:#111827;border:var(--glass-border);box-shadow:var(--raise-sm)}
    .nav-row .btn,.nav-row .btn-cta,.nav-row .btn-sec{background:rgba(255,255,255,.88)!important;color:#111827!important;border:var(--glass-border)!important;box-shadow:var(--raise-sm)!important}
    .nav-row .btn-start{background:#2563eb!important;color:#fff!important;border:none!important;box-shadow:0 8px 16px rgba(37,99,235,.28)!important}
    .btn:active{box-shadow:var(--press)}
    .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
    .result-btns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .mvp-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;align-items:stretch}
    .mvp-row .result-hero{padding:16px 6px;min-width:0;min-height:118px;display:flex;flex-direction:column;justify-content:center}
    .mvp-row .eyebrow{font-size:0.58rem;letter-spacing:0.04em;white-space:nowrap}
    .mvp-row .mvp-names{font-size:0.78rem !important;margin-top:10px;white-space:normal;overflow:visible;line-height:1.4;font-weight:900}
    .result-hero{padding:12px 8px;border-radius:16px;background:linear-gradient(160deg,#0c0c0e,#1a1a22 55%,#121218);border:1px solid #c9a22755;box-shadow:none;min-height:0}
    .eyebrow{font-family:Cinzel,Georgia,serif;font-size:0.68rem;font-weight:900;letter-spacing:0.06em;color:#f5e6b8;text-align:center}
    .mvp-names{text-align:center;font-size:0.78rem;font-weight:900;color:#fff;margin-top:8px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:0}
    .mvp-meta{display:inline-block;text-align:center;margin:8px auto 0;padding:3px 8px;font-size:0.76rem;font-weight:800;color:#e7c56a;line-height:1.2;border:1px solid #93c5fd;border-radius:8px;width:fit-content;max-width:100%;letter-spacing:0}
    .result-hero .mvp-meta-wrap{text-align:center}
    .award-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .award{padding:10px;border-radius:12px;background:var(--glass);border:var(--glass-border);font-size:0.74rem;font-weight:700;line-height:1.35;box-shadow:var(--raise-sm);color:#18181b;letter-spacing:0;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .award b{display:block;font-size:0.64rem;color:#57534e;margin-bottom:4px;font-weight:800;letter-spacing:0}
    .result-card{background:var(--glass);border-radius:14px;padding:12px;border:var(--glass-border);margin-bottom:12px;box-shadow:var(--raise-sm);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
    .result-card h3{font-size:0.88rem;font-weight:900;margin-bottom:8px;letter-spacing:0}
    .result-card.stats-card table.data td:first-child{font-weight:800}
    .result-card.stats-card tr:hover td{background:transparent}
    .result-card.team-RED{border-left:4px solid var(--red)}
    .result-card.team-BLUE{border-left:4px solid var(--blue)}
    .result-card.team-YELLOW{border-left:4px solid var(--yellow-fill)}
    .result-card.team-BLACK{border-left:4px solid #4b5563}
    .team-RED,.team-BLUE,.team-YELLOW,.team-BLACK{border-left:none}
    .t-RED,.t-BLUE,.t-YELLOW,.t-BLACK{font-weight:900!important;letter-spacing:0}
    .t-RED{color:var(--red)!important}.t-BLUE{color:var(--blue)!important}
    .t-YELLOW{color:var(--yellow-text)!important}
    .t-BLACK{color:var(--black)!important}
    table.data td.t-RED,table.data td.t-BLUE,table.data td.t-YELLOW,table.data td.t-BLACK{font-weight:900}
    .team-title{font-weight:900;margin-bottom:8px;font-size:0.95rem;line-height:1.2;width:fit-content;letter-spacing:0}
    table.data{width:100%;border-collapse:collapse;font-size:0.72rem;table-layout:fixed;letter-spacing:0}
    table.data th,table.data td{border-bottom:1px solid rgba(148,163,184,.35);padding:7px 1px;text-align:center;white-space:nowrap;font-size:0.72rem;font-weight:700;color:#18181b;letter-spacing:0}
    table.data th{color:#52525b;font-weight:800;font-size:0.72rem}
    table.data td:first-child,table.data th:first-child{text-align:left;padding-left:2px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
    table.data .mp{font-variant-numeric:tabular-nums;font-weight:700}
    table.standings{min-width:100%;table-layout:fixed}
    table.standings th, table.standings td{font-size:0.66rem !important;padding:6px 0 !important;font-weight:700;letter-spacing:0 !important}
    table.standings th{font-size:0.66rem !important}
    table.standings th:nth-child(1), table.standings td:nth-child(1){width:1.5rem}
    table.standings th:nth-child(2), table.standings td:nth-child(2){width:3.6rem;text-align:left;font-weight:900;overflow:hidden;text-overflow:ellipsis}
    table.standings th:nth-child(10), table.standings td:nth-child(10){width:2.4rem}
    table.standings th:nth-child(11), table.standings td:nth-child(11){width:2rem}
    .mvp-mini{margin-bottom:12px}
    .mvp-mini h3{font-size:0.88rem;font-weight:900;margin-bottom:8px;color:#111827;letter-spacing:0}
    .mvp-mini .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 2px;margin-bottom:0;border-radius:0;background:transparent;border:none;border-bottom:1px solid rgba(148,163,184,.35);font-size:0.86rem;font-weight:700;box-shadow:none;letter-spacing:0}
    .mvp-mini .rk{width:1.35rem;height:1.35rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:#6b7280;font-size:0.7rem;flex-shrink:0}
    .mvp-mini .rk.r1{background:#111827}.mvp-mini .rk.r2{background:#374151}.mvp-mini .rk.r3{background:#6b7280}
    .mvp-mini .nm{flex:1;font-weight:900;line-height:1.3;overflow-wrap:anywhere;color:#111827}
    .timeline{max-height:160px;overflow-y:auto;font-size:0.78rem;line-height:1.45;margin-top:10px;letter-spacing:0}
    .timeline li{border-bottom:1px solid rgba(148,163,184,.35);padding:7px 0;list-style:none;font-weight:700}
    .hint{font-size:0.7rem;color:var(--muted);text-align:center;margin:8px 0 4px;line-height:1.45;letter-spacing:0}
    .toast{position:absolute;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%) translateY(12px);background:rgba(17,24,39,.94);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:0.86rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:calc(100% - 28px);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.28);letter-spacing:0;border:1px solid rgba(255,255,255,.12)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .modal-overlay{position:absolute;inset:0;z-index:30;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:250px 16px 16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    .modal-card{width:100%;max-width:360px;max-height:85%;overflow:auto;background:#ffffff;border-radius:24px;padding:18px 16px 16px;border:2px solid var(--modal-accent);box-shadow:0 20px 50px rgba(0,0,0,.28);position:relative}
    .modal-card::before{content:"";display:block;height:8px;border-radius:999px;background:var(--modal-accent);margin:0 40px 14px}
    .modal-card h3{font-size:1.05rem;font-weight:900;text-align:center;margin-bottom:8px;color:#111827;letter-spacing:0}
    .modal-card .msub{font-size:0.8rem;color:#4b5563;text-align:center;margin-bottom:12px;line-height:1.4;letter-spacing:0}
    .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .modal-btns button{min-height:52px;border:none;border-radius:999px;font-weight:900;font-size:0.9rem;font-family:inherit;cursor:pointer}
    .modal-btns .goal,.modal-btns .def,.modal-btns .save{background:#111;color:var(--neon)}
    .modal-btns .own{background:var(--modal-accent);color:#111}
    .modal-btns .cancel{grid-column:1/-1;background:#111;color:var(--neon);min-height:44px}
    .modal-btns .ok{background:#111;color:var(--neon)}
    .modal-btns .no{background:rgba(255,255,255,.9);color:#111;border:1.5px solid #9ca3af}
    .assist-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;justify-content:center}
    .assist-picks button{min-height:54px;padding:14px 6px;border-radius:14px;border:none;background:#111;color:var(--neon);font-weight:900;font-size:0.92rem;font-family:inherit;cursor:pointer;box-shadow:var(--raise-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pool-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
    .pool-list button{min-height:52px;padding:12px 6px;border-radius:14px;border:none;background:#111;color:var(--neon);font-weight:900;font-family:inherit;cursor:pointer;font-size:0.88rem;box-shadow:var(--raise-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;max-width:100%}
    .pool-list button .nm{white-space:nowrap}
    .pool-list .team-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#9ca3af}
    .pool-list .team-dot.RED{background:var(--red)}.pool-list .team-dot.BLUE{background:var(--blue)}.pool-list .team-dot.YELLOW{background:var(--yellow-fill)}.pool-list .team-dot.BLACK{background:#4b5563}
    .pool-list button.on{box-shadow:0 0 0 2px var(--neon);outline:none}
    .chip,.chip-grid .chip{white-space:nowrap}
    .past-sessions{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
    .past-sessions .past-btn{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:var(--glass-border);background:var(--glass-strong);box-shadow:var(--raise-sm);font-family:inherit;cursor:pointer}
    .past-sessions .past-btn b{display:block;font-size:0.95rem;font-weight:900;color:#111;margin-bottom:4px}
    .past-sessions .past-btn span{display:block;font-size:0.75rem;color:#6b7280;font-weight:700}
    .past-sessions .past-btn.on{border-color:#1d4ed8;background:rgba(219,234,254,.75)}

    .phone{max-width:100%!important;min-height:100dvh!important;border:none!important;border-radius:0!important;box-shadow:none!important}

<script>
const STORAGE_KEY='jmfc_session_v2';
const ARCHIVE_KEY='jmfc_sessions_archive_v1';
const LAST_ATT_KEY='jmfc_last_attending_v1';
const TEAM_ALL=['RED','BLUE','YELLOW','BLACK'];
const DETAIL_ORDER=['RED','BLUE','YELLOW','BLACK'];
const STANDINGS_ORDER=['RED','BLUE','YELLOW','BLACK'];
const FLOW=['attendance','coach','draft','lineup','matchSelect','match','results'];
const FLOW_LABEL={attendance:'참석',coach:'감독',draft:'드래프트',lineup:'라인업',matchSelect:'경기선택',match:'경기',results:'결과'};
let PLAYERS=[];
let byName={};
let maxCcpG=1;
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
let persistTimer=null;
function normalizeWinRatePct(v){
  const n=Number(v);
  if(!isFinite(n)||n<=0) return 0;
  // 시트 비율(0.524) · 퍼센트(52.4) · 퍼센트서식 오입력 혼재 → 0~100 표시값
  if(n<=1) return Math.round(n*1000)/10; // 0.524 → 52.4
  if(n<=100) return Math.round(n*10)/10;
  return Math.round(n)/10;
}
function mapMasterPlayer(p){
  const raw=p.winRate!=null?p.winRate:p.winRatePct;
  return {
    name:p.name,
    position:p.position||'',
    winRatePct:normalizeWinRatePct(raw),
    ccpPerGame:Number(p.ccp)!=null&&p.ccp!==undefined?Number(p.ccp):(Number(p.ccpPerGame)||0),
    games:Number(p.games)||0,
    isMercenary:!!p.isMercenary || String(p.name||'').startsWith('용병'),
    att:Number(p.att)||0,
    def:Number(p.def)||0,
    mp:Number(p.mp)||0,
    mpPerGame:Number(p.mpPerGame)||0
  };
}
function refreshPlayerIndex(){
  byName=Object.fromEntries(PLAYERS.map(p=>[p.name,p]));
  maxCcpG=Math.max(...PLAYERS.map(p=>p.ccpPerGame||0),1);
}
function persistState(force){
  if(!IS_GAS) return;
  const payload=JSON.parse(JSON.stringify(state));
  // strip ephemeral UI
  payload.modal=null; payload.timerRunning=false;
  const run=()=>google.script.run.withFailureHandler(err=>console.error('saveAppState',err)).saveAppState(payload);

    <button type="button" class="team-chip" data-act="cycle-team" data-idx="${i}" title="탭해서 팀 변경"><span class="dot ${s.team}"></span><span class="chip-lab">팀변경</span></button>
    <span class="pname ${s.name?'':'empty'}" title="${s.name||''}">${s.name||(i===cur?'← 픽':'대기')}</span>
    ${s.name?`<button type="button" class="mini clear-x" data-act="clear-pick" data-idx="${i}" style="padding:4px 8px;font-size:0.7rem">✕</button>`:''}
  </div>
</div>`).join('')||'<p class="sub">배정할 선수 없음</p>';
return `<h2>드래프트</h2>
<p class="sub">선수 탭으로 픽 · 색 칩=팀변경 · 행 드래그=순서 · 아래 카드에서 팀 이동</p>
<div class="chip-row one-line" style="grid-template-columns:1fr 1fr"><button type="button" class="mini" data-act="random-assign">랜덤 배정</button><button type="button" class="mini" data-act="clear-draft-names">배정 초기화</button></div>
<div class="draft-board">
  <div class="section-card" style="margin:0"><h3>남은 선수 · 연속 선택</h3>
    <div class="chip-grid">${pool.map(n=>`<button type="button" class="chip" data-act="pick-player" data-name="${n}">${n}</button>`).join('')||'<p class="sub">모두 배정됨</p>'}</div>
  </div>
  <div class="section-card" style="margin:0"><h3>픽 순서 · ${cur>=0?`다음 #${cur+1}`:'완료'}</h3>
    <div class="draft-list">${pickRows}</div>
  </div>
</div>
<div class="team-cards">${teamNames().map(t=>teamCardHtml(t,{editable:true})).join('')}</div>
${navRow('coach',null,!!pool.length,'data-act="to-lineup"','다음 →')}`;}

function renderLineup(){return `<h2>${state.teamMode}팀 라인업</h2><p class="sub">${formatDateLabel(state.sessionDate)} · 팀승률(용병 제외) · 표시순서는 랜덤(감독 고정)</p><div class="team-cards">${teamNames().map(teamCardHtml).join('')}</div>${navRow('draft','matchSelect',false,null,'다음 →')}`;}

function renderMatchSelect(){const picks=state.playing;const opts=Array.from({length:6},(_,i)=>{const m=i+7;return `<option value="${m*60}" ${state.duration===m*60?'selected':''}>${m}분</option>`;}).join('');
const histItems=(state.matchHistory||[]).map(h=>`<button type="button" class="hist-item" data-act="edit-match" data-id="${h.id}"><b>Match #${h.num}</b><div class="scoreline"><span class="t-${h.a}">${h.a}</span> ${h.scoreA}:${h.scoreB} <span class="t-${h.b}">${h.b}</span></div><span>탭 · 다시 보기/수정</span></button>`).join('');
return `<h2>경기 선택</h2>
<div class="chip-row"><span class="mini on">Match #${state.matchCount}</span></div>
<div class="flow-note">2팀 선택 후 시작 · 지난 경기는 아래에서 다시 열어 수정</div>
<div class="section-card"><div class="label-sm">경기 시간 (7~12분)</div><select class="field" id="duration" style="margin:0">${opts}</select></div>
<div class="result-btns" style="margin-top:4px"><button class="btn btn-danger btn-end-session" data-act="ask-end-session">전체 세션 종료</button></div>
${navRow('lineup',null,picks.length!==2,'data-act="start-match"','경기시작',true)}
<p class="sub" style="margin-top:14px">경기 팀 선택 · ${picks.length} / 2</p>
${teamNames().map(t=>{const st=state.teamStats[t];const on=picks.includes(t);return `<button type="button" class="team-pick ${t} ${on?'picked':''}" data-act="toggle-play" data-team="${t}"><span><span class="t-${t}">TEAM ${t}</span><div style="font-size:0.8rem;font-weight:800;color:#1f2937;margin-top:6px">오늘 ${st.wins}승 ${st.draws}무 ${st.losses}패</div></span><span style="font-size:0.82rem;font-weight:900;color:${on?'#1d4ed8':'#4b5563'}">${on?'✓ 선택':'선택'}</span></button>`;}).join('')}
${histItems?`<div class="section-card" style="margin-top:16px"><h3>지난 경기 · 탭해서 다시 보기</h3><div class="hist-grid">${histItems}</div></div>`:'<p class="sub" style="margin-top:12px">아직 완료된 경기가 없습니다</p>'}`;
}

function waitingTeams(){return teamNames().filter(t=>!state.playing.includes(t));}
function allPoolNames(){return state.attending.slice().sort((a,b)=>a.localeCompare(b,'ko'));}

function modalHtml(){
  if(!state.modal)return '';
  const m=state.modal;
  if(m.type==='record'){return `<div class="modal-overlay"><div class="modal-card"><h3>${m.name} (<span class="t-${m.team}">TEAM ${m.team}</span>)</h3><p class="msub">기록을 선택하세요</p><div class="modal-btns"><button class="goal" data-act="rec" data-stat="goal">득점</button><button class="def" data-act="rec" data-stat="defense">수비</button><button class="save" data-act="rec" data-stat="save">선방</button><button class="own" data-act="rec" data-stat="own">자책골</button><button class="cancel" data-act="close-modal">취소</button></div></div></div>`;}
  if(m.type==='assist'){const mates=(state.teams[m.team]||[]).filter(n=>n!==m.scorer);return `<div class="modal-overlay"><div class="modal-card"><h3>${m.scorer} 선수 득점!</h3><p class="msub">도움을 준 선수를 선택하세요</p><div class="assist-picks">${mates.map(n=>`<button type="button" data-act="pick-assist" data-name="${n}">${n}</button>`).join('')}<button type="button" data-act="pick-assist" data-name="">없음</button></div><button class="btn btn-sec" style="margin-top:12px" data-act="close-modal">취소</button></div></div>`;}
  if(m.type==='confirm-end-match'){return `<div class="modal-overlay"><div class="modal-card"><h3>현재 경기 종료</h3><p class="msub">이 경기를 종료하고<br>경기 선택으로 갈까요?</p><div class="modal-btns"><button class="ok" data-act="confirm-end-match">확인</button><button class="no" data-act="close-modal">취소</button></div></div></div>`;}
  if(m.type==='confirm-end-session'){return `<div class="modal-overlay"><div class="modal-card"><h3>전체 세션 종료</h3><p class="msub">오늘의 모든 경기를 끝내고<br>결과 화면으로 갈까요?</p><div class="modal-btns"><button class="ok" data-act="confirm-end-session">확인</button><button class="no" data-act="close-modal">취소</button></div></div></div>`;}
  if(m.type==='add'){
    const target=m.targetTeam||state.playing[0];
    const wait=waitingTeams();
    const waitPlayers=wait.flatMap(t=>(state.teams[t]||[]).map(n=>({n,t})));
    const waitSet=new Set(waitPlayers.map(x=>x.n));
    const onTarget=new Set(state.teams[target]||[]);
    const teamOf=n=>{for(const t of TEAM_ALL){if((state.teams[t]||[]).includes(n)) return t;} return '';};
    const fullRoster=allPoolNames().filter(n=>!onTarget.has(n)&&!waitSet.has(n));
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 추가</h3><p class="msub">어느 팀에 넣을까요?</p>
      <div class="seg">${state.playing.map(t=>`<button type="button" class="${target===t?'on':''}" data-act="add-target" data-team="${t}">${t}</button>`).join('')}</div>
      <p class="label-sm">대기팀</p>
      <div class="pool-list">${waitPlayers.map(x=>`<button type="button" data-act="do-add" data-name="${x.n}" data-from="${x.t}"><span class="team-dot ${x.t}"></span><span class="nm">${x.n}</span></button>`).join('')||'<span class="sub">대기 선수 없음</span>'}</div>
      <p class="label-sm">전체 명단 (미참석 포함)</p>
      <div class="pool-list">${allClubNames().filter(n=>!onTarget.has(n)&&!waitSet.has(n)).map(n=>{const from=teamOf(n);return `<button type="button" data-act="do-add" data-name="${n}" data-from="${from}">${from?`<span class="team-dot ${from}"></span>`:''}<span class="nm">${n}</span></button>`;}).join('')||'<span class="sub">추가 가능 인원 없음</span>'}</div>
      <button class="btn btn-sec" data-act="close-modal">닫기</button></div></div>`;
  }
  if(m.type==='load-session'){
    const rows=listSavedSessions();
    return `<div class="modal-overlay"><div class="modal-card"><h3>세션 불러오기</h3><p class="msub">저장한 날짜를 고르면 결과 화면으로 복원됩니다</p>
      <div class="pool-list">${rows.map(p=>{const n=(p.matchHistory||[]).length;const att=(p.attending||[]).length;return `<button type="button" data-act="do-load-session" data-date="${p.sessionDate}"><span class="nm">${formatDateLabel(p.sessionDate)} · ${p.teamMode||'?'}팀 · 경기 ${n} · 참석 ${att}</span></button>`;}).join('')||'<span class="sub">아직 저장된 세션이 없습니다. 결과에서 「기록 저장 & NEW 세션」을 누르세요.</span>'}</div>
      <button class="btn btn-sec" data-act="close-modal">닫기</button></div></div>`;
  }
  if(m.type==='draft-add'){
    const target=m.team||teamNames()[0];
    const onTarget=new Set(state.teams[target]||[]);
    const teamOf=n=>{for(const t of TEAM_ALL){if((state.teams[t]||[]).includes(n)) return t;} return '';};
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 추가 · TEAM ${target}</h3><p class="msub">전체 명단에서 선택 (참석 외 포함)</p>
      <div class="seg">${teamNames().map(t=>`<button type="button" class="${target===t?'on':''}" data-act="draft-add-target" data-team="${t}">${t}</button>`).join('')}</div>
      <div class="pool-list">${allClubNames().filter(n=>!onTarget.has(n)).map(n=>{const from=teamOf(n);return `<button type="button" data-act="do-draft-add" data-name="${n}" data-to="${target}"><span class="nm">${n}</span></button>`;}).join('')}</div>
      <button class="btn btn-sec" data-act="close-modal">닫기</button></div></div>`;
  }
  if(m.type==='draft-del'){
    const team=m.team||teamNames()[0];
    const coach=state.coaches[team];
    const names=(state.teams[team]||[]).filter(n=>n!==coach);
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 삭제 · TEAM ${team}</h3><p class="msub">감독은 삭제할 수 없습니다</p>
      <div class="pool-list">${names.map(n=>`<button type="button" data-act="do-draft-del" data-name="${n}" data-team="${team}"><span class="nm">${n}</span></button>`).join('')||'<span class="sub">삭제 가능 선수 없음</span>'}</div>
      <button class="btn btn-sec" data-act="close-modal">닫기</button></div></div>`;
  }
  if(m.type==='remove'){
    const team=m.team||state.playing[0];
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 제거</h3><p class="msub">코트에서 내릴 선수를 선택</p>
      <div class="seg">${state.playing.map(t=>`<button type="button" class="${team===t?'on':''}" data-act="remove-target" data-team="${t}">${t}</button>`).join('')}</div>
      <p class="label-sm">TEAM ${team}</p>
      <div class="pool-list">${(state.teams[team]||[]).map(n=>`<button type="button" data-act="do-remove" data-name="${n}" data-team="${team}"><span class="nm">${n}</span></button>`).join('')||'<span class="sub">선수 없음</span>'}</div>
      <button class="btn btn-sec" data-act="close-modal">닫기</button></div></div>`;
  }
  if(m.type==='sub'){
    const team=m.team||state.playing[0];
    const out=m.out;
    const wait=waitingTeams();
    const waitPlayers=wait.flatMap(t=>(state.teams[t]||[]).map(n=>({n,t})));
    const inPlay=new Set(state.playing.flatMap(t=>state.teams[t]||[]));
    const others=allPoolNames().filter(n=>!inPlay.has(n));
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 교체</h3>
      <div class="seg">${state.playing.map(t=>`<button type="button" class="${team===t?'on':''}" data-act="sub-target" data-team="${t}">${t}</button>`).join('')}</div>
      <p class="label-sm">나가는 선수 · TEAM ${team}</p>
      <div class="pool-list">${(state.teams[team]||[]).map(n=>`<button type="button" class="${out===n?'on':''}" data-act="sub-out" data-name="${n}"><span class="nm">${n}</span></button>`).join('')}</div>
      <p class="label-sm">대기팀 / 전체에서 들어오기</p>
      <div class="pool-list">${waitPlayers.map(x=>`<button type="button" data-act="do-sub" data-name="${x.n}" data-from="${x.t}" ${out?'':'disabled'}><span class="team-dot ${x.t}"></span><span class="nm">${x.n}</span></button>`).join('')}
      ${others.filter(n=>!waitPlayers.some(x=>x.n===n)).map(n=>`<button type="button" data-act="do-sub" data-name="${n}" data-from="" ${out?'':'disabled'}><span class="nm">${n}</span></button>`).join('')}</div>
      <div class="modal-btns" style="margin-top:8px"><button class="no" data-act="do-sub-remove" ${out?'':'disabled'}>코트 아웃만</button><button class="cancel" data-act="close-modal">닫기</button></div></div></div>`;
  }
  return '';
}

function renderMatch(){
  const [a,b]=state.playing; if(!a||!b) return `<p class="sub">경기를 선택하세요</p><button class="btn btn-cta" data-act="go" data-screen="matchSelect">경기 선택</button>`;
  const tab=state.matchTab; let body='';
  if(tab==='lineup'){
    body=`<div class="lineup-grid">${[a,b].map(t=>`<div class="lineup-col team-${t}"><div class="team-head">TEAM ${t}</div><div class="roster">${rosterOrdered(t).map(n=>{const isC=state.coaches[t]===n;return `<div class="prow"><button type="button" class="${state.selectedPlayer===n?'tap':''}${isC?' is-coach':''}" data-act="open-record" data-name="${n}" data-team="${t}"><span class="pname">${n}</span>${isC?'<span class="cap">C</span>':''}</button></div>`;}).join('')}</div>
    </div>`).join('')}</div>
    <div class="lineup-actions shared"><button class="btn-sub" data-act="open-sub">선수교체</button><button class="btn-remove" data-act="open-remove">선수제거</button><button class="btn-add" data-act="open-add">선수추가</button></div>
    <div class="section-card timeline-card"><h3>타임라인</h3><ul class="timeline">${(state.timeline||[]).map(e=>`<li>[${e.time}] <span class="t-${e.team}">${e.player}</span> · ${statLabel(e.stat)}${e.assist?` (도움:${e.assist})`:''}</li>`).join('')||'<li style="color:var(--muted)">기록 없음</li>'}</ul></div>
    <div class="act2"><button class="u" data-act="undo-rec">이전 스탯 취소</button><button class="e" data-act="ask-end-match">현재 경기 종료</button><button class="s btn-end-session" data-act="ask-end-session">전체 세션 종료</button></div>`;
  } else if(tab==='standings'){
    body=standingsTableHtml();
  } else {
    const mvp3=(kind,title)=>{const list=topList(kind).slice(0,3);const rows=list.map((p,i)=>`<div class="row"><span class="rk r${i+1}">${i+1}</span><span class="nm">${p.name}</span><span>${p.v}P</span></div>`).join('')||'<p class="sub">기록 없음</p>';return `<h3 style="margin-top:${kind==='dfn'?'14px':'0'}">${title}</h3>${rows}`;};
    body=`<div class="result-card mvp-mini">${mvp3('atk','Attack MVP TOP3')}${mvp3('dfn','Defense MVP TOP3')}</div>
    <h3 style="font-size:0.92rem;font-weight:900;margin:4px 0 8px">팀별 선수 스탯</h3>
    ${activeDetailOrder().map(t=>teamPlayerTable(t).replace('class="result-card','class="result-card stats-card')).join('')}`;
  }
  const ratio=state.duration>0?Math.max(0,Math.min(1,state.secondsLeft/state.duration)):0;
  const circ=2*Math.PI*46;
  const dash=circ*(1-ratio);
  const matchNo=state.editingMatchId?((state.matchHistory.find(x=>x.id===state.editingMatchId)||{}).num||state.matchCount):state.matchCount;
  return `<div class="score-big"><div class="side t-${a}"><div class="tn">TEAM ${a}</div><div class="sc">${state.score.A}</div></div><div class="sep"><div class="match-no">#${matchNo}</div><div class="colon">:</div></div><div class="side t-${b}"><div class="tn">TEAM ${b}</div><div class="sc">${state.score.B}</div></div></div>
<div class="ctrl-row"><button type="button" class="btn-sm gray" data-act="reset-prev">리셋</button>
<div class="timer-ring-wrap"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="track" cx="56" cy="56" r="46"></circle><circle class="prog" id="timer-prog" cx="56" cy="56" r="46" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"></circle></svg><div class="timer-center"><div class="t" id="timer-text">${fmtTime(state.secondsLeft)}</div><div class="l">남은 시간</div></div></div>
<button type="button" class="btn-sm blue" data-act="toggle-timer">${state.timerRunning?'일시정지':'시작'}</button></div>
<div class="tabs"><button type="button" class="${tab==='lineup'?'on':''}" data-act="match-tab" data-tab="lineup">라인업</button><button type="button" class="${tab==='standings'?'on':''}" data-act="match-tab" data-tab="standings">팀 순위</button><button type="button" class="${tab==='stats'?'on':''}" data-act="match-tab" data-tab="stats">개인기록</button></div>
${body}
${navRow('matchSelect',null,false, state.editingMatchId?'data-act="ask-end-match"':'data-act="go" data-screen="results"', state.editingMatchId?'수정 저장 →':'다음 →')}`;}

function coachLeaders(){return Object.entries(state.coaches).map(([team,name])=>{const s=state.teamStats[team]||{wins:0,draws:0,goalsFor:0,goalsAgainst:0};const pts=(s.wins||0)*3+(s.draws||0);const gd=(s.goalsFor||0)-(s.goalsAgainst||0);return {name,team,pts,gd,v:pts};}).filter(x=>x.name).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||a.name.localeCompare(b.name,'ko'));}
function renderResults(){
  const atk=topList('atk'), dfn=topList('dfn'), coach=coachLeaders();
  const mvpCard=(list,eyebrow)=>{
    if(!list.length) return `<div class="result-hero"><div class="eyebrow">${eyebrow}</div><div class="mvp-names">-</div></div>`;
    const top=list[0].v; const arr=list.filter(x=>x.v===top).map(x=>x.name);
    const names=formatMvpNames(arr);
    return `<div class="result-hero"><div class="eyebrow">${eyebrow}</div><div class="mvp-names" title="${arr.join(' · ')}">${names}</div></div>`;
  };
  const topAward=(kind,label)=>{
    const t=topList(kind); if(!t.length) return `<div class="award"><b>${label}</b>-</div>`;
    const names=t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ');
    return `<div class="award"><b>${label}</b>${names} ${t[0].v}</div>`;
  };
  return `<h2>오늘의 경기 결과</h2>
<p class="sub" style="font-size:0.72rem">${formatDateLabel(state.sessionDate)} · ${state.teamMode}팀</p>
<div class="mvp-row">
${mvpCard(atk,'ATTACK MVP')}
${mvpCard(coach,'BEST COACH')}
${mvpCard(dfn,'DEFENSE MVP')}
</div>
<div class="award-g">
${topAward('goal','TOP SCORER')}
${topAward('assist','TOP ASSIST')}
${topAward('defense','TOP DEFENSE')}
${topAward('save','TOP SAVE')}
</div>
<h3 style="font-size:calc(0.88rem + 1pt);font-weight:900;margin:2px 0 8px">팀 순위</h3>
${standingsTableHtml()}
${activeDetailOrder().map(t=>teamPlayerTable(t).replace('class="result-card','class="result-card stats-card')).join('')}
<p class="hint">공격P=득점×2+도움×2 · 수비P=수비+선방 · MP=공격P+수비P</p>
${(()=>{const rows=listSavedSessions(); if(!rows.length) return `<h3 style="font-size:0.92rem;font-weight:900;margin:14px 0 8px">지난 경기 결과</h3><p class="sub">아직 저장된 세션이 없습니다. 아래에서 저장하면 여기에 나타납니다.</p>`; return `<h3 style="font-size:0.92rem;font-weight:900;margin:14px 0 8px">지난 경기 결과</h3><p class="sub">날짜를 탭하면 그 세션 결과로 전환됩니다</p><div class="past-sessions">${rows.map(p=>{const n=(p.matchHistory||[]).length; const att=(p.attending||[]).length; const on=p.sessionDate===state.sessionDate?' on':''; return `<button type="button" class="past-btn${on}" data-act="do-load-session" data-date="${p.sessionDate}"><b>${formatDateLabel(p.sessionDate)}</b><span>${p.teamMode||'?'}팀 · 경기 ${n}회 · 참석 ${att}명</span></button>`;}).join('')}</div>`;})()}
<div class="result-btns"><button class="btn btn-green" data-act="go" data-screen="edit">기록 수정하기</button><button class="btn btn-cta" data-act="save-new">기록 저장 & NEW 세션</button><button class="btn btn-danger btn-end-session" data-act="reset-new">기록 리셋 & NEW 세션</button></div>

}
function renderEdit(){return `<h2>기록 수정</h2><p class="sub">숫자 변경 시 MP 재계산</p>${activeDetailOrder().map(t=>{const names=state.teams[t]||[];return `<div class="result-card team-${t}"><div class="team-title t-${t}">TEAM ${t}</div><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${names.map(n=>{const s=ensureStat(n,t);return `<tr data-edit-name="${n}"><td>${n}</td><td><input type="number" min="0" data-f="goal" value="${s.goal||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="assist" value="${s.assist||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="defense" value="${s.defense||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="save" value="${s.save||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td class="mp" data-mp>${mpOf(s)}</td></tr>`;}).join('')}</tbody></table></div>`;}).join('')}<div class="result-btns"><button class="btn btn-cta" data-act="save-edit">수정 완료 → 결과로</button></div>${navRow('results',null,false,'data-act="save-edit"','수정 완료 →')}`;}

function stopTimer(){state.timerRunning=false;if(timerId){clearInterval(timerId);timerId=null;}}
function updateTimerUI(){const text=document.getElementById('timer-text'); if(text) text.textContent=fmtTime(state.secondsLeft); const prog=document.getElementById('timer-prog'); if(prog){const circ=2*Math.PI*46; const ratio=state.duration>0?Math.max(0,Math.min(1,state.secondsLeft/state.duration)):0; prog.style.strokeDasharray=String(circ); prog.style.strokeDashoffset=String(circ*(1-ratio));}}
function toggleTimer(){if(state.timerRunning){stopTimer();render();return;}state.timerRunning=true;timerId=setInterval(()=>{if(state.secondsLeft<=0){stopTimer();toast('경기 시간 종료');render();return;}state.secondsLeft--;updateTimerUI();},1000);render();}

function rebuildTeamStatsFromHistory(){
  const stats=emptyTeamStats();
  (state.matchHistory||[]).forEach(h=>{
    const A=stats[h.a], B=stats[h.b]; if(!A||!B) return;
    A.matchesPlayed++; B.matchesPlayed++;
    A.goalsFor+=h.scoreA; A.goalsAgainst+=h.scoreB; B.goalsFor+=h.scoreB; B.goalsAgainst+=h.scoreA;
    if(h.scoreA>h.scoreB){A.wins++;B.losses++;} else if(h.scoreA<h.scoreB){B.wins++;A.losses++;} else {A.draws++;B.draws++;}
  });
  state.teamStats=stats;
}

function endMatch(){
  stopTimer(); const [a,b]=state.playing; const sa=state.score.A, sb=state.score.B;
  const rosterA=[...(state.teams[a]||[])]; const rosterB=[...(state.teams[b]||[])];
  const entry={id:state.editingMatchId||Date.now(), num:state.editingMatchId? (state.matchHistory.find(x=>x.id===state.editingMatchId)||{}).num || state.matchCount : state.matchCount, a,b,scoreA:sa,scoreB:sb,timeline:[...(state.timeline||[])],rosterA,rosterB};
  if(state.editingMatchId){const i=state.matchHistory.findIndex(x=>x.id===state.editingMatchId); if(i>=0) state.matchHistory[i]=entry; else state.matchHistory.push(entry);}
  else {state.matchHistory.push(entry); state.matchCount++;}
  rebuildTeamStatsFromHistory();
  // 용병/타팀 출전 포함: 그 경기에 뛴 팀 성적(승무패)을 선수에게 반영
  if(!state.editingMatchId){
    let resA='draw'; if(sa>sb)resA='win'; else if(sa<sb)resA='loss';
    rosterA.forEach(n=>{const s=ensureStat(n,a); if(resA==='win')s.wins++; else if(resA==='loss')s.losses++; else s.draws++;});
    rosterB.forEach(n=>{const s=ensureStat(n,b); if(resA==='win')s.losses++; else if(resA==='loss')s.wins++; else s.draws++;});
  }
  // 용병/교체 스탯·승무패는 위에서 반영한 뒤, 다음 경기를 위해 최초 라인업 복원
  restoreBaseTeams();
  state.playing=[]; state.score={A:0,B:0}; state.selectedPlayer=null; state.recordStack=[]; state.timeline=[]; state.editingMatchId=null; state.modal=null;
  toast('경기 종료 · 최초 라인업 복원'); persistState(true); go('matchSelect');
}

function bind(){
  const dateEl=document.getElementById('session-date'); if(dateEl) dateEl.onchange=()=>{state.sessionDate=dateEl.value||todayStr();};
  const dur=document.getElementById('duration'); if(dur) dur.onchange=()=>{state.duration=Number(dur.value); state.secondsLeft=state.duration;};
  document.querySelectorAll('[data-act]').forEach(el=>{el.onclick=(e)=>{
    if(e&&e.preventDefault) e.preventDefault();
    if(e&&e.stopPropagation) e.stopPropagation();
    const act=el.dataset.act;
    if(act==='toggle-att'){const n=el.dataset.name; if(state.attending.includes(n)) state.attending=state.attending.filter(x=>x!==n); else state.attending.push(n); persistState(); render();}
    else if(act==='set-mode'){state.teamMode=Number(el.dataset.mode); Object.keys(state.coaches).forEach(t=>{if(!teamNames().includes(t)) delete state.coaches[t];}); render();}
    else if(act==='load-last-att') loadLastAttending();
    else if(act==='open-load-session'){state.modal={type:'load-session'}; render();}
    else if(act==='do-load-session'){loadSavedSession(el.dataset.date);}
    else if(act==='select-all'){state.attending=PLAYERS.filter(p=>!p.isMercenary).map(p=>p.name); render();}
    else if(act==='clear-att'){state.attending=[]; render();}
    else if(act==='to-coach'){if(state.attending.length<state.teamMode) return toast('인원 부족'); saveLastAttending(state.attending); state.coachPickTeam=teamNames()[0]; go('coach');}
    else if(act==='pick-slot'){state.coachPickTeam=el.dataset.team; render();}
    else if(act==='set-coach-name'){const n=el.dataset.name; const t=state.coachPickTeam||teamNames().find(x=>!state.coaches[x]); if(!t)return; Object.keys(state.coaches).forEach(k=>{if(state.coaches[k]===n) delete state.coaches[k];}); state.coaches[t]=n; state.coachPickTeam=teamNames().find(x=>!state.coaches[x])||t; render();}
    else if(act==='to-draft'){if(!teamNames().every(t=>state.coaches[t])) return toast('감독을 모두 지정하세요'); state.teams=emptyTeams(); teamNames().forEach(t=>{if(state.coaches[t]) state.teams[t].push(state.coaches[t]);}); rebuildDraftSlots(); go('draft');}
    else if(act==='random-assign'){randomAssignNonCoaches(); render();}
    else if(act==='clear-draft-names'){state.draftSlots.forEach(s=>s.name=null); applyDraftSlotsToTeams(); rebuildDraftSlots(); render();}
    else if(act==='cycle-team'){cycleSlotTeam(Number(el.dataset.idx),1); render();}
    else if(act==='draft-add'){state.modal={type:'draft-add',team:el.dataset.team}; render();}
    else if(act==='draft-add-target'){state.modal={...state.modal,team:el.dataset.team}; render();}
    else if(act==='do-draft-add'){const name=el.dataset.name; const to=el.dataset.to||state.modal.team; if(!state.attending.includes(name)) state.attending.push(name); movePlayerToTeam(name,to); state.modal=null; toast(`${name} → ${to}`); render();}
    else if(act==='draft-del'){state.modal={type:'draft-del',team:el.dataset.team}; render();}
    else if(act==='do-draft-del'){const name=el.dataset.name; const team=el.dataset.team; if(state.coaches[team]===name) return toast('감독은 삭제 불가'); state.teams[team]=(state.teams[team]||[]).filter(n=>n!==name); syncDraftSlotsFromTeams(); state.modal=null; toast(`${name} 삭제`); render();}
    else if(act==='clear-pick'){state.draftSlots[Number(el.dataset.idx)].name=null; applyDraftSlotsToTeams(); render();}
    else if(act==='pick-player'){const idx=currentDraftIdx(); if(idx<0) return toast('빈 칸 없음'); state.draftSlots[idx].name=el.dataset.name; applyDraftSlotsToTeams(); render();}
    else if(act==='to-lineup'){applyDraftSlotsToTeams(); if(remainingPool().length) return toast('선수를 모두 배정하세요'); Object.entries(state.teams).forEach(([t,names])=>names.forEach(n=>ensureStat(n,t))); shuffleTeamRostersInPlace(); snapshotBaseTeams(); toast('라인업 순서 랜덤 섞음'); go('lineup');}
    else if(act==='toggle-play'){const t=el.dataset.team; if(state.playing.includes(t)) state.playing=state.playing.filter(x=>x!==t); else if(state.playing.length<2) state.playing.push(t); else toast('2팀만 선택'); render();}
    else if(act==='start-match'){if(state.playing.length!==2) return toast('2팀을 선택하세요'); restoreBaseTeams(); const d=document.getElementById('duration'); if(d) state.duration=Number(d.value); state.secondsLeft=state.duration; state.score={A:0,B:0}; state.selectedPlayer=null; state.recordStack=[]; state.timeline=[]; state.editingMatchId=null; state.matchTab='lineup'; stopTimer(); go('match');}
    else if(act==='edit-match'){const id=Number(el.dataset.id); const h=state.matchHistory.find(x=>x.id===id); if(!h) return; state.editingMatchId=h.id; state.playing=[h.a,h.b]; state.score={A:h.scoreA,B:h.scoreB}; state.timeline=[...(h.timeline||[])]; state.matchTab='lineup'; state.secondsLeft=state.duration; stopTimer(); go('match'); toast(`Match #${h.num} 수정`);}
    else if(act==='match-tab'){state.matchTab=el.dataset.tab; render();}
    else if(act==='toggle-timer') toggleTimer();
    else if(act==='reset-prev'||act==='reset-score'){while(state.recordStack.length){const last=state.recordStack.pop(); const s=ensureStat(last.name,last.team); s[last.stat]=Math.max(0,(s[last.stat]||0)-1); if(last.stat==='goal'){const [xa,xb]=state.playing; if(last.team===xa) state.score.A=Math.max(0,state.score.A-1); if(last.team===xb) state.score.B=Math.max(0,state.score.B-1);}} state.score={A:0,B:0}; state.timeline=[]; state.recordStack=[]; toast('이전기록 리셋'); render();}
    else if(act==='open-record'){state.selectedPlayer=el.dataset.name; state.modal={type:'record',name:el.dataset.name,team:el.dataset.team}; render();}
    else if(act==='close-modal'){state.modal=null; render();}
    else if(act==='rec'){const stat=el.dataset.stat; const n=state.modal.name; const t=state.modal.team; const s=ensureStat(n,t); const time=elapsedClock(); const [xa,xb]=state.playing; if(stat==='own'){ if(t===xa) state.score.B++; if(t===xb) state.score.A++; state.recordStack.push({name:n,stat:'own',team:t}); state.timeline.push({time,player:n,team:t,stat:'own'}); state.modal=null; render(); toast(`${n} · 자책골 기록`,2800); return;} s[stat]=(s[stat]||0)+1; state.recordStack.push({name:n,stat,team:t}); if(stat==='goal'){ if(t===xa) state.score.A++; if(t===xb) state.score.B++; state.timeline.push({time,player:n,team:t,stat}); state.modal={type:'assist',scorer:n,team:t}; render(); toast(`${n} · 득점 +1`,1800); return;} state.timeline.push({time,player:n,team:t,stat}); state.modal=null; render(); toast(`${n} · ${statLabel(stat)} +1`,2800);}
    else if(act==='pick-assist'){const an=el.dataset.name; if(an){const s=ensureStat(an,state.modal.team); s.assist=(s.assist||0)+1; state.recordStack.push({name:an,stat:'assist',team:state.modal.team}); const last=state.timeline[state.timeline.length-1]; if(last&&last.stat==='goal') last.assist=an; toast(`${an} 도움+1`);} state.modal=null; render();}
    else if(act==='undo-rec'){const last=state.recordStack.pop(); if(!last) return toast('취소할 기록 없음'); const s=ensureStat(last.name,last.team); const [xa,xb]=state.playing; if(last.stat==='own'){ if(last.team===xa) state.score.B=Math.max(0,state.score.B-1); if(last.team===xb) state.score.A=Math.max(0,state.score.A-1);} else { s[last.stat]=Math.max(0,(s[last.stat]||0)-1); if(last.stat==='goal'){ if(last.team===xa) state.score.A=Math.max(0,state.score.A-1); if(last.team===xb) state.score.B=Math.max(0,state.score.B-1);} } state.timeline.pop(); toast('이전 스탯 취소'); render();}
    else if(act==='ask-end-match'){state.modal={type:'confirm-end-match'}; render();}
    else if(act==='confirm-end-match') endMatch();
    else if(act==='ask-end-session'){state.modal={type:'confirm-end-session'}; render();}
    else if(act==='confirm-end-session'){stopTimer(); state.sessionLabel=formatDateLabel(state.sessionDate)+' · 세션 종료'; state.modal=null; go('results');}
    else if(act==='open-add'){state.modal={type:'add',targetTeam:state.playing[0]}; render();}
    else if(act==='add-target'){state.modal={...state.modal,targetTeam:el.dataset.team}; render();}
    else if(act==='do-add'){const name=el.dataset.name; const to=state.modal.targetTeam; if(!state.attending.includes(name)) state.attending.push(name); Object.keys(state.teams).forEach(t=>{state.teams[t]=(state.teams[t]||[]).filter(n=>n!==name);}); state.teams[to]=state.teams[to]||[]; if(!state.teams[to].includes(name)) state.teams[to].push(name); ensureStat(name,to); /* baseTeams 유지: 용병/추가는 이 경기만 */ state.modal=null; toast(`${name} → ${to}`); render();}
    else if(act==='open-remove'){state.modal={type:'remove',team:state.playing[0]}; render();}
    else if(act==='remove-target'){state.modal={...state.modal,team:el.dataset.team}; render();}
    else if(act==='do-remove'){const name=el.dataset.name; const team=el.dataset.team||state.modal.team; state.teams[team]=(state.teams[team]||[]).filter(n=>n!==name); const wait=waitingTeams()[0]; if(wait&&!(state.teams[wait]||[]).includes(name)){state.teams[wait]=state.teams[wait]||[]; state.teams[wait].push(name);} state.modal=null; toast(`${name} 제거`); render();}
    else if(act==='shot-results'){captureResultsShot();}
    else if(act==='open-sub'){state.modal={type:'sub',team:state.playing[0],out:null}; render();}
    else if(act==='sub-target'){state.modal={...state.modal,team:el.dataset.team,out:null}; render();}
    else if(act==='sub-out'){state.modal={...state.modal,out:el.dataset.name}; render();}
    else if(act==='do-sub'){const out=state.modal.out; const inn=el.dataset.name; const from=el.dataset.from; const team=state.modal.team; if(!out) return; state.teams[team]=(state.teams[team]||[]).filter(n=>n!==out); if(from) state.teams[from]=(state.teams[from]||[]).filter(n=>n!==inn); Object.keys(state.teams).forEach(t=>{state.teams[t]=(state.teams[t]||[]).filter(n=>n!==inn);}); if(!state.teams[team].includes(inn)) state.teams[team].push(inn); // put out to waiting first team if any
      const wait=waitingTeams()[0]; if(wait&&!state.teams[wait].includes(out)) state.teams[wait].push(out); ensureStat(inn,team); state.modal=null; toast(`${out} ↔ ${inn}`); render();}
    else if(act==='do-sub-remove'){const out=state.modal.out; const team=state.modal.team; if(!out) return; state.teams[team]=(state.teams[team]||[]).filter(n=>n!==out); const wait=waitingTeams()[0]; if(wait) state.teams[wait].push(out); state.modal=null; toast(`${out} 코트 아웃`); render();}
    else if(act==='steps-scroll'){const box=document.getElementById('steps'); if(box) box.scrollBy({left:Number(el.dataset.dir)*140,behavior:'smooth'});} else if(act==='go-step'){const s=el.dataset.screen; if(!FLOW.includes(s)&&s!=='edit') return; stopTimer(); go(s);} else if(act==='go') go(el.dataset.screen);
    else if(act==='save-new') saveSession(true);
    else if(act==='reset-new'){ if(IS_GAS){ google.script.run.withSuccessHandler(res=>{const s=(res&&res.data)?res.data:res; applyServerState(s||{}); softNewSession(true);}).withFailureHandler(()=>softNewSession(true)).resetSession(); } else softNewSession(true); }
    else if(act==='save-edit'){document.querySelectorAll('tr[data-edit-name]').forEach(row=>{const n=row.dataset.editName; const s=ensureStat(n); row.querySelectorAll('input[data-f]').forEach(inp=>{s[inp.dataset.f]=Math.max(0,Number(inp.value)||0);});}); toast('수정 반영'); go('results');}
  };});
  document.querySelectorAll('tr[data-edit-name] input[data-f]').forEach(inp=>{inp.oninput=()=>{const row=inp.closest('tr'); const tmp={goal:0,assist:0,defense:0,save:0}; row.querySelectorAll('input[data-f]').forEach(el=>{tmp[el.dataset.f]=Math.max(0,Number(el.value)||0);}); const cell=row.querySelector('[data-mp]'); if(cell) cell.textContent=mpOf(tmp);};});
}

async function captureResultsShot(){
  const node=document.getElementById('phone');
  if(!node){toast('캡처 대상 없음');return;}
  toast('화면 저장 중…',1000);
  try{
    if(typeof html2canvas!=='function') throw new Error('no html2canvas');
    const canvas=await html2canvas(node,{backgroundColor:'#ffffff',scale:2,useCORS:false,allowTaint:true,logging:false,ignoreElements:(el)=>el.tagName==='IMG'||el.id==='toast'});
    const url=canvas.toDataURL('image/png');
    const a=document.createElement('a');
    a.download=`JMFC_${state.sessionDate||'session'}_results.png`;
    a.href=url; document.body.appendChild(a); a.click(); a.remove();
    toast('화면 저장 완료');
  }catch(e){
    try{
      const text=`JMFC ${state.sessionDate}\n`+activeDetailOrder().map(t=>`TEAM ${t}: ${(state.teams[t]||[]).join(', ')}`).join('\n');
      await navigator.clipboard.writeText(text);
      toast('이미지 실패 · 결과 요약 복사됨');
    }catch(_){ toast('저장 실패 · 브라우저가 차단함'); }
  }
}
function bindDraftDnD(){
  document.querySelectorAll('.draft-row[draggable]').forEach(row=>{
    row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/draft-idx', row.dataset.idx); row.classList.add('dragging');});
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    row.addEventListener('dragover',e=>e.preventDefault());
    row.addEventListener('drop',e=>{e.preventDefault(); const from=Number(e.dataTransfer.getData('text/draft-idx')); const to=Number(row.dataset.idx); if(!Number.isNaN(from)&&!Number.isNaN(to)){reorderDraftSlot(from,to); render();}});
  });
  document.querySelectorAll('.team-stat-card .names > span[data-player][draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/player', el.dataset.player); e.dataTransfer.setData('text/from-team', el.dataset.team);});
  });
  document.querySelectorAll('.team-stat-card[data-drop-team]').forEach(card=>{
    card.addEventListener('dragover',e=>{e.preventDefault(); card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{e.preventDefault(); card.classList.remove('drag-over'); const name=e.dataTransfer.getData('text/player'); const to=card.dataset.dropTeam; if(name&&to){if(movePlayerToTeam(name,to)){toast(`${name} → ${to}`); render();}}});
  });
}
function render(){
  const main=document.getElementById('main');
  const draftList=document.querySelector('.draft-list');
  const keepScroll=!!main && !render._jumpTop;
  const y=keepScroll?main.scrollTop:0;
  const draftY=keepScroll&&draftList?draftList.scrollTop:0;
  render._jumpTop=false;
  try{const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur) ae.blur();}catch(_){}
  renderSteps();
  const map={attendance:renderAttendance,coach:renderCoach,draft:renderDraft,lineup:renderLineup,matchSelect:renderMatchSelect,match:renderMatch,results:renderResults,edit:renderEdit};
  if(main) main.innerHTML=(map[state.screen]||renderAttendance)();
  const host=document.getElementById('modal-host'); if(host) host.innerHTML=modalHtml();
  bind();
  if(state.screen==='draft') bindDraftDnD();
  if(main&&keepScroll){
    main.scrollTop=y;
    const dl=document.querySelector('.draft-list'); if(dl) dl.scrollTop=draftY;
    requestAnimationFrame(()=>{ main.scrollTop=y; const d2=document.querySelector('.draft-list'); if(d2) d2.scrollTop=draftY; });
  }
}
function bootFromServer(){
  // Always full-bleed in GAS
  document.body.style.padding='0'; document.body.style.background='#fff';
  const phone=document.getElementById('phone');
  if(phone){ phone.style.borderRadius='0'; phone.style.border='none'; phone.style.boxShadow='none'; phone.style.minHeight='100dvh'; phone.style.maxWidth='100%'; }
  if(!IS_GAS){
    // local preview fallback: keep empty roster message
    PLAYERS=[]; refreshPlayerIndex(); render(); toast('GAS 밖에서 미리보기 · 시트 연동 없음'); return;
  }
  toast('불러오는 중…', 5000);
  google.script.run.withSuccessHandler(res=>{
    const data=(res&&res.data&&!res.masterPlayers)?res.data:res;
    if(res&&res.success===false){ toast('초기 로드 실패: '+(res.message||'')); render(); return; }
    PLAYERS=(data.masterPlayers||[]).map(mapMasterPlayer);
    refreshPlayerIndex();
    if(data.appState) applyServerState(data.appState);
    if(Array.isArray(data.pastSessions)){
      try{
        const map=readArchive();
        data.pastSessions.forEach(p=>{ if(p&&p.sessionDate) map[p.sessionDate]=Object.assign(map[p.sessionDate]||{}, p); });
        writeArchive(map);
      }catch(_){}
    }
    render();
    toast('준비 완료 · 선수 '+PLAYERS.length+'명');
  }).withFailureHandler(err=>{
    toast('초기 로드 실패: '+(err&&err.message||err));
    render();
  }).getInitialData();
}
bootFromServer();
</script>
</body>
</html>
