<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>JMFC Stats v2 · 목업</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0f1114; --panel:#181b20; --panel2:#22262c; --line:#30353d;
  --text:#F2F3F4; --muted:#9AA0A6; --lime:#C6F135; --lime2:rgba(198,241,53,.14);
  --head:#2a3140; --row:#1c2026; --row2:#15181d; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;
background-image:radial-gradient(700px 280px at 0% 0%,rgba(198,241,53,.08),transparent 55%)}
button,select,input{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:12px 10px calc(20px + var(--safe))}
.brand h1{font-family:"Black Han Sans",sans-serif;font-size:2rem;letter-spacing:-.02em;line-height:1}
.brand h1 i{font-style:normal;color:var(--lime)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 12px;font-weight:800;font-size:.82rem}
.tabs button.on{background:var(--lime);color:#111;border-color:var(--lime)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.h2{font-size:.95rem;font-weight:900}
.sub{color:var(--muted);font-size:.75rem;margin:3px 0 8px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:end}
.field{flex:1 1 96px;min-width:88px}
.field.grow{flex:2 1 140px}
.field label{display:block;font-size:.65rem;font-weight:800;color:var(--muted);margin-bottom:3px}
.field select,.field input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 8px;font-size:.82rem}
.btn{height:36px;border:none;border-radius:10px;background:var(--lime);color:#111;font-weight:900;padding:0 12px;font-size:.82rem;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.chkbar{display:flex;gap:6px;align-items:center;margin:8px 0 6px;flex-wrap:wrap}
.chkbar span{font-size:.72rem;color:var(--muted);font-weight:700}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:700px;font-size:.78rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--head);color:#d7dde8;font-size:.7rem;position:sticky;top:0;z-index:2;font-weight:800}
th.sortable{cursor:pointer}
th .ar{opacity:.4;font-size:.6rem;margin-left:2px}
th.on .ar{opacity:1;color:var(--lime)}
th.sticky,td.sticky{position:sticky;left:0;z-index:1}
th.sticky{background:var(--head);z-index:3}
td.sticky{background:inherit}
th.chk,td.chk{left:0;width:28px;min-width:28px;max-width:28px;padding:8px 4px}
th.rankcol,td.rankcol{left:28px;width:34px;min-width:34px;max-width:34px;padding:8px 2px}
th.namecol,td.namecol{left:62px;width:64px;min-width:64px;max-width:72px;text-align:left;padding-left:6px;overflow:hidden;text-overflow:ellipsis}
td.namecol{font-weight:800}
tr.zebra0 td{background:var(--row)}
tr.zebra1 td{background:var(--row2)}
tr.zebra0 td.sticky,tr.zebra0 td.chk,tr.zebra0 td.rankcol,tr.zebra0 td.namecol{background:var(--row)}
tr.zebra1 td.sticky,tr.zebra1 td.chk,tr.zebra1 td.rankcol,tr.zebra1 td.namecol{background:var(--row2)}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#2a2f36;font-weight:900;font-size:.68rem}
.rank.t1{background:var(--lime);color:#111}.rank.t2{background:#cfd8a0;color:#111}.rank.t3{background:#7d848c;color:#111}
.board{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.board .hd{display:flex;justify-content:space-between;padding:10px 12px;font-weight:900;font-size:.86rem}
.board .hd em{font-style:normal;color:var(--lime);font-size:.7rem}
.board ol{list-style:none;padding:0 10px 8px}
.board li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:.84rem}
.board .val{margin-left:auto;font-weight:900;color:var(--lime)}
.board .more{display:none}
.board.open .more{display:flex}
.board .tog{width:100%;border:none;background:#14171b;color:var(--muted);font-weight:800;padding:10px;font-size:.78rem;border-top:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:10px;padding:7px 10px;font-weight:800;font-size:.76rem}
.seg button.on{background:var(--lime2);color:var(--lime);border-color:rgba(198,241,53,.4)}
.radar-wrap{position:relative;height:300px;margin:8px 0;display:grid;place-items:center}
.radar-wrap svg{width:100%;max-width:360px;height:auto;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.legend{display:flex;gap:12px;justify-content:center;font-size:.75rem;font-weight:800}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.side{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.metric{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.8rem}
.metric:last-child{border:none}
.scorebig{font-size:1.8rem;font-weight:900;color:var(--lime);text-align:center}
.note{color:var(--muted);font-size:.7rem;margin-top:6px}
.chart{width:100%;height:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips label{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:.72rem;font-weight:700}
.hidden{display:none!important}
@media(min-width:720px){.app{max-width:760px}}
</style>
</head>
<body>
<div class="app">
  <header class="brand"><h1>JMFC <i>STATS</i></h1></header>
  <nav class="tabs" id="tabs">
    <button class="on" data-tab="dash">대시보드</button>
    <button data-tab="boards">순위표</button>
    <button data-tab="coach">감독</button>
    <button data-tab="compare">비교</button>
    <button data-tab="form">폼</button>
    <button data-tab="terms">용어</button>
  </nav>

  <section id="tab-dash">
    <div class="panel">
      <div class="filters" id="dashFilters"></div>
      <div class="chkbar"><span id="dashChkInfo">체크 없음 = 전체</span>
        <button class="btn ghost" type="button" id="dashClearChk">체크 해제</button></div>
      <div class="table-wrap"><table>
        <thead><tr id="dashHead"></tr></thead>
        <tbody id="dashBody"></tbody>
      </table></div>
    </div>
  </section>

  <section id="tab-boards" class="hidden">
    <div class="panel">
      <div class="h2">순위표</div>
      <p class="sub">기간 조회 · 기본 5위 + 더보기</p>
      <div class="filters" id="boardFilters"></div>
    </div>
    <div id="boardsOut"></div>
  </section>

  <section id="tab-coach" class="hidden">
    <div class="panel">
      <div class="h2">감독</div>
      <div class="filters" id="coachFilters"></div>
      <div class="chkbar"><span id="coachChkInfo">체크 없음 = 전체</span>
        <button class="btn ghost" type="button" id="coachClearChk">체크 해제</button></div>
      <div class="table-wrap"><table>
        <thead><tr id="coachHead"></tr></thead>
        <tbody id="coachBody"></tbody>
      </table></div>
      <p class="note">세션은 감독_배정 날짜만 집계 (테스트 저장 제외)</p>
    </div>
  </section>

  <section id="tab-compare" class="hidden">
    <div class="panel">
      <div class="h2">비교</div>
      <div class="seg" id="cmpMode">
        <button class="on" data-mode="self">나와 나</button>
        <button data-mode="chem">케미 파트너</button>
      </div>
      <div class="filters">
        <div class="field grow"><label>선수</label><select id="cmpPlayer"></select></div>
        <div class="field grow" id="cmpOtherWrap"><label>파트너</label><select id="cmpOther"></select></div>
      </div>
    </div>
    <div class="panel" id="cmpOut"></div>
  </section>

  <section id="tab-form" class="hidden">
    <div class="panel">
      <div class="h2">선수별 폼</div>
      <p class="sub">첫 분기=100 기준 상대 지수 · 절대 스탯이 아니라 추세</p>
      <div class="filters">
        <div class="field"><label>지표</label>
          <select id="formMetric">
            <option value="mpG">MP/G</option>
            <option value="winRate">승률</option>
            <option value="ppg">승점/경기</option>
            <option value="gd">득실</option>
          </select>
        </div>
        <div class="field grow"><label>보기</label>
          <select id="formView">
            <option value="all">전체 추세</option>
            <option value="pick">선택한 선수</option>
            <option value="hot">상승폼 TOP</option>
            <option value="cold">하락폼 TOP</option>
          </select>
        </div>
      </div>
      <div class="chips" id="formChips"></div>
      <div style="margin-top:6px"><button class="btn" type="button" id="formQuery">조회</button></div>
      <svg class="chart" id="formChart" viewBox="0 0 360 200"></svg>
      <div id="formList" style="margin-top:8px"></div>
    </div>
  </section>

  <section id="tab-terms" class="hidden">
    <div class="panel">
      <div class="h2">용어</div>
      <div style="display:grid;gap:8px;margin-top:8px;font-size:.84rem">
        <div class="side"><b style="color:var(--lime)">MP</b> (득점+도움+수비+선방)×2</div>
        <div class="side"><b style="color:var(--lime)">MP/G</b> MP÷경기수</div>
        <div class="side"><b style="color:var(--lime)">CCP</b> 승점+MP</div>
        <div class="side"><b style="color:var(--lime)">CCP/G</b> CCP÷경기수</div>
        <div class="side"><b style="color:var(--lime)">케미</b> 같은 팀 승률·승점·득실 기반 100점</div>
        <div class="side"><b style="color:var(--lime)">폼 지수</b> 개인 첫 분기=100, 이후 상대값</div>
      </div>
    </div>
  </section>
</div>

function yearsAvailable(){
  const now=new Date().getFullYear();
  const ys=new Set(DATA.years||[]);
  // only years that exist in data, and current year if already in data (no future)
  return [...ys].filter(y=>y<=now).sort((a,b)=>b-a);
}
function periodFields(prefix, st){
  const ys=yearsAvailable().map(y=>`<option value="${y}">${y}년</option>`).join('');
  return `<div class="field"><label>연도</label><select id="${prefix}Year">
      <option value="all">전체 연도</option>${ys}</select></div>
    <div class="field"><label>기간</label><select id="${prefix}Q">
      <option value="all">시즌 전체</option>
      <option value="Q1">Q1</option><option value="Q2">Q2</option>
      <option value="Q3">Q3</option><option value="Q4">Q4</option></select></div>`;
}
function setPeriodSelects(prefix, st){
  $(`#${prefix}Year`).value=st.year; $(`#${prefix}Q`).value=st.q;
}
function readPeriod(prefix, st){
  st.year=$(`#${prefix}Year`).value; st.q=$(`#${prefix}Q`).value;
}
function periodKeys(year,q){
  const all=DATA.quarters||[];
  if(year==='all' && q==='all') return null; // season master
  if(year==='all') return all.filter(k=>k.endsWith('-'+q));
  if(q==='all') return all.filter(k=>k.startsWith(year+'-'));
  const key=`${year}-${q}`;
  return all.includes(key)?[key]:[];
}
function pct(n){return (Math.round((n||0)*10)/10).toFixed(1)+'%'}
function num(n,d=1){return (Math.round((n||0)*10**d)/10**d).toFixed(d)}
function rc(r){return r===1?'t1':r===2?'t2':r===3?'t3':''}

function switchTab(id){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));
  ['dash','boards','coach','compare','form','terms'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==id));
}
$$('#tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/** Build player list for a period from form quarters or season master */
function playersForPeriod(year,q,search){
  const keys=periodKeys(year,q);
  let list;
  if(keys===null){
    list=DATA.players.map(p=>({...p, rankSource:'season'}));
  } else if(!keys.length){
    list=[];
  } else {
    list=[];
    DATA.players.forEach(p=>{
      const forms=keys.map(k=>p.form[k]).filter(Boolean);
      if(!forms.length) return;
      const games=forms.reduce((s,f)=>s+(f.games||0),0);
      const w=forms.reduce((s,f)=>s+((f.winRate||0)/100*(f.games||0)*0 + 0),0);
      // approximate W from winRate*decided unknown — use weighted winRate
      let wrSum=0, wrW=0, pts=0, gf=0, ga=0, goal=0, assist=0, defense=0, save=0, mp=0;
      forms.forEach(f=>{
        wrSum+=(f.winRate||0)*(f.games||0); wrW+=(f.games||0);
        pts+=f.pts||0; gf+=f.gf||0; ga+=f.ga||0;
        goal+=f.goal||0; assist+=f.assist||0; defense+=f.defense||0; save+=f.save||0;
        mp+=f.mp!=null?f.mp:((f.mpG||0)*(f.games||0));
      });
      const winRate=wrW?wrSum/wrW:0;
      // if no personal mp breakdown, keep proxy mp
      if(!(goal||assist||defense||save)){
        // leave mp from proxy
      } else {
        mp=(goal+assist+defense+save)*2;
      }
      const points=pts;
      const ccp=points+mp;
      list.push({
        name:p.name, games, winRate:Math.round(winRate*10)/10, goal, assist, defense, save,
        points, mp:Math.round(mp), mpG:games?Math.round(mp/games*100)/100:0,
        ccp:Math.round(ccp), ccpG:games?Math.round(ccp/games*100)/100:0,
        wins:0,draws:0,losses:0, form:p.form
      });
    });
  }
  const s=(search||'').trim();
  if(s) list=list.filter(p=>p.name.includes(s));
  return list;
}

function sortList(list, key, dir){
  return list.slice().sort((a,b)=>{
    const av=a[key]??(typeof a[key]==='string'?'':0);
    const bv=b[key]??0;
    if(typeof a[key]==='string' || typeof b[key]==='string') return String(a[key]||'').localeCompare(String(b[key]||''))*dir;
    return ((a[key]??0)-(b[key]??0))*dir;
  });
}
function withDynamicRank(list, key, dir){
  const sorted=sortList(list,key,dir);
  return sorted.map((p,i)=>({...p, rank:i+1}));
}

function renderDash(){
  const cols=[
    ['rank','순위'],['name','선수'],['games','경기수'],['winRate','승률'],
    ['goal','득점'],['assist','도움'],['defense','수비'],['save','선방'],
    ['points','승점'],['mp','MP'],['mpG','MP/G'],['ccp','CCP'],['ccpG','CCP/G']
  ];
  $('#dashHead').innerHTML=`<th class="chk sticky"></th>`+cols.map(([k,l])=>{
    const on=state.dash.sortKey===k;
    const ar=on?(state.dash.sortDir>0?'▲':'▼'):'↕';
    const cls=k==='rank'?'rankcol sticky':(k==='name'?'namecol sticky':'');
    return `<th class="sortable ${on?'on':''} ${cls}" data-k="${k}">${l}<span class="ar">${ar}</span></th>`;
  }).join('');
  $$('#dashHead th.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(state.dash.sortKey===k) state.dash.sortDir*=-1;
    else { state.dash.sortKey=k; state.dash.sortDir=(k==='name'||k==='rank')?1:-1; }
    renderDash();
  });

  let base=playersForPeriod(state.dash.year, state.dash.q, state.dash.search);
  if(state.dash.applyChecked && state.dash.checked.size){
    base=base.filter(p=>state.dash.checked.has(p.name));
  }
  const ranked=withDynamicRank(base, state.dash.sortKey==='rank'?'ccpG':state.dash.sortKey, state.dash.sortKey==='rank'?-1:state.dash.sortDir);
  // if sorting by rank column itself, just keep order
  const rows=state.dash.sortKey==='rank'?withDynamicRank(base,'ccpG',-1):ranked;

  $('#dashChkInfo').textContent=state.dash.checked.size?`선택 ${state.dash.checked.size}명`:'체크 없음 = 전체';
  $('#dashBody').innerHTML=rows.map((p,i)=>`<tr class="zebra${i%2}">
    <td class="chk sticky"><input type="checkbox" data-name="${p.name}" ${state.dash.checked.has(p.name)?'checked':''} /></td>
    <td class="rankcol sticky"><span class="rank ${rc(p.rank)}">${p.rank}</span></td>
    <td class="namecol sticky">${p.name}</td>
    <td>${p.games}</td><td>${pct(p.winRate)}</td>
    <td>${p.goal||0}</td><td>${p.assist||0}</td><td>${p.defense||0}</td><td>${p.save||0}</td>
    <td>${p.points||0}</td><td>${p.mp||0}</td><td>${num(p.mpG,2)}</td><td>${p.ccp||0}</td><td>${num(p.ccpG,2)}</td>
  </tr>`).join('') || `<tr><td colspan="14" style="padding:16px;color:var(--muted)">해당 기간 데이터 없음</td></tr>`;

  $$('#dashBody input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) state.dash.checked.add(cb.dataset.name); else state.dash.checked.delete(cb.dataset.name);
    $('#dashChkInfo').textContent=state.dash.checked.size?`선택 ${state.dash.checked.size}명 · 조회로 필터`:'체크 없음 = 전체';
  });
}

function boardBlock(title,key,fmt,list){
  const top=sortList(list,key,-1);
  const first=top.slice(0,5), rest=top.slice(5,15);
  const row=(p,i)=>`<li class="${i>=5?'more':''}"><span class="rank ${rc(i+1)}">${i+1}</span><span>${p.name}</span><span class="val">${fmt(p[key])}</span></li>`;
  const id='b_'+key+title.length;
  return `<div class="board" id="${id}"><div class="hd">${title}<em>${labelPeriod(state.board)}</em></div>
    <ol>${first.map((p,i)=>row(p,i)).join('')}${rest.map((p,i)=>row(p,i+5)).join('')}</ol>
    <button class="tog" type="button" data-board="${id}">${rest.length?'더보기':'끝'}</button></div>`;
}
function labelPeriod(st){
  return `${st.year==='all'?'전체':st.year+'년'} · ${st.q==='all'?'시즌':st.q}`;
}

function coachesForPeriod(year,q){
  const keys=periodKeys(year,q);
  if(keys===null) return DATA.coaches.map(c=>({...c}));
  if(!keys.length) return [];
  const out=[];
  DATA.coaches.forEach(c=>{
    const parts=keys.map(k=>c.byQ[k]).filter(Boolean);
    if(!parts.length) return;
    const o={name:c.name,sessions:0,games:0,w:0,d:0,l:0,gf:0,ga:0};
    parts.forEach(p=>{o.sessions+=p.sessions;o.games+=p.games;o.w+=p.w;o.d+=p.d;o.l+=p.l;o.gf+=p.gf;o.ga+=p.ga;});
    o.gd=o.gf-o.ga; o.pts=o.w*3+o.d;
    const dec=o.w+o.l; o.winRate=dec?Math.round(o.w/dec*1000)/10:0;
    out.push(o);
  });
  return out;
}

function bestPartner(name){
  const hits=DATA.chem.filter(c=>c.a===name||c.b===name).sort((a,b)=>b.score-a.score);
  if(!hits[0]) return DATA.players.find(p=>p.name!==name)?.name||'';
  return hits[0].a===name?hits[0].b:hits[0].a;
}
function chemOf(a,b){
  return DATA.chem.find(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a));
}

function radarSVG(labels, series){
  // series: [{name,color,values:[0-100]}]
  const N=labels.length, cx=180, cy=150, R=105;
  const rings=4;
  let bg='';
  for(let i=rings;i>=1;i--){
    const r=R*i/rings;
    const op=0.04+i*0.03;
    bg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(230,235,255,${op})" stroke="rgba(255,255,255,.08)" />`;
  }
  // axes
  let axes='';
  for(let i=0;i<N;i++){
    const ang=-Math.PI/2+i*2*Math.PI/N;
    const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R;
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.12)" />`;
    const lx=cx+Math.cos(ang)*(R+22), ly=cy+Math.sin(ang)*(R+22);
    axes+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#c5cad3" font-size="11" font-weight="700">${labels[i]}</text>`;
  }
  function poly(vals, stroke, fill){
    const pts=vals.map((v,i)=>{
      const ang=-Math.PI/2+i*2*Math.PI/N;
      const r=R*(Math.max(0,Math.min(100,v))/100);
      return `${cx+Math.cos(ang)*r},${cy+Math.sin(ang)*r}`;
    }).join(' ');
    let dots='';
    vals.forEach((v,i)=>{
      const ang=-Math.PI/2+i*2*Math.PI/N;
      const r=R*(Math.max(0,Math.min(100,v))/100);
      const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      dots+=`<circle cx="${x}" cy="${y}" r="4" fill="#111" stroke="${stroke}" stroke-width="2" />`;
    });
    return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" />${dots}`;
  }
  const polys=series.map(s=>poly(s.values,s.color,s.fill)).join('');
  return `<svg viewBox="0 0 360 300">${bg}${axes}${polys}</svg>`;
}

function quarterPair(p){
  const keys=Object.keys(p.form).sort();
  if(keys.length<2) return null;
  return [keys[0], keys[keys.length-1]];
}
function metricBundle(f){
  if(!f) return null;
  return {
    '승률': f.winRate||0,
    'MP/G': (f.mpG||0)*25, // scale ~0-100 assuming mpG~0-4
    '승점/G': (f.ppg||0)*40,
    '득실': Math.max(0, Math.min(100, 50+(f.gd||0)/2)),
    '경기수': Math.min(100,(f.games||0)),
    '공격': Math.min(100, ((f.goal||0)+(f.assist||0))*3),
    '수비': Math.min(100, ((f.defense||0)+(f.save||0))*8)
  };
}

function renderCompare(){
  const mode=$('#cmpMode .on').dataset.mode;
  const me=DATA.players.find(p=>p.name===$('#cmpPlayer').value);
  const ot=DATA.players.find(p=>p.name===$('#cmpOther').value);
  $('#cmpOtherWrap').classList.toggle('hidden', mode==='self');
  if(mode==='self'){
    const pair=quarterPair(me);
    if(!pair){ $('#cmpOut').innerHTML='<p class="note">비교할 분기 데이터가 부족합니다.</p>'; return; }
    const A=me.form[pair[0]], B=me.form[pair[1]];
    const mA=metricBundle(A), mB=metricBundle(B);
    const labels=Object.keys(mA);
    $('#cmpOut').innerHTML=`
      <div class="legend"><span><i style="background:#ff6b9d"></i>${pair[0]}</span>
        <span><i style="background:#6b8cff"></i>${pair[1]}</span></div>
      <div class="radar-wrap">${radarSVG(labels,[
        {color:'#ff6b9d', fill:'rgba(255,107,157,.22)', values:labels.map(k=>mA[k])},
        {color:'#6b8cff', fill:'rgba(107,140,255,.22)', values:labels.map(k=>mB[k])}
      ])}</div>
      <div class="side">
        ${labels.map(k=>{
          const rawA=k==='MP/G'?num(A.mpG,2):k==='승률'?pct(A.winRate):k==='승점/G'?num(A.ppg,2):k==='득실'?A.gd:k==='경기수'?A.games:k==='공격'?((A.goal||0)+(A.assist||0)):((A.defense||0)+(A.save||0));
          const rawB=k==='MP/G'?num(B.mpG,2):k==='승률'?pct(B.winRate):k==='승점/G'?num(B.ppg,2):k==='득실'?B.gd:k==='경기수'?B.games:k==='공격'?((B.goal||0)+(B.assist||0)):((B.defense||0)+(B.save||0));
          return `<div class="metric"><span>${k}</span><strong>${rawA} → ${rawB}</strong></div>`;
        }).join('')}
      </div>
      <p class="note">${me.name} · 첫 관측 분기 vs 최근 분기 레이더</p>`;
    return;
  }
  const c=chemOf(me.name,ot.name);
  if(!c){ $('#cmpOut').innerHTML='<p class="note">같이 뛴 기록이 충분하지 않습니다.</p>'; return; }
  // radar for chemistry dims
  const labels=['승률','승점효율','득실','동시출전','안정'];
  const wr=c.winRate;
  const ptsEff=Math.min(100,(c.pts/c.together)*35);
  const gdEff=Math.max(0,Math.min(100,50+(c.gd/c.together)*20));
  const tog=Math.min(100,c.together);
  const stab=Math.min(100, 40 + (c.d/c.together)*60);
  $('#cmpOut').innerHTML=`
    <div class="scorebig">${c.score}<span style="font-size:.9rem;color:var(--muted)"> / 100</span></div>
    <div class="legend" style="margin-top:4px"><span>${me.name} × ${ot.name}</span></div>
    <div class="radar-wrap">${radarSVG(labels,[
      {color:'#C6F135', fill:'rgba(198,241,53,.2)', values:[wr, ptsEff, gdEff, tog, stab]}
    ])}</div>
    <div class="side">
      <div class="metric"><span>같은 팀 경기</span><strong>${c.together}회</strong></div>
      <div class="metric"><span>승 / 무 / 패</span><strong>${c.w} / ${c.d} / ${c.l}</strong></div>
      <div class="metric"><span>승률</span><strong>${pct(c.winRate)}</strong></div>
      <div class="metric"><span>승점</span><strong>${c.pts}</strong></div>
      <div class="metric"><span>득실</span><strong>${c.gd>0?'+':''}${c.gd}</strong></div>
    </div>
    <p class="note">케미 = 같은 팀일 때 승률·승점·득실 중심 100점 (도움 페어 미사용)</p>`;
}

/** Form index: first quarter = 100 */
function formSeries(p, metric){
  const keys=Object.keys(p.form).sort();
  if(!keys.length) return null;
  const raw=keys.map(k=>{
    const f=p.form[k];
    let v=0;
    if(metric==='mpG') v=f.mpG||0;
    else if(metric==='winRate') v=f.winRate||0;
    else if(metric==='ppg') v=f.ppg||0;
    else if(metric==='gd') v=f.gd||0;
    return {k,v};
  });
  const base=raw[0].v || 0.0001;
  return raw.map(r=>({k:r.k, index: Math.round(r.v/base*1000)/10, raw:r.v}));
}
function formTrend(series){
  if(!series || series.length<2) return 0;
  return series[series.length-1].index - series[0].index;
}
function renderFormChips(){
  $('#formChips').innerHTML=DATA.players.map(p=>`<label><input type="checkbox" data-n="${p.name}" ${state.formPick.has(p.name)?'checked':''}/> ${p.name}</label>`).join('');
  $$('#formChips input').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) state.formPick.add(cb.dataset.n); else state.formPick.delete(cb.dataset.n);
  });
}
function renderForm(){
  const metric=$('#formMetric').value;
  const view=$('#formView').value;
  let picked=[];
  if(view==='pick'){
    picked=DATA.players.filter(p=>state.formPick.has(p.name));
    if(!picked.length) picked=DATA.players.slice(0,3);
  } else if(view==='hot' || view==='cold'){
    const scored=DATA.players.map(p=>{
      const s=formSeries(p,metric); return {p,s,t:formTrend(s)};
    }).filter(x=>x.s && x.s.length>=2);
    scored.sort((a,b)=> view==='hot'?(b.t-a.t):(a.t-b.t));
    picked=scored.slice(0,5).map(x=>x.p);
  } else {
    // all - show top 6 by |trend| for readability + average line
    const scored=DATA.players.map(p=>{
      const s=formSeries(p,metric); return {p,s,t:formTrend(s)};
    }).filter(x=>x.s && x.s.length>=2);
    scored.sort((a,b)=>Math.abs(b.t)-Math.abs(a.t));
    picked=scored.slice(0,6).map(x=>x.p);
  }
  const colors=['#C6F135','#6b8cff','#ff6b9d','#3DDC97','#FFC857','#c39bff'];
  const allKeys=[...new Set(picked.flatMap(p=>Object.keys(p.form)))].sort();
  const w=360,h=200,padL=28,padR=10,padT=16,padB=28;
  const series=picked.map((p,i)=>({name:p.name, color:colors[i%colors.length], pts:formSeries(p,metric)}));
  const idxs=series.flatMap(s=>s.pts?s.pts.map(x=>x.index):[]);
  const min=Math.min(70, ...idxs, 100), max=Math.max(130, ...idxs, 100);
  function xy(qi, index){
    const x=padL+qi*(w-padL-padR)/Math.max(allKeys.length-1,1);
    const y=padT+(h-padT-padB)*(1-(index-min)/(max-min||1));
    return [x,y];
  }
  let grid='';
  for(let g=0;g<4;g++){
    const y=padT+g*(h-padT-padB)/3;
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(255,255,255,.08)" />`;
  }
  // baseline 100
  const y100=xy(0,100)[1];
  grid+=`<line x1="${padL}" y1="${y100}" x2="${w-padR}" y2="${y100}" stroke="rgba(198,241,53,.35)" stroke-dasharray="4 4" />`;
  let labels='';
  allKeys.forEach((k,i)=>{
    const [x]=xy(i,100);
    labels+=`<text x="${x}" y="${h-8}" text-anchor="middle" fill="#9AA0A6" font-size="9">${k.replace('20','').replace('-','')}</text>`;
  });
  let paths='';
  series.forEach(s=>{
    if(!s.pts) return;
    const map=Object.fromEntries(s.pts.map(p=>[p.k,p.index]));
    const pts=allKeys.map((k,i)=> map[k]==null?null:xy(i,map[k])).filter(Boolean);
    if(pts.length<2) return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" />`;
    pts.forEach(([x,y])=>{ paths+=`<circle cx="${x}" cy="${y}" r="3.2" fill="#111" stroke="${s.color}" stroke-width="2" />`; });
  });
  $('#formChart').innerHTML=grid+paths+labels;
  $('#formList').innerHTML=series.map(s=>{
    const t=formTrend(s.pts);
    const arrow=t>2?'상승':(t<-2?'하락':'보합');
    const col=t>2?'#3DDC97':(t<-2?'#FF6B6B':'#9AA0A6');
    const last=s.pts?s.pts[s.pts.length-1].index:'-';
    return `<div class="metric"><span style="color:${s.color}">● ${s.name}</span><strong style="color:${col}">${arrow} · 지수 ${last}</strong></div>`;
  }).join('');
}
$('#formQuery').onclick=renderForm;
