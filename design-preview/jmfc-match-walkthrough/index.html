<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JMFC · 경기 기록 따라하기</title>
  <style>
    :root {
      --bg:#fff; --text:#111827; --muted:#4b5563; --line:#c5cad3;
      --red:#dc2626; --blue:#2563eb; --yellow:#CA8A04; --neon:#b8ff3c;
      --raise:0 10px 28px rgba(15,23,42,.16); --raise-sm:0 6px 16px rgba(15,23,42,.14);
      --glass:#fff; --safe-b:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
      background:#e5e7eb;color:var(--text);min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;
      padding:10px 10px calc(12px + var(--safe-b));
      -webkit-font-smoothing:antialiased;
    }
    .guide-top{
      width:100%;max-width:420px;margin-bottom:8px;
      background:#111;color:#fff;border-radius:16px;padding:12px 14px;
      box-shadow:var(--raise-sm);
    }
    .guide-top .n{font-size:0.72rem;font-weight:800;color:#b8ff3c;margin-bottom:4px}
    .guide-top .t{font-size:1.02rem;font-weight:900;line-height:1.35}
    .guide-top .h{font-size:0.78rem;color:#d1d5db;margin-top:6px;line-height:1.4}
    .phone{
      width:100%;max-width:420px;background:#fff;border-radius:28px;
      border:1px solid #e5e7eb;box-shadow:0 18px 50px rgba(15,23,42,.14);
      overflow:hidden;display:flex;flex-direction:column;min-height:min(78dvh,820px);position:relative;
    }
    .bar{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
    .logo{width:44px;height:44px;border-radius:50%;background:#111;color:#b8ff3c;display:grid;place-items:center;font-weight:900;font-size:0.7rem}
    .brand{font-weight:900;font-size:1.15rem;letter-spacing:.04em}
    .steps{display:flex;gap:4px;margin:0 10px 8px;padding:6px;overflow-x:auto;border-radius:999px;background:#f3f4f6;border:1px solid var(--line)}
    .steps span{flex:0 0 auto;padding:7px 10px;border-radius:999px;font-size:0.68rem;font-weight:700;color:#6b7280}
    .steps span.on{background:#fff;color:#111;box-shadow:0 4px 12px rgba(15,23,42,.12)}
    .body{padding:8px 14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
    h2{font-size:1.08rem;font-weight:900;margin-bottom:8px}
    .sub{font-size:0.8rem;color:var(--muted);margin-bottom:10px;line-height:1.4}
    .t-RED{color:var(--red)!important;font-weight:900}
    .t-BLUE{color:var(--blue)!important;font-weight:900}
    .t-YELLOW{color:var(--yellow)!important;font-weight:900}
    .score-big{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;padding:12px;border-radius:18px;border:1px solid var(--line);margin-bottom:12px;text-align:center;background:#fff;box-shadow:var(--raise-sm)}
    .score-big .tn{font-size:0.95rem;font-weight:900}
    .score-big .sc{font-size:1.85rem;margin-top:4px;font-weight:900}
    .score-big .sep{display:flex;flex-direction:column;align-items:center;font-weight:900}
    .score-big .colon{font-size:1.55rem;color:#6b7280}
    .ctrl-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px}
    .btn-sm{width:100%;min-height:44px;padding:10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:0.82rem;font-family:inherit}
    .btn-sm.blue{background:#111;color:var(--neon);border:none}
    .timer{width:96px;height:96px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;justify-self:center;box-shadow:var(--raise-sm)}
    .timer b{font-size:1.2rem;font-weight:800}
    .timer span{font-size:0.62rem;color:#9ca3af}
    .tabs{display:flex;gap:6px;margin-bottom:12px;padding:6px;border-radius:999px;background:#f3f4f6;border:1px solid var(--line)}
    .tabs button{flex:1;padding:11px 6px;font-size:0.8rem;font-weight:800;color:#4b5563;border:none;background:transparent;border-radius:999px;font-family:inherit;cursor:pointer}
    .tabs button.on{color:#111;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.14)}
    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .lineup-col{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--raise-sm)}
    .team-head{padding:12px 8px;text-align:center;font-size:0.82rem;font-weight:900;background:#f8fafc;border-bottom:1px solid #e5e7eb}
    .roster{padding:8px}
    .prow{margin-bottom:8px}
    .prow button{width:100%;font-family:inherit;border-radius:999px;text-align:left;padding:12px 14px;font-size:0.92rem;font-weight:900;background:#fff;border:1px solid var(--line);min-height:48px;cursor:pointer;box-shadow:var(--raise-sm);display:flex;align-items:center;gap:6px}
    .prow button .cap{background:#b8ff3c;color:#111;font-size:0.65rem;padding:2px 6px;border-radius:999px}
    .prow button.is-coach{background:#111;color:#fff;border-color:#111}
    .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
    .actions button{min-height:46px;border:none;border-radius:999px;background:#111;color:var(--neon);font-weight:900;font-size:0.8rem;font-family:inherit;cursor:pointer}
    .section-card{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff;margin-bottom:12px;box-shadow:var(--raise-sm)}
    .section-card h3{font-size:0.88rem;font-weight:900;margin-bottom:8px}
    .timeline{list-style:none;font-size:0.78rem;font-weight:700;line-height:1.45}
    .timeline li{border-bottom:1px solid #e5e7eb;padding:7px 0}
    .act2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .act2 button{padding:12px;min-height:48px;border:none;border-radius:999px;font-weight:800;font-size:0.84rem;font-family:inherit;cursor:pointer;background:#111;color:var(--neon)}
    .act2 .s{grid-column:1/-1;background:#e03528;color:#fff}
    .team-pick{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;margin-bottom:8px;font-family:inherit;cursor:pointer;box-shadow:var(--raise-sm)}
    .team-pick.picked{border-color:#1d4ed8;background:#eff6ff}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .btn{min-height:50px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;font-family:inherit;cursor:pointer}
    .btn-start{background:#2563eb!important;color:#fff!important;border:none!important}
    .field{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--line);padding:0 14px;font:inherit;font-weight:700;margin-bottom:10px}
    table.data{width:100%;border-collapse:collapse;font-size:0.72rem}
    table.data th,table.data td{border-bottom:1px solid #e5e7eb;padding:7px 2px;text-align:center;font-weight:700}
    table.data th{color:#52525b}
    table.data td:first-child,table.data th:first-child{text-align:left}
    .result-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff;box-shadow:var(--raise-sm)}
    .result-card.team-RED{border-left:4px solid var(--red)}
    .result-card.team-BLUE{border-left:4px solid var(--blue)}
    .modal-overlay{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
    .modal-card{width:100%;background:#fff;border-radius:22px;padding:18px 16px;box-shadow:var(--raise)}
    .modal-card h3{font-size:1.05rem;font-weight:900;margin-bottom:6px}
    .msub{font-size:0.82rem;color:var(--muted);margin-bottom:12px}
    .modal-btns{display:grid;gap:8px}
    .modal-btns button,.assist-picks button{min-height:52px;border:none;border-radius:14px;font-weight:900;font-size:0.95rem;font-family:inherit;cursor:pointer}
    .modal-btns .goal{background:#111;color:var(--neon)}
    .modal-btns .def,.modal-btns .save{background:#f3f4f6;color:#111}
    .modal-btns .own{background:#fff7ed;color:#c2410c}
    .modal-btns .cancel,.modal-btns .no{background:#fff;border:1px solid var(--line);color:#111}
    .assist-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .assist-picks button{background:#111;color:var(--neon)}
    .pool-list{display:grid;gap:8px;margin:8px 0 12px;max-height:220px;overflow:auto}
    .pool-list button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;font-family:inherit;text-align:left;padding:0 12px;cursor:pointer}
    .seg{display:flex;gap:6px;padding:6px;border-radius:999px;margin-bottom:10px;background:#f3f4f6;border:1px solid var(--line)}
    .seg button{flex:1;min-height:40px;border:none;background:transparent;font-weight:800;font-family:inherit;border-radius:999px;cursor:pointer}
    .seg button.on{background:#2563eb;color:#fff}
    .foot{
      width:100%;max-width:420px;margin-top:10px;display:grid;grid-template-columns:1fr 1.4fr;gap:8px;
    }
    .foot button{
      min-height:52px;border-radius:999px;border:1px solid #111;background:#fff;font-weight:900;font-family:inherit;cursor:pointer;font-size:0.95rem;
    }
    .foot .next{background:#111;color:var(--neon);border:none}
    .pulse{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 0 0 rgba(37,99,235,.55)!important;outline:3px solid #2563eb;outline-offset:2px}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}
      70%{box-shadow:0 0 0 12px rgba(37,99,235,0)}
      100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
    }
    .dim{opacity:.45;pointer-events:none}
    .toast{
      position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      background:rgba(17,24,39,.94);color:#fff;padding:10px 14px;border-radius:12px;
      font-size:0.82rem;font-weight:700;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none;
    }
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div class="guide-top">
    <div class="n" id="stepNo">STEP 1 / 14</div>
    <div class="t" id="stepTitle">경기시작을 누르세요</div>
    <div class="h" id="stepHint">파란 테두리가 깜빡이는 버튼만 누르면 됩니다</div>
  </div>

  <div class="phone" id="phone">
    <div class="bar">
      <div class="logo">JMFC</div>
      <div class="brand">FOOTBALL</div>
    </div>
    <div class="steps" id="flowSteps"></div>
    <div class="body" id="scene"></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="foot">
    <button type="button" id="prevBtn">← 이전</button>
    <button type="button" class="next" id="nextBtn">다음 →</button>
  </div>

  <script>
    const RED = ['김기호','이영민','박준석','최도현'];
    const BLUE = ['김수호','정우성','한동훈','오세진'];
    const WAIT = ['윤태양','장민수'];

    const STEPS = [
      {
        id: 'select',
        title: '경기시작을 누르세요',
        hint: 'RED vs BLUE가 선택된 상태입니다. 파란 「경기시작」을 탭하세요.',
        flow: '경기선택',
        action: 'start'
      },
      {
        id: 'lineup0',
        title: '득점할 선수를 탭하세요',
        hint: '라인업에서 김기호를 탭하면 기록 창이 열립니다.',
        flow: '경기',
        tab: 'lineup',
        score: [0,0],
        action: 'tap-giho'
      },
      {
        id: 'record',
        title: '「득점」을 누르세요',
        hint: '수비·선방·자책골도 같은 방식으로 기록합니다.',
        flow: '경기',
        tab: 'lineup',
        score: [0,0],
        modal: 'record',
        action: 'goal'
      },
      {
        id: 'assist',
        title: '도움 선수를 고르세요',
        hint: '이영민을 누르면 도움이 연결됩니다. 없으면 「없음」.',
        flow: '경기',
        tab: 'lineup',
        score: [0,0],
        modal: 'assist',
        action: 'assist-young'
      },
      {
        id: 'scored',
        title: '스코어가 1:0이 됐습니다',
        hint: '타임라인에 득점·도움이 쌓입니다. 다음은 팀순위 화면입니다.',
        flow: '경기',
        tab: 'lineup',
        score: [1,0],
        timeline: true,
        action: 'next-only'
      },
      {
        id: 'to-standings',
        title: '「순위」탭을 누르세요',
        hint: '경기 중에도 오늘 팀 승점을 바로 볼 수 있습니다.',
        flow: '경기',
        tab: 'lineup',
        score: [1,0],
        timeline: true,
        action: 'tab-standings'
      },
      {
        id: 'standings',
        title: '팀순위 화면',
        hint: '승·무·패·득실·승점이 보입니다. 다음은 개인기록입니다.',
        flow: '경기',
        tab: 'standings',
        score: [1,0],
        action: 'next-only'
      },
      {
        id: 'to-personal',
        title: '「개인」탭을 누르세요',
        hint: '선수별 득/도/수/선/MP를 확인합니다.',
        flow: '경기',
        tab: 'standings',
        score: [1,0],
        action: 'tab-personal'
      },
      {
        id: 'personal',
        title: '개인기록 화면',
        hint: '김기호 득점 1, 이영민 도움 1이 반영된 상태입니다.',
        flow: '경기',
        tab: 'personal',
        score: [1,0],
        action: 'next-only'
      },
      {
        id: 'back-lineup',
        title: '다시 「라인업」으로',
        hint: '기록·교체는 라인업 탭에서 합니다.',
        flow: '경기',
        tab: 'personal',
        score: [1,0],
        action: 'tab-lineup'
      },
      {
        id: 'sub-open',
        title: '「선수교체」를 누르세요',
        hint: '나가는 선수 → 들어오는 선수 순서로 고릅니다.',
        flow: '경기',
        tab: 'lineup',
        score: [1,0],
        timeline: true,
        action: 'open-sub'
      },
      {
        id: 'sub-modal',
        title: '교체: 최도현 → 윤태양',
        hint: '나가는 선수 최도현, 대기 윤태양을 순서대로 탭하세요.',
        flow: '경기',
        tab: 'lineup',
        score: [1,0],
        modal: 'sub',
        action: 'do-sub'
      },
      {
        id: 'add-open',
        title: '「선수추가」를 누르세요',
        hint: '대기팀/전체 명단에서 코트에 넣을 수 있습니다.',
        flow: '경기',
        tab: 'lineup',
        score: [1,0],
        timeline: true,
        subbed: true,
        action: 'open-add'
      },
      {
        id: 'done',
        title: '이 흐름이 실제 기록 방식입니다',
        hint: '경기 종료 → 결과 확인 → 「기록 저장 & NEW」까지가 한 세션입니다.',
        flow: '경기',
        tab: 'lineup',
        score: [1,0],
        timeline: true,
        subbed: true,
        action: 'done'
      }
    ];

    let step = 0;
    let subOut = null;

    function toast(msg){
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 1600);
    }

    function redRoster(subbed){
      const list = RED.slice();
      if (subbed) {
        const i = list.indexOf('최도현');
        if (i >= 0) list[i] = '윤태양';
      }
      return list;
    }

    function scoreBoard(a,b){
      return `<div class="score-big">
        <div class="side"><div class="tn t-RED">TEAM RED</div><div class="sc">${a}</div></div>
        <div class="sep"><div>#1</div><div class="colon">:</div></div>
        <div class="side"><div class="tn t-BLUE">TEAM BLUE</div><div class="sc">${b}</div></div>
      </div>`;
    }

    function timerBlock(){
      return `<div class="ctrl-row">
        <button class="btn-sm gray" type="button">리셋</button>
        <div class="timer"><div style="text-align:center"><b>09:42</b><br><span>남음</span></div></div>
        <button class="btn-sm blue" type="button">일시정지</button>
      </div>`;
    }

    function tabs(active){
      return `<div class="tabs">
        <button type="button" class="${active==='lineup'?'on':''}" data-act="tab-lineup">라인업</button>
        <button type="button" class="${active==='standings'?'on':''}" data-act="tab-standings">순위</button>
        <button type="button" class="${active==='personal'?'on':''}" data-act="tab-personal">개인</button>
      </div>`;
    }

    function lineup(s, pulseName){
      const red = redRoster(s.subbed);
      const mk = (team, names) => `
        <div class="lineup-col">
          <div class="team-head t-${team}">TEAM ${team}</div>
          <div class="roster">${names.map((n,i)=>`
            <div class="prow"><button type="button" class="${i===0?'is-coach':''} ${pulseName===n?'pulse':''}" data-act="${pulseName===n?'tap-giho':''}" data-name="${n}">
              <span>${n}</span>${i===0?'<span class="cap">C</span>':''}
            </button></div>`).join('')}
          </div>
        </div>`;
      return `<div class="lineup-grid">${mk('RED', red)}${mk('BLUE', BLUE)}</div>
        <div class="actions">
          <button type="button" class="${s.action==='open-sub'?'pulse':''}" data-act="open-sub">선수교체</button>
          <button type="button">선수제거</button>
          <button type="button" class="${s.action==='open-add'?'pulse':''}" data-act="open-add">선수추가</button>
        </div>`;
    }

    function timelineHtml(){
      return `<div class="section-card timeline-card"><h3>타임라인</h3>
        <ul class="timeline">
          <li>[00:18] <span class="t-RED">김기호</span> · 득점 (도움:이영민)</li>
        </ul>
      </div>
      <div class="act2">
        <button type="button">이전 스탯 취소</button>
        <button type="button">현재 경기 종료</button>
        <button type="button" class="s">전체 세션 종료</button>
      </div>`;
    }

    function standingsHtml(){
      return `<div class="result-card" style="overflow-x:auto">
        <table class="data">
          <thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>승점</th></tr></thead>
          <tbody>
            <tr><td>1</td><td class="t-RED">RED</td><td>1</td><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>3</td></tr>
            <tr><td>2</td><td class="t-YELLOW">YELLOW</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
            <tr><td>3</td><td class="t-BLUE">BLUE</td><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td></tr>
          </tbody>
        </table>
      </div>`;
    }

    function personalHtml(){
      const red = redRoster(true);
      return `
        <div class="result-card team-RED"><div class="t-RED" style="margin-bottom:8px">TEAM RED</div>
          <table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead>
          <tbody>
            <tr><td>김기호 C</td><td>1</td><td>0</td><td>0</td><td>0</td><td>2</td></tr>
            <tr><td>이영민</td><td>0</td><td>1</td><td>0</td><td>0</td><td>2</td></tr>
            <tr><td>박준석</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
            <tr><td>윤태양</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
          </tbody></table>
        </div>
        <div class="result-card team-BLUE"><div class="t-BLUE" style="margin-bottom:8px">TEAM BLUE</div>
          <table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead>
          <tbody>${BLUE.map(n=>`<tr><td>${n}${n==='김수호'?' C':''}</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`).join('')}</tbody></table>
        </div>`;
    }

    function modalHtml(s){
      if (s.modal === 'record') {
        return `<div class="modal-overlay"><div class="modal-card">
          <h3>김기호 (<span class="t-RED">TEAM RED</span>)</h3>
          <p class="msub">기록을 선택하세요</p>
          <div class="modal-btns">
            <button class="goal pulse" data-act="goal">득점</button>
            <button class="def">수비</button>
            <button class="save">선방</button>
            <button class="own">자책골</button>
            <button class="cancel">취소</button>
          </div>
        </div></div>`;
      }
      if (s.modal === 'assist') {
        return `<div class="modal-overlay"><div class="modal-card">
          <h3>김기호 선수 득점!</h3>
          <p class="msub">도움을 준 선수를 선택하세요</p>
          <div class="assist-picks">
            <button class="pulse" data-act="assist-young">이영민</button>
            <button>박준석</button>
            <button>최도현</button>
            <button>없음</button>
          </div>
        </div></div>`;
      }
      if (s.modal === 'sub') {
        return `<div class="modal-overlay"><div class="modal-card">
          <h3>선수 교체</h3>
          <div class="seg"><button class="on">RED</button><button>BLUE</button></div>
          <p class="label-sm" style="font-size:0.78rem;font-weight:700;color:#6b7280;margin-bottom:6px">나가는 선수 · TEAM RED</p>
          <div class="pool-list">
            ${['김기호','이영민','박준석','최도현'].map(n =>
              `<button type="button" class="${subOut===n?'pulse':''} ${!subOut && n==='최도현'?'pulse':''}" data-act="sub-out" data-name="${n}">${n}</button>`
            ).join('')}
          </div>
          <p class="label-sm" style="font-size:0.78rem;font-weight:700;color:#6b7280;margin-bottom:6px">대기팀에서 들어오기</p>
          <div class="pool-list">
            <button type="button" class="${subOut==='최도현'?'pulse':''}" data-act="do-sub" ${subOut?'':'disabled'} style="${subOut?'':'opacity:.4'}">윤태양</button>
            <button type="button" disabled style="opacity:.4">장민수</button>
          </div>
        </div></div>`;
      }
      if (s.id === 'add-open' || false) return '';
      return '';
    }

    function addModal(){
      return `<div class="modal-overlay"><div class="modal-card">
        <h3>선수 추가</h3>
        <p class="msub">어느 팀에 넣을까요?</p>
        <div class="seg"><button class="on">RED</button><button>BLUE</button></div>
        <p style="font-size:0.78rem;font-weight:700;color:#6b7280;margin-bottom:6px">대기팀</p>
        <div class="pool-list">
          <button type="button" class="pulse" data-act="finish-add">장민수</button>
        </div>
        <button class="btn" type="button">닫기</button>
      </div></div>`;
    }

    function renderSelect(s){
      return `<h2>경기 선택</h2>
        <div class="sub">2팀 선택 후 시작 · Match #1</div>
        <div class="section-card"><div style="font-size:0.78rem;font-weight:700;color:#6b7280;margin-bottom:6px">경기 시간</div>
          <select class="field"><option>10분</option></select>
        </div>
        <button class="team-pick picked" type="button"><span><span class="t-RED">TEAM RED</span><div style="font-size:0.8rem;font-weight:800;margin-top:4px">오늘 0승 0무 0패</div></span><span style="font-weight:900;color:#1d4ed8">✓ 선택</span></button>
        <button class="team-pick picked" type="button"><span><span class="t-BLUE">TEAM BLUE</span><div style="font-size:0.8rem;font-weight:800;margin-top:4px">오늘 0승 0무 0패</div></span><span style="font-weight:900;color:#1d4ed8">✓ 선택</span></button>
        <button class="team-pick" type="button"><span><span class="t-YELLOW">TEAM YELLOW</span><div style="font-size:0.8rem;font-weight:800;margin-top:4px">오늘 0승 0무 0패</div></span><span style="font-weight:900;color:#4b5563">선택</span></button>
        <div class="nav-row">
          <button class="btn" type="button">← 이전</button>
          <button class="btn btn-start pulse" type="button" data-act="start">경기시작</button>
        </div>`;
    }

    function render(){
      const s = STEPS[step];
      document.getElementById('stepNo').textContent = `STEP ${step+1} / ${STEPS.length}`;
      document.getElementById('stepTitle').textContent = s.title;
      document.getElementById('stepHint').textContent = s.hint;
      document.getElementById('prevBtn').disabled = step === 0;
      document.getElementById('nextBtn').textContent = step === STEPS.length-1 ? '처음으로' : '다음 →';

      const flow = ['참석','감독','드래프트','라인업','경기선택','경기','결과'];
      document.getElementById('flowSteps').innerHTML = flow.map(f =>
        `<span class="${f===s.flow?'on':''}">${f}</span>`
      ).join('');

      const scene = document.getElementById('scene');
      let html = '';

      if (s.id === 'select') {
        html = renderSelect(s);
      } else {
        const sc = s.score || [0,0];
        html = scoreBoard(sc[0], sc[1]) + timerBlock() + tabs(s.tab || 'lineup');
        if ((s.tab || 'lineup') === 'lineup') {
          const pulse = s.action === 'tap-giho' ? '김기호' : '';
          html += lineup(s, pulse);
          if (s.timeline) html += timelineHtml();
        } else if (s.tab === 'standings') {
          html += standingsHtml();
        } else if (s.tab === 'personal') {
          html += personalHtml();
        }
        if (s.modal) html += modalHtml(s);
        if (s.action === 'open-add' && false) html += '';
      }

      // special: show add modal as its own overlay when on add-open after click - handled in advance
      scene.innerHTML = html;

      // pulse tabs
      if (s.action === 'tab-standings') {
        scene.querySelector('[data-act="tab-standings"]')?.classList.add('pulse');
      }
      if (s.action === 'tab-personal') {
        scene.querySelector('[data-act="tab-personal"]')?.classList.add('pulse');
      }
      if (s.action === 'tab-lineup') {
        scene.querySelector('[data-act="tab-lineup"]')?.classList.add('pulse');
      }
    }

    function advance(){
      if (step >= STEPS.length - 1) {
        step = 0;
        subOut = null;
        render();
        toast('처음부터 다시');
        return;
      }
      step += 1;
      subOut = null;
      render();
    }

    function onAct(act, name){
      const s = STEPS[step];
      if (act !== s.action && !(s.action === 'do-sub' && (act === 'sub-out' || act === 'do-sub'))) {
        // allow only matching action, except multi-step sub
        if (!(s.id === 'sub-modal' && (act === 'sub-out' || act === 'do-sub'))) return;
      }

      if (act === 'start' && s.action === 'start') { toast('경기 시작!'); advance(); return; }
      if (act === 'tap-giho' && s.action === 'tap-giho') { toast('김기호 선택'); advance(); return; }
      if (act === 'goal' && s.action === 'goal') { toast('득점 +1'); advance(); return; }
      if (act === 'assist-young' && s.action === 'assist-young') { toast('이영민 도움 +1 · 1:0'); advance(); return; }
      if (act === 'tab-standings' && s.action === 'tab-standings') { advance(); return; }
      if (act === 'tab-personal' && s.action === 'tab-personal') { advance(); return; }
      if (act === 'tab-lineup' && s.action === 'tab-lineup') { advance(); return; }
      if (act === 'open-sub' && s.action === 'open-sub') { advance(); return; }
      if (act === 'sub-out' && s.id === 'sub-modal') {
        if (name !== '최도현') { toast('가이드: 최도현을 선택하세요'); return; }
        subOut = name;
        toast('최도현 OUT');
        render();
        return;
      }
      if (act === 'do-sub' && s.id === 'sub-modal') {
        if (subOut !== '최도현') { toast('먼저 나가는 선수를 고르세요'); return; }
        toast('윤태양 IN');
        advance();
        return;
      }
      if (act === 'open-add' && s.action === 'open-add') {
        // show add modal inline by temporarily injecting
        document.getElementById('scene').insertAdjacentHTML('beforeend', addModal());
        toast('추가할 선수 선택');
        return;
      }
      if (act === 'finish-add') {
        toast('장민수 추가됨');
        advance();
        return;
      }
    }

    document.getElementById('scene').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      onAct(btn.getAttribute('data-act'), btn.getAttribute('data-name'));
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const s = STEPS[step];
      if (s.action === 'next-only' || s.action === 'done' || step === STEPS.length - 1) {
        advance();
        return;
      }
      // auto-complete guided action for skip
      if (s.id === 'sub-modal') {
        subOut = '최도현';
        advance();
        return;
      }
      if (s.action === 'open-add') {
        advance();
        return;
      }
      advance();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (step === 0) return;
      step -= 1;
      subOut = null;
      render();
    });

    render();
  </script>
</body>
</html>
