  .rank.r2{background:#cbd5e1;color:#334155}
  .rank.r3{background:#fdba74;color:#7c2d12}
  .meta{flex:1;min-width:0}
  .name{font-weight:800;font-size:15px}
  .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .val{font-weight:800;font-size:18px;color:var(--navy)}
  .wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 16px 20px;background:#fff;border-radius:16px;border:1px solid #f1f5f9;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}
  th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  th{background:var(--navy);color:#fff;font-weight:700}
  td:nth-child(2),th:nth-child(2){text-align:left;position:sticky;left:0;background:#fff}
  th:nth-child(2){background:var(--navy)}
  tbody tr:nth-child(1) td, tbody tr:nth-child(1) td:nth-child(2){background:var(--gold)}
  tbody tr:nth-child(2) td, tbody tr:nth-child(2) td:nth-child(2){background:var(--silver)}
  tbody tr:nth-child(3) td, tbody tr:nth-child(3) td:nth-child(2){background:var(--bronze)}
  .note{margin:0 16px 28px;font-size:12px;color:var(--muted);line-height:1.5}
  .empty{padding:28px;text-align:center;color:var(--muted);font-weight:700}

  {id:'wr', label:'승률', get:r=>r.wr==null?-1:r.wr, fmt:r=>r.wr==null?'-':r.wr+'%'},
  {id:'gd', label:'득실', get:r=>r.gd, fmt:r=>(r.gd>0?'+':'')+r.gd},
  {id:'gf', label:'득점', get:r=>r.gf, fmt:r=>r.gf},
];

let period = 'all';
let sortId = 'pts';

function rows(){
  return (DATA.periods[period] || []).slice();
}

function sorted(list){
  const s = SORTS.find(x=>x.id===sortId) || SORTS[0];
  return list.slice().sort((a,b)=> s.get(b)-s.get(a) || b.pts-a.pts || b.gd-a.gd || a.name.localeCompare(b.name,'ko'));
}

function wr(r){ return r.wr==null ? '-' : r.wr+'%'; }
function gd(r){ return (r.gd>0?'+':'')+r.gd; }

function render(){
  const list = sorted(rows());
  const s = SORTS.find(x=>x.id===sortId) || SORTS[0];
  const cards = document.getElementById('cards');
  cards.innerHTML = SORTS.map(cat=>{
    const top = sorted(rows()).sort((a,b)=>cat.get(b)-cat.get(a) || b.pts-a.pts).slice(0,5);
    return `<section class="card"><h3>감독 ${cat.label} 순위</h3>${
      top.length ? top.map((r,i)=>`<div class="item"><div class="rank ${i<3?'r'+(i+1):''}">${i+1}</div><div class="meta"><div class="name">${r.name}</div><div class="sub">${r.sessions}세션 · ${r.wins}승 ${r.draws}무 ${r.losses}패</div></div><div class="val">${cat.fmt(r)}</div></div>`).join('')
      : '<div class="empty">기록 없음</div>'
    }</section>`;
  }).join('');

  document.getElementById('tbody').innerHTML = list.length ? list.map((r,i)=>`
    <tr>
      <td>${i+1}</td><td>${r.name}</td><td>${r.sessions}</td><td>${r.games}</td>
      <td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td>
      <td>${r.gf}</td><td>${r.ga}</td><td>${gd(r)}</td><td>${r.pts}</td><td>${wr(r)}</td>
    </tr>`).join('') : `<tr><td colspan="12" class="empty">이 기간 기록 없음</td></tr>`;
}

function init(){
  const sel = document.getElementById('period');
  const order = ['all','2026-Q1','2026-Q2','2026-Q3','2026-Q4'];
  sel.innerHTML = order.map(k=>`<option value="${k}">${DATA.labels[k]||k}</option>`).join('');
  // default current quarter if exists
  const now = new Date();
  const cq = `${now.getFullYear()}-Q${Math.floor(now.getMonth()/3)+1}`;
  period = DATA.periods[cq] && DATA.periods[cq].length ? cq : 'all';
  sel.value = period;
  sel.onchange = ()=>{ period = sel.value; render(); };

  const chips = document.getElementById('sortChips');
  chips.innerHTML = SORTS.map(s=>`<button type="button" class="chip ${s.id===sortId?'on':''}" data-sort="${s.id}">${s.label}순</button>`).join('');
  chips.onclick = e=>{
    const b = e.target.closest('[data-sort]');
    if(!b) return;
    sortId = b.dataset.sort;
    [...chips.children].forEach(c=>c.classList.toggle('on', c.dataset.sort===sortId));
    render();
  };
  render();
}
init();
</script>
</body>
</html>
