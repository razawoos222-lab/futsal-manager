<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="JMFC">
  <defs>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="35%" stop-color="#a1a1aa"/>
      <stop offset="65%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="silverInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="lionFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <pattern id="shieldStripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="3" height="6" fill="#18181b"/>
      <rect x="3" width="3" height="6" fill="#fafafa"/>
    </pattern>
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer silver bezel -->
  <circle cx="60" cy="60" r="56" fill="url(#silverRing)" filter="url(#emblemShadow)"/>
  <circle cx="60" cy="60" r="52" fill="url(#silverInner)" stroke="#52525b" stroke-width="0.75"/>
  <circle cx="60" cy="60" r="48" fill="#fafafa" stroke="#a1a1aa" stroke-width="1"/>
  <!-- Top arc: JMFC -->
  <path id="topArc" d="M 22 62 A 38 38 0 0 1 98 62" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="900" fill="#18181b" letter-spacing="0.14em">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">JMFC</textPath>
  </text>
  <!-- Bottom arc: EST. 206 -->
  <path id="botArc" d="M 26 72 A 34 34 0 1 1 94 72" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="6.5" font-weight="700" fill="#52525b" letter-spacing="0.1em">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">EST. 206</textPath>
  </text>
  <!-- Striped shield -->
  <path d="M60 30 L72 37 V52 C72 62 67 70 60 74 C53 70 48 62 48 52 V37 Z" fill="url(#shieldStripes)" stroke="#18181b" stroke-width="1.2"/>
  <path d="M60 34 L68 39 V51 C68 59 64 65 60 68 C56 65 52 59 52 51 V39 Z" fill="#fafafa" opacity="0.15"/>
  <!-- Lion (simplified heraldic) -->
  <g fill="url(#lionFill)" stroke="#3f3f46" stroke-width="0.6">
    <path d="M54 46 C52 42 56 40 60 40 C64 40 68 42 66 46 C65 48 63 49 60 49 C57 49 55 48 54 46 Z"/>
    <path d="M56 48 L58 44 L60 48 L62 44 L64 48 C63 50 61 51 60 51 C59 51 57 50 56 48 Z"/>
    <ellipse cx="57" cy="45" rx="1" ry="1.2" fill="#18181b" stroke="none"/>
    <ellipse cx="63" cy="45" rx="1" ry="1.2" fill="#18181b" stroke="none"/>
    <path d="M58 52 C59 56 60 58 60 62 C60 58 61 56 62 52 C61 54 59 54 58 52 Z"/>
    <path d="M52 50 C50 52 51 55 54 56 C53 53 52 51 52 50 Z"/>
    <path d="M68 50 C70 52 69 55 66 56 C67 53 68 51 68 50 Z"/>
    <path d="M57 54 Q60 57 63 54" fill="none" stroke="#52525b" stroke-width="0.5"/>
  </g>
</svg>
