<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="JMFC EST. 2016">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </radialGradient>
    <linearGradient id="outerBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="18%" stop-color="#d4d4d8"/>
      <stop offset="45%" stop-color="#71717a"/>
      <stop offset="72%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="innerBevel" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="lionMetal" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="35%" stop-color="#a1a1aa"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <pattern id="shieldStripes" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="8" fill="#09090b"/>
      <rect x="4" width="4" height="8" fill="#f4f4f5"/>
    </pattern>
    <pattern id="carbon" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#18181b"/>
      <path d="M0 3 L3 0 L6 3 L3 6 Z" fill="none" stroke="#27272a" stroke-width="0.4"/>
    </pattern>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="-1" k3="1"/>
    </filter>
  </defs>

  <!-- Carbon backdrop hint -->
  <rect width="240" height="240" fill="url(#carbon)" opacity="0.08"/>

  <g filter="url(#drop)">
    <!-- Outer metallic ring -->
    <circle cx="120" cy="120" r="112" fill="url(#outerBevel)"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="#fafafa" stroke-width="1.2" opacity="0.55"/>
    <circle cx="120" cy="120" r="100" fill="url(#bgGlow)" stroke="#52525b" stroke-width="1.5"/>

    <!-- Inner black separator -->
    <circle cx="120" cy="120" r="92" fill="none" stroke="#09090b" stroke-width="3"/>

    <!-- Text band -->
    <circle cx="120" cy="120" r="88" fill="#fafafa" stroke="#a1a1aa" stroke-width="0.8"/>

    <!-- Side rules -->
    <line x1="44" y1="120" x2="58" y2="120" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <line x1="182" y1="120" x2="196" y2="120" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>

    <!-- Top arc JMFC -->
    <path id="topArc" d="M 42 128 A 78 78 0 0 1 198 128" fill="none"/>
    <text font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="22" font-weight="900" fill="#09090b" letter-spacing="0.22em">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">JMFC</textPath>
    </text>

    <!-- Bottom arc EST. 2016 -->
    <path id="botArc" d="M 52 136 A 68 68 0 1 1 188 136" fill="none"/>
    <text font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3f3f46" letter-spacing="0.14em">
      <textPath href="#botArc" startOffset="50%" text-anchor="middle">EST. 2016</textPath>
    </text>

    <!-- Inner black ring around shield -->
    <circle cx="120" cy="120" r="58" fill="none" stroke="#09090b" stroke-width="2.5"/>

    <!-- Shield -->
    <path d="M120 66 L148 82 V112 C148 132 136 148 120 156 C104 148 92 132 92 112 V82 Z"
          fill="url(#shieldStripes)" stroke="#09090b" stroke-width="2.2" filter="url(#innerShadow)"/>
    <path d="M120 72 L140 84 V110 C140 126 131 138 120 144 C109 138 100 126 100 110 V84 Z"
          fill="#ffffff" opacity="0.08"/>

    <!-- Rampant lion (facing left) -->
    <g fill="url(#lionMetal)" stroke="#27272a" stroke-width="1.2" stroke-linejoin="round">
      <!-- Mane -->
      <path d="M108 98 C100 92 98 84 104 78 C110 72 118 74 122 80 C126 74 134 72 140 78 C146 84 144 92 136 98 C132 102 126 104 120 104 C114 104 112 102 108 98 Z"/>
      <!-- Head -->
      <path d="M104 88 C102 84 104 80 108 80 C112 80 114 84 112 88 C110 92 106 92 104 88 Z"/>
      <circle cx="106" cy="84" r="1.6" fill="#09090b" stroke="none"/>
      <circle cx="112" cy="83" r="1.6" fill="#09090b" stroke="none"/>
      <!-- Body upright -->
      <path d="M112 96 L108 118 L114 132 L120 138 L126 132 L132 118 L128 96 Z"/>
      <!-- Forepaws raised -->
      <path d="M108 100 L98 88 L94 92 L102 104 Z"/>
      <path d="M132 100 L142 88 L146 92 L138 104 Z"/>
      <!-- Hind legs -->
      <path d="M114 132 L110 146 L118 148 L120 138 Z"/>
      <path d="M126 132 L130 146 L122 148 L120 138 Z"/>
      <!-- Tail -->
      <path d="M128 118 C138 112 146 118 144 128 C142 134 136 136 132 132" fill="none" stroke-width="1.4"/>
    </g>
  </g>
</svg>
