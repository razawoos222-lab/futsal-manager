<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>JMFC Session · v7.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f0f0f2; --card:#fff; --text:#18181b; --muted:#52525b;
      --border:#e4e4e7; --border-strong:#a1a1aa;
      --red:#dc2626; --blue:#2563eb; --black:#27272a;
      --yellow:#fde047; --yellow-text:#f59e0b;
      --gold:#c9a227; --gold-light:#f5e6b8; --neon:#a3e635;
      --green:#16a34a; --primary:#2563eb; --sub:#7c3aed; --sub-dark:#5b21b6;
      --safe-b:env(safe-area-inset-bottom,0px);
      --font-stat:0.92rem; --font-name:0.98rem; --touch-min:48px; --font-btn:0.94rem;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;justify-content:center;padding:12px 10px calc(16px + var(--safe-b))}
    .phone{width:100%;max-width:420px;background:var(--card);border-radius:24px;border:1.5px solid var(--border-strong);box-shadow:0 16px 48px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;min-height:min(100dvh - 24px,920px);position:relative}
    .jmfc-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid #c4c4c8;background:#fff;flex-shrink:0}
    .jmfc-bar img.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .jmfc-brand strong{display:block;font-family:Cinzel,Georgia,serif;font-size:0.82rem;font-weight:900;letter-spacing:0.06em}
    .jmfc-brand span{display:block;font-size:0.68rem;color:var(--muted);font-weight:600;margin-top:1px}
    .steps{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #dbe7f5;background:linear-gradient(180deg,#f3f8ff,#eef4fb);flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .steps::-webkit-scrollbar{display:none}
    .steps button{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:0.72rem;font-weight:800;font-family:inherit;color:#64748b;background:rgba(255,255,255,.88);border:1px solid #d5e2f1;box-shadow:0 1px 2px rgba(15,23,42,.04);cursor:pointer;backdrop-filter:blur(8px)}
    .steps button.on{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-color:#1d4ed8;box-shadow:0 6px 14px rgba(37,99,235,.28)}
    .steps button.done{color:#15803d;border-color:#86efac;background:#f0fdf4}
    .body{padding:12px 14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
    h2{font-size:1.12rem;font-weight:900;margin-bottom:8px}
    .sub{font-size:0.8rem;color:var(--muted);margin-bottom:10px;line-height:1.45}
    .field{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--border);padding:8px 12px;font:inherit;font-weight:700;margin-bottom:10px;background:#fff}
    .label-sm{display:block;font-size:0.78rem;font-weight:700;color:var(--muted);margin-bottom:4px}
    .seg{display:flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
    .seg button{flex:1;min-height:44px;border:none;background:#fafafa;font-weight:800;font-size:0.85rem;font-family:inherit;color:var(--muted);cursor:pointer}
    .seg button.on{background:var(--primary);color:#fff}
    .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .mini{padding:6px 10px;border-radius:8px;border:1.5px solid var(--border);background:#f4f4f5;font-size:0.75rem;font-weight:700;font-family:inherit;cursor:pointer}
    .mini.on{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
    .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .chip{min-height:52px;border-radius:14px;border:1px solid #e5e7eb;background:#f8fafc;font-weight:800;font-size:0.95rem;font-family:inherit;color:#111827;cursor:pointer;padding:12px 8px;line-height:1.2;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .chip.on{border-color:#86efac;background:#f0fdf4;color:#166534;box-shadow:0 0 0 2px rgba(22,163,74,.12)}
    .chip.off{opacity:1}
    .chip.merc{border-style:dashed}
    .chip.taken{opacity:.35;pointer-events:none}
    .coach-slots{display:grid;gap:10px;margin-bottom:12px}
    .coach-slots.m2,.coach-slots.m3,.coach-slots.m4{grid-template-columns:1fr 1fr}
    .cslot{min-height:78px;border-radius:14px;border:1.5px solid #e5e7eb;padding:12px 10px;text-align:center;font-size:0.72rem;font-weight:800;color:var(--muted);background:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .cslot.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
    .cslot.filled{border-color:#cbd5e1;color:var(--text)}
    .cslot .slot-team{display:block;font-size:0.7rem;font-weight:900;letter-spacing:.02em}
    .cslot .slot-name{display:block;font-size:1.02rem;font-weight:900;margin-top:6px;color:#111827}
    .section-card{border:1.5px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:12px}
    .section-card h3{font-size:0.88rem;font-weight:900;margin-bottom:8px}
    .draft-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
    .draft-row .num{font-size:0.72rem;font-weight:800;color:#94a3b8;text-align:center}
    .draft-team{display:flex;align-items:center;gap:8px;min-height:48px;border-radius:999px;border:1px solid #e5e7eb;padding:8px 12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .draft-team .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .draft-team .dot.RED{background:var(--red)} .draft-team .dot.BLUE{background:var(--blue)}
    .draft-team .dot.YELLOW{background:var(--yellow)} .draft-team .dot.BLACK{background:#52525b}
    .draft-team .tname{font-size:0.8rem;font-weight:900;min-width:4rem}
    .draft-team .pname{flex:1;font-size:0.9rem;font-weight:800;color:var(--text)}
    .draft-team .pname.empty{color:#94a3b8;font-weight:700}
    .draft-team.current{border-color:#93c5fd;background:#eff6ff;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
    .icon-btns{display:flex;gap:4px}
    .icon-btns button{width:34px;height:34px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-weight:900;font-family:inherit;cursor:pointer;font-size:0.72rem;color:#64748b}
    .team-cards{display:flex;flex-direction:column;gap:12px;margin:14px 0}
    .team-stat-card{padding:14px;border-radius:16px;border:1px solid #e5e7eb;background:#fff;min-height:96px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .team-stat-card.RED{border-left:4px solid var(--red)}
    .team-stat-card.BLUE{border-left:4px solid var(--blue)}
    .team-stat-card.YELLOW{border-left:4px solid var(--yellow)}
    .team-stat-card.BLACK{border-left:4px solid #52525b}
    .team-stat-card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
    .team-stat-card .head h4{font-size:0.9rem;font-weight:900}
    .team-stat-card .head .val{font-size:0.95rem;font-weight:900;text-align:right;line-height:1.25}
    .team-stat-card .meta{font-size:0.78rem;font-weight:700;color:var(--muted);margin-bottom:10px}
    .team-stat-card .names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
    .team-stat-card .names span{display:block;text-align:center;font-size:0.82rem;font-weight:800;padding:7px 4px;border-radius:10px;background:#f8fafc;border:1px solid #eef2f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .team-pick{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:16px;border:1.5px solid #e5e7eb;background:#fff;font-weight:900;font-size:1rem;margin-bottom:10px;cursor:pointer;font-family:inherit;width:100%;text-align:left;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .team-pick.picked{box-shadow:0 0 0 2px rgba(37,99,235,.12)}
    .team-pick.RED.picked{border-color:var(--red);background:#fff7f7}
    .team-pick.BLUE.picked{border-color:var(--blue);background:#f5f9ff}
    .team-pick.YELLOW.picked{border-color:var(--yellow);background:#fffbeb}
    .team-pick.BLACK.picked{border-color:#52525b;background:#f8fafc}
    .hist-item{width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid #e5e7eb;background:#fff;margin-bottom:8px;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .hist-item b{font-size:0.9rem}
    .hist-item span{display:block;font-size:0.78rem;color:var(--muted);margin-top:4px;font-weight:700}
    .flow-note{font-size:0.72rem;color:var(--blue);font-weight:700;padding:8px;background:#eff6ff;border-radius:8px;border:1px solid #bfdbfe;margin-bottom:10px;line-height:1.45}
    .score-big{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:16px;border-radius:16px;border:1px solid #e5e7eb;margin-bottom:12px;text-align:center;font-weight:900;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .score-big .sep{font-size:1.35rem;color:#94a3b8}
    .score-big .side{font-size:0.85rem}
    .score-big .pwr{display:none}
    .ctrl-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .timer-ring-wrap{width:112px;height:112px;position:relative;flex:0 0 auto}
    .timer-ring-wrap svg{width:112px;height:112px;transform:rotate(-90deg)}
    .timer-ring-wrap .track{fill:none;stroke:#e5e7eb;stroke-width:8}
    .timer-ring-wrap .prog{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
    .timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
    .timer-center .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.35rem;font-weight:900;color:#0f172a;letter-spacing:.02em}
    .timer-center .l{font-size:0.68rem;font-weight:700;color:#94a3b8;margin-top:2px}
    .btn-sm{min-height:44px;padding:10px 14px;border-radius:12px;border:none;font-size:0.82rem;font-weight:800;font-family:inherit;color:#fff;cursor:pointer}
    .btn-sm.gray{background:#64748b}
    .btn-sm.blue{background:linear-gradient(180deg,#3b82f6,#1d4ed8);box-shadow:0 8px 16px rgba(37,99,235,.28), inset 0 1px 0 rgba(255,255,255,.25);min-width:108px;border-radius:999px;padding:12px 22px;font-size:0.92rem}
    .tabs{display:flex;justify-content:space-around;gap:8px;margin-bottom:12px;border-bottom:1.5px solid var(--border);padding:0 4px}
    .tabs button{flex:1;padding:10px 8px;font-size:0.78rem;font-weight:800;color:var(--muted);border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-1.5px;font-family:inherit;cursor:pointer}
    .tabs button.on{color:var(--text);border-bottom-color:var(--primary)}
    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .lineup-col{border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06)}
    .lineup-col .team-head{padding:10px 8px;text-align:center;font-family:Cinzel,Georgia,serif;font-size:0.9rem;font-weight:900;letter-spacing:0.1em;color:#fff}
    .lineup-col.team-RED .team-head{background:linear-gradient(135deg,#b91c1c,#dc2626)}
    .lineup-col.team-BLUE .team-head{background:linear-gradient(135deg,#1d4ed8,#2563eb)}
    .lineup-col.team-YELLOW .team-head{background:linear-gradient(135deg,#eab308,#facc15);color:#422006}
    .lineup-col.team-BLACK .team-head{background:linear-gradient(135deg,#27272a,#52525b)}
    .lineup-col .roster{padding:8px 6px 10px}
    .prow{margin-bottom:6px}
    .prow button{width:100%;border:none;font-family:inherit;border-radius:10px;text-align:left;padding:11px 10px;font-size:1.02rem;font-weight:900;background:#f8fafc;border:1.5px solid #e4e4e7;min-height:46px;cursor:pointer}
    .lineup-col.team-RED .prow button{border-left:3px solid var(--red)}
    .lineup-col.team-BLUE .prow button{border-left:3px solid var(--blue)}
    .lineup-col.team-YELLOW .prow button{border-left:3px solid var(--yellow)}
    .lineup-col.team-BLACK .prow button{border-left:3px solid #52525b}
    .prow button.tap{background:#eff6ff;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
    .prow .cap{font-size:0.62rem;font-weight:800;margin-right:4px;background:#18181b;padding:2px 5px;border-radius:4px;color:var(--neon)}
    .btn-sub{width:calc(100% - 12px);margin:8px 6px 4px;min-height:var(--touch-min);padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--sub),var(--sub-dark));color:#fff;font-weight:900;font-size:var(--font-btn);font-family:inherit;cursor:pointer}
    .btn-add{width:calc(100% - 12px);margin:4px 6px 10px;min-height:var(--touch-min);padding:12px;border:none;border-radius:12px;background:#0f766e;color:#fff;font-weight:900;font-size:var(--font-btn);font-family:inherit;cursor:pointer}
    .act2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 0}
    .act2 button{padding:12px;min-height:var(--touch-min);border:none;border-radius:12px;font-weight:800;font-size:var(--font-btn);font-family:inherit;color:#fff;cursor:pointer}
    .act2 .u{background:#71717a}.act2 .e{background:var(--primary)}
    .btn{width:100%;min-height:48px;border:none;border-radius:12px;font-weight:900;font-size:0.94rem;font-family:inherit;cursor:pointer}
    .btn-cta{background:var(--primary);color:#fff}
    .btn-green{background:var(--green);color:#fff}
    .btn-danger{background:#991b1b;color:#fff}
    .btn-sec{background:#fafafa;color:var(--muted);border:1.5px solid var(--border);font-weight:800}
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .result-btns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .mvp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .result-hero{padding:14px 10px;border-radius:16px;background:linear-gradient(145deg,#0c0c0e 0%,#1a1a22 55%,#121218 100%);border:1.5px solid var(--gold)}
    .eyebrow{font-family:Cinzel,Georgia,serif;font-size:0.62rem;font-weight:900;letter-spacing:0.1em;color:var(--gold-light);text-align:center}
    .mvp-names{text-align:center;font-size:1.02rem;font-weight:900;color:#fff;margin-top:10px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
    .award-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .award{padding:12px;border-radius:12px;background:linear-gradient(160deg,#fafafa,#f4f4f5);border:1.5px solid var(--border);font-size:0.84rem;font-weight:700;line-height:1.4}
    .award b{display:block;font-size:0.72rem;color:#57534e;margin-bottom:6px;font-weight:800}
    .result-card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e5e7eb;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .result-card h3{font-size:0.95rem;font-weight:900;margin-bottom:10px}
    .result-card.stats-card table.data td:first-child{font-weight:900}
    .result-card.stats-card tr:hover td{background:#f8fafc}
    .team-RED{border-left:4px solid var(--red)}.team-BLUE{border-left:4px solid var(--blue)}.team-YELLOW{border-left:4px solid var(--yellow)}.team-BLACK{border-left:4px solid #52525b}
    .t-RED{color:var(--red)}.t-BLUE{color:var(--blue)}.t-YELLOW{color:var(--yellow-text)}.t-BLACK{color:var(--black)}
    .team-title{font-weight:900;margin-bottom:8px;font-size:0.95rem}
    table.data{width:100%;border-collapse:collapse;font-size:0.86rem;table-layout:fixed}
    table.data th,table.data td{border-bottom:1px solid var(--border);padding:9px 2px;text-align:center;white-space:nowrap;font-size:0.86rem;font-weight:700}
    table.data th{color:#64748b;font-weight:800;font-size:0.78rem}
    table.data td:first-child,table.data th:first-child{text-align:left;padding-left:2px;font-size:0.86rem;font-weight:800}
    table.data .mp{font-variant-numeric:tabular-nums;font-weight:900}
    table.standings{min-width:100%}
    table.standings th, table.standings td{font-size:0.82rem !important;padding:9px 2px !important;font-weight:700}
    table.standings th:nth-child(1), table.standings td:nth-child(1){width:2.2rem}
    table.standings th:nth-child(2), table.standings td:nth-child(2){width:4.2rem;text-align:left;font-weight:900}
    .mvp-mini{margin-bottom:12px}
    .mvp-mini h3{font-size:0.88rem;font-weight:900;margin-bottom:8px}
    .mvp-mini .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:#f8fafc;border:1px solid #eef2f7;font-size:0.9rem;font-weight:700}
    .mvp-mini .rk{width:1.5rem;height:1.5rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:#94a3b8;font-size:0.75rem}
    .mvp-mini .rk.r1{background:#f59e0b}.mvp-mini .rk.r2{background:#64748b}.mvp-mini .rk.r3{background:#b45309}
    .mvp-mini .nm{flex:1;font-weight:900;line-height:1.3;overflow-wrap:anywhere}
    .timeline{max-height:160px;overflow-y:auto;font-size:0.8rem;line-height:1.5;margin-top:10px}
    .timeline li{border-bottom:1px solid var(--border);padding:7px 0;list-style:none;font-weight:700}
    .hint{font-size:0.72rem;color:var(--muted);text-align:center;margin:8px 0 4px;line-height:1.45}
    .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;font-size:0.85rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
    .toast.show{opacity:1}
    .modal-overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
    .modal-card{width:100%;max-width:360px;max-height:85%;overflow:auto;background:#fff;border-radius:16px;padding:16px;border:1.5px solid var(--border-strong);box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .modal-card h3{font-size:1.05rem;font-weight:900;text-align:center;margin-bottom:8px}
    .modal-card .msub{font-size:0.8rem;color:var(--muted);text-align:center;margin-bottom:12px;line-height:1.4}
    .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .modal-btns button{min-height:52px;border:none;border-radius:10px;font-weight:900;font-size:0.9rem;font-family:inherit;cursor:pointer}
    .modal-btns .goal,.modal-btns .def,.modal-btns .save,.modal-btns .assist{background:#18181b;color:var(--neon)}
    .modal-btns .cancel{grid-column:1/-1;background:#f4f4f5;color:var(--muted);border:1.5px solid var(--border);min-height:44px}
    .modal-btns .ok{background:var(--primary);color:#fff}
    .modal-btns .no{background:#f4f4f5;color:var(--muted);border:1.5px solid var(--border)}
    .assist-picks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .assist-picks button{padding:10px 16px;border-radius:999px;border:2px solid var(--border-strong);background:#fafafa;font-weight:800;font-family:inherit;cursor:pointer}
    .pool-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .pool-list button{padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:#fafafa;font-weight:800;font-family:inherit;cursor:pointer;font-size:0.85rem}
    .pool-list button.on{border-color:var(--green);background:#f0fdf4}
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="jmfc-bar">
      <img class="logo" src="../assets/jmfc-logo.png" alt="JMFC" />
      <div class="jmfc-brand"><strong>JMFC FOOTBALL</strong><span id="bar-sub">참석 조사 · 동작판</span></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="body" id="main"></div>
  </div>
  <div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='jmfc_session_v2';
const LAST_ATT_KEY='jmfc_last_attending_v1';

const byName=Object.fromEntries(PLAYERS.map(p=>[p.name,p]));
let maxCcpG=Math.max(...PLAYERS.map(p=>p.ccpPerGame||0),1);

function todayStr(){const d=new Date();const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function emptyTeams(){return {RED:[],BLUE:[],YELLOW:[],BLACK:[]};}
function emptyTeamStats(){return Object.fromEntries(TEAM_ALL.map(t=>[t,{matchesPlayed:0,wins:0,draws:0,losses:0,goalsFor:0,goalsAgainst:0}]));}
function personalScore(n){const p=byName[n];if(!p||!(p.ccpPerGame>0))return 0;return (p.ccpPerGame/maxCcpG)*100;}
function calcTeamPower(names){const list=(names||[]).filter(n=>byName[n]);if(!list.length)return 0;return Math.round(Math.min(100,Math.max(0,list.reduce((a,n)=>a+personalScore(n),0)/list.length)));}
function calcTeamWinRate(names){const vals=(names||[]).map(n=>byName[n]).filter(p=>p&&!p.isMercenary&&p.winRatePct>0).map(p=>p.winRatePct);if(!vals.length)return '-';return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+'%';}
function mpOf(s){return (s.goal||0)*2+(s.assist||0)*2+(s.defense||0)+(s.save||0);}
function atkOf(s){return (s.goal||0)*2+(s.assist||0)*2;}
function defOf(s){return (s.defense||0)+(s.save||0);}
function statLabel(stat){return ({goal:'득점',assist:'도움',defense:'수비',save:'선방'})[stat]||stat;}

function formatDateLabel(iso){if(!iso)return '';const [y,m,d]=iso.split('-');return `${y}.${m}.${d}`;}
function fmtTime(sec){const s=Math.max(0,sec|0);const m=Math.floor(s/60);const r=s%60;return `${m}:${String(r).padStart(2,'0')}`;}
function elapsedClock(){const elapsed=Math.max(0,(state.duration||0)-(state.secondsLeft||0));return fmtTime(elapsed);}

function snakeTeamAt(i){const names=teamNames();const n=names.length;const round=Math.floor(i/n);const pos=i%n;return round%2===0?names[pos]:names[n-1-pos];}
function remainingPool(){const taken=new Set(TEAM_ALL.flatMap(t=>state.teams[t]||[]));return state.attending.filter(n=>!taken.has(n));}
function rebuildDraftSlots(){const left=remainingPool();const keep=state.draftSlots.filter(s=>s.name);const keptNames=new Set(keep.map(s=>s.name));const need=left.filter(n=>!keptNames.has(n));const slots=[...keep];need.forEach((_,i)=>slots.push({team:snakeTeamAt(slots.length),name:null}));state.draftSlots=slots.map((s,i)=>({team:s.team||snakeTeamAt(i),name:s.name||null}));}
function applyDraftSlotsToTeams(){const base=emptyTeams();teamNames().forEach(t=>{const c=state.coaches[t];if(c)base[t].push(c);});state.draftSlots.forEach(s=>{if(s.name&&s.team&&!base[s.team].includes(s.name))base[s.team].push(s.name);});state.teams=base;}
function currentDraftIdx(){return state.draftSlots.findIndex(s=>!s.name);}
function cycleSlotTeam(idx,dir){const names=teamNames();const cur=state.draftSlots[idx].team;const i=Math.max(0,names.indexOf(cur));state.draftSlots[idx].team=names[(i+dir+names.length)%names.length];applyDraftSlotsToTeams();}
function moveSlot(idx,dir){const j=idx+dir;if(j<0||j>=state.draftSlots.length)return;const arr=state.draftSlots;const tmp=arr[idx];arr[idx]=arr[j];arr[j]=tmp;applyDraftSlotsToTeams();}

function renderSteps(){const idx=FLOW.indexOf(state.screen);document.getElementById('steps').innerHTML=FLOW.map((k,i)=>`<button type="button" class="${i===idx?'on':(i<idx?'done':'')}" data-act="go-step" data-screen="${k}">${FLOW_LABEL[k]}</button>`).join('');const sub={attendance:'참석 조사',coach:'감독 선정',draft:'팀 나누기',lineup:`${state.teamMode}팀 라인업`,matchSelect:'경기 선택',match:state.editingMatchId?`경기 수정 #${state.editingMatchId}`:`Match #${state.matchCount}`,results:state.sessionLabel||formatDateLabel(state.sessionDate),edit:'기록 수정'}[state.screen]||'';document.getElementById('bar-sub').textContent=sub;}
function navRow(prev,next,nextDisabled,nextAct,nextLabel){const na=nextAct||(next?`data-act="go" data-screen="${next}"`:'');return `<div class="nav-row"><button class="btn btn-sec" ${prev?`data-act="go" data-screen="${prev}"`:'disabled'}>← 이전</button><button class="btn btn-cta" ${nextDisabled?'disabled':''} ${na}>${nextLabel||'다음 →'}</button></div>`;}

function teamCardHtml(t){const roster=state.teams[t]||[];const coach=state.coaches[t];const wr=calcTeamWinRate(roster);const nameSpans=(roster.length?roster:[null]).map(n=>{if(!n)return '<span style="grid-column:1/-1;color:#94a3b8">비어 있음</span>';const label=n===coach?`${n}(C)`:n;return `<span title="${label}">${label}</span>`;}).join('');return `<div class="team-stat-card ${t}"><div class="head"><h4 class="t-${t}">TEAM ${t}</h4><span class="val t-${t}">팀승률 ${wr}</span></div><div class="meta">인원 ${roster.length}명</div><div class="names">${nameSpans}</div></div>`;}

function standingsRows(){const active=teamNames();const ranked=active.map(t=>{const s=state.teamStats[t];const gd=s.goalsFor-s.goalsAgainst;const pts=s.wins*3+s.draws;const wr=(s.wins+s.losses)>0?Math.round(s.wins/(s.wins+s.losses)*100)+'%':'-';return {t,...s,gd,pts,wr};}).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.goalsFor-a.goalsFor);const rankMap={};ranked.forEach((r,i)=>rankMap[r.t]=i+1);return activeStandingsOrder().map(t=>{const s=state.teamStats[t];const gd=s.goalsFor-s.goalsAgainst;const pts=s.wins*3+s.draws;const wr=(s.wins+s.losses)>0?Math.round(s.wins/(s.wins+s.losses)*100)+'%':'-';return {t,rank:rankMap[t]||'-',...s,gd,pts,wr};});}
function standingsTableHtml(){const rows=standingsRows();return `<div class="result-card" style="overflow-x:auto"><table class="data standings"><thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>득실</th><th>승률</th><th>승점</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank}</td><td class="t-${r.t}" style="font-weight:900">${r.t}</td><td>${r.matchesPlayed}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.goalsFor}</td><td>${r.goalsAgainst}</td><td>${r.gd>0?'+':''}${r.gd}</td><td>${r.wr}</td><td>${r.pts}</td></tr>`).join('')}</tbody></table></div>`;}
function topList(kind){return Object.entries(state.playerStats).map(([name,s])=>{let v=0;if(kind==='atk')v=atkOf(s);else if(kind==='dfn')v=defOf(s);else v=s[kind]||0;return {name,v,...s};}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v||a.name.localeCompare(b.name,'ko'));}
function mvpNamesOnly(list){if(!list.length)return '-';const top=list[0].v;return list.filter(x=>x.v===top).map(x=>x.name).join(' · ');}
function teamPlayerTable(t){const names=state.teams[t]||[];const list=names.map(n=>{const s=ensureStat(n,t);return {name:n,...s,mp:mpOf(s)};}).sort((a,b)=>b.mp-a.mp||a.name.localeCompare(b.name,'ko'));return `<div class="result-card team-${t}"><div class="team-title t-${t}">TEAM ${t}</div><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${list.map(p=>`<tr><td>${p.name}</td><td>${p.goal||0}</td><td>${p.assist||0}</td><td>${p.defense||0}</td><td>${p.save||0}</td><td class="mp">${p.mp}</td></tr>`).join('')||'<tr><td colspan="6">없음</td></tr>'}</tbody></table></div>`;}

function renderAttendance(){const list=[...PLAYERS].sort((a,b)=>(b.games||0)-(a.games||0)||a.name.localeCompare(b.name,'ko'));return `<h2>참석 조사</h2>
<label class="label-sm">경기 날짜</label>
<input type="date" class="field" id="session-date" value="${state.sessionDate}" />
<label class="label-sm">팀 구성</label>
<div class="seg">${[2,3,4].map(n=>`<button type="button" class="${state.teamMode===n?'on':''}" data-act="set-mode" data-mode="${n}">${n}팀</button>`).join('')}</div>
<p class="sub">등록 ${PLAYERS.length}명 · 선택 ${state.attending.length}명 · ${state.teamMode}팀${state.teamMode===4?' (BLACK 포함)':''}</p>
<div class="chip-row"><button type="button" class="mini" data-act="load-last-att">지난 경기 참석자 불러오기</button><button type="button" class="mini" data-act="select-all">전체 선택(용병제외)</button><button type="button" class="mini" data-act="clear-att">전체 해제</button></div>
<div class="chip-grid">${list.map(p=>`<button type="button" class="chip ${state.attending.includes(p.name)?'on':'off'} ${p.isMercenary?'merc':''}" data-act="toggle-att" data-name="${p.name}">${p.name}${p.isMercenary?' · 용병':''}</button>`).join('')}</div>
${navRow(null,'coach',state.attending.length<state.teamMode,'data-act="to-coach"','참석 완료 →')}`;}

function renderCoach(){const names=teamNames();const filled=names.filter(t=>state.coaches[t]).length;if(!state.coachPickTeam||!names.includes(state.coachPickTeam))state.coachPickTeam=names.find(t=>!state.coaches[t])||names[0];const picked=new Set(Object.values(state.coaches));const pool=state.attending.filter(n=>!picked.has(n));return `<h2>감독 ${names.length}명 선택</h2><p class="sub">① 팀 슬롯 탭 → ② 선수 탭 · ${filled}/${names.length}</p>
<div class="coach-slots m${names.length}">${names.map(t=>{const c=state.coaches[t];return `<div class="cslot ${c?'filled':''} ${state.coachPickTeam===t?'active':''}" data-act="pick-slot" data-team="${t}"><span class="slot-team t-${t}">TEAM ${t}</span><span class="slot-name">${c||'감독?'}</span></div>`;}).join('')}</div>
<div class="chip-grid">${pool.map(n=>`<button class="chip" data-act="set-coach-name" data-name="${n}">${n}</button>`).join('')||'<p class="sub">남은 선수 없음</p>'}</div>
${navRow('attendance',null,filled<names.length,'data-act="to-draft"','드래프트 시작 →')}`;}

function renderDraft(){applyDraftSlotsToTeams();const cur=currentDraftIdx();const pool=remainingPool();
return `<h2>팀 나누기</h2>
<p class="sub">드래프트 순서를 ▲▼ / 팀 버튼으로 조작 → 아래 선수 클릭으로 배정</p>
<div class="section-card"><h3>픽 순서</h3>
<div class="chip-row"><button type="button" class="mini" data-act="reset-snake-order">스네이크 순서로 재설정</button><button type="button" class="mini" data-act="clear-draft-names">배정 초기화</button></div>
${state.draftSlots.map((s,i)=>`<div class="draft-row">
  <div class="num">${i+1}</div>
  <div class="draft-team ${i===cur?'current':''}">
    <span class="dot ${s.team}"></span>
    <button type="button" class="tname t-${s.team}" data-act="cycle-team" data-idx="${i}" style="border:none;background:transparent;font:inherit;cursor:pointer">${s.team}</button>
    <span class="pname ${s.name?'':'empty'}">${s.name||(i===cur?'← 다음 픽':'대기')}</span>
    ${s.name?`<button type="button" class="mini" data-act="clear-pick" data-idx="${i}">✕</button>`:''}
  </div>
  <div class="icon-btns">
    <button type="button" data-act="move-slot" data-idx="${i}" data-dir="-1">▲</button>
    <button type="button" data-act="move-slot" data-idx="${i}" data-dir="1">▼</button>
  </div>
</div>`).join('')||'<p class="sub">배정할 선수 없음</p>'}
</div>
<div class="section-card"><h3>남은 선수 · 클릭 배정</h3>
<div class="chip-grid">${pool.map(n=>`<button class="chip" data-act="pick-player" data-name="${n}">${n}</button>`).join('')||'<p class="sub">모두 배정됨</p>'}</div>
</div>
<div class="team-cards">${teamNames().map(teamCardHtml).join('')}</div>
${navRow('coach',null,!!pool.length,'data-act="to-lineup"','팀 구성 완료 →')}`;}

function renderLineup(){return `<h2>${state.teamMode}팀 라인업</h2><p class="sub">${formatDateLabel(state.sessionDate)} · 팀승률(용병 제외)</p><div class="team-cards">${teamNames().map(teamCardHtml).join('')}</div>${navRow('draft','matchSelect',false,null,'경기 선택 →')}`;}

function renderMatchSelect(){const picks=state.playing;const opts=Array.from({length:6},(_,i)=>{const m=i+7;return `<option value="${m*60}" ${state.duration===m*60?'selected':''}>${m}분</option>`;}).join('');
const hist=(state.matchHistory||[]).map(h=>`<button type="button" class="hist-item" data-act="edit-match" data-id="${h.id}"><b>Match #${h.num}</b> · <span class="t-${h.a}">${h.a}</span> ${h.scoreA}:${h.scoreB} <span class="t-${h.b}">${h.b}</span><span>탭해서 지난 경기 다시 보기 · 수정</span></button>`).join('') || '<p class="sub">아직 완료된 경기가 없습니다</p>';
return `<h2>경기 선택</h2>
<div class="chip-row"><span class="mini on">Match #${state.matchCount}</span></div>
<div class="flow-note">2팀 선택 후 시작 · 지난 경기는 아래에서 다시 열어 수정</div>
<div class="section-card"><div class="label-sm">경기 시간 (7~12분)</div><select class="field" id="duration" style="margin:0">${opts}</select></div>
<p class="sub">경기 팀 선택 · ${picks.length} / 2</p>
${teamNames().map(t=>{const roster=state.teams[t]||[];const st=state.teamStats[t];const on=picks.includes(t);return `<button type="button" class="team-pick ${t} ${on?'picked':''}" data-act="toggle-play" data-team="${t}"><span><span class="t-${t}">TEAM ${t}</span><div style="font-size:0.8rem;font-weight:700;color:var(--muted);margin-top:6px">팀승률 ${calcTeamWinRate(roster)} · 오늘 ${st.wins}승 ${st.draws}무 ${st.losses}패</div></span><span style="font-size:0.82rem;font-weight:800;color:${on?'#2563eb':'#94a3b8'}">${on?'✓ 선택':'선택'}</span></button>`;}).join('')}
${hist?`<div class="section-card"><h3>지난 경기 · 탭해서 다시 보기</h3>${hist}</div>`:''}
<div class="result-btns"><button class="btn btn-cta" data-act="start-match" ${picks.length!==2?'disabled':''}>경기 시작</button><button class="btn btn-danger" data-act="ask-end-session">전체 세션 종료</button></div>
${navRow('lineup',null,picks.length!==2,'data-act="start-match"','경기 시작 →')}
${modalHtml()}`;
}

function waitingTeams(){return teamNames().filter(t=>!state.playing.includes(t));}
function allPoolNames(){return state.attending.slice().sort((a,b)=>a.localeCompare(b,'ko'));}

function modalHtml(){
  if(!state.modal)return '';
  const m=state.modal;
  if(m.type==='record'){return `<div class="modal-overlay"><div class="modal-card"><h3>${m.name} (TEAM ${m.team})</h3><p class="msub">기록을 선택하세요</p><div class="modal-btns"><button class="goal" data-act="rec" data-stat="goal">득점</button><button class="assist" data-act="rec" data-stat="assist">도움</button><button class="def" data-act="rec" data-stat="defense">수비</button><button class="save" data-act="rec" data-stat="save">선방</button><button class="cancel" data-act="close-modal">취소</button></div></div></div>`;}
  if(m.type==='assist'){const mates=(state.teams[m.team]||[]).filter(n=>n!==m.scorer);return `<div class="modal-overlay"><div class="modal-card"><h3>${m.scorer} 선수 득점!</h3><p class="msub">도움을 준 선수를 선택하세요</p><div class="assist-picks">${mates.map(n=>`<button type="button" data-act="pick-assist" data-name="${n}">${n}</button>`).join('')}<button type="button" data-act="pick-assist" data-name="">없음</button></div><button class="btn btn-sec" style="margin-top:12px" data-act="close-modal">취소</button></div></div>`;}
  if(m.type==='confirm-end-match'){return `<div class="modal-overlay"><div class="modal-card"><h3>현재 경기 종료</h3><p class="msub">이 경기를 종료하고<br>경기 선택으로 갈까요?</p><div class="modal-btns"><button class="ok" data-act="confirm-end-match">확인</button><button class="no" data-act="close-modal">취소</button></div></div></div>`;}
  if(m.type==='confirm-end-session'){return `<div class="modal-overlay"><div class="modal-card"><h3>전체 세션 종료</h3><p class="msub">오늘의 모든 경기를 끝내고<br>결과 화면으로 갈까요?</p><div class="modal-btns"><button class="ok" data-act="confirm-end-session">확인</button><button class="no" data-act="close-modal">취소</button></div></div></div>`;}
  if(m.type==='add'){
    const target=m.targetTeam||state.playing[0];
    const wait=waitingTeams();
    const waitPlayers=wait.flatMap(t=>(state.teams[t]||[]).map(n=>({n,t})));
    const inPlay=new Set(state.playing.flatMap(t=>state.teams[t]||[]));
    const others=allPoolNames().filter(n=>!inPlay.has(n)&&!waitPlayers.some(x=>x.n===n));
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 추가</h3><p class="msub">어느 팀에 넣을까요?</p>
      <div class="seg">${state.playing.map(t=>`<button type="button" class="${target===t?'on':''}" data-act="add-target" data-team="${t}">${t}</button>`).join('')}</div>
      ${wait.length?`<p class="label-sm">대기팀 (${wait.join(', ')})</p><div class="pool-list">${waitPlayers.map(x=>`<button type="button" data-act="do-add" data-name="${x.n}" data-from="${x.t}">${x.n}<span style="color:var(--muted);font-size:0.7rem"> · ${x.t}</span></button>`).join('')||'<span class="sub">없음</span>'}</div>`:''}
      <p class="label-sm">전체 참석자</p>
      <div class="pool-list">${others.map(n=>`<button type="button" data-act="do-add" data-name="${n}" data-from="">${n}</button>`).join('')||'<span class="sub">추가 가능 인원 없음</span>'}</div>
      <button class="btn btn-sec" data-act="close-modal">닫기</button></div></div>`;
  }
  if(m.type==='sub'){
    const team=m.team||state.playing[0];
    const out=m.out;
    const wait=waitingTeams();
    const waitPlayers=wait.flatMap(t=>(state.teams[t]||[]).map(n=>({n,t})));
    const inPlay=new Set(state.playing.flatMap(t=>state.teams[t]||[]));
    const others=allPoolNames().filter(n=>!inPlay.has(n));
    return `<div class="modal-overlay"><div class="modal-card"><h3>선수 교체 · TEAM ${team}</h3>
      <p class="label-sm">나가는 선수</p>
      <div class="pool-list">${(state.teams[team]||[]).map(n=>`<button type="button" class="${out===n?'on':''}" data-act="sub-out" data-name="${n}">${n}</button>`).join('')}</div>
      <p class="label-sm">대기팀 / 전체에서 들어오기</p>
      <div class="pool-list">${waitPlayers.map(x=>`<button type="button" data-act="do-sub" data-name="${x.n}" data-from="${x.t}" ${out?'':'disabled'}>${x.n} · ${x.t}</button>`).join('')}
      ${others.filter(n=>!waitPlayers.some(x=>x.n===n)).map(n=>`<button type="button" data-act="do-sub" data-name="${n}" data-from="" ${out?'':'disabled'}>${n}</button>`).join('')}</div>
      <div class="modal-btns" style="margin-top:8px"><button class="no" data-act="do-sub-remove" ${out?'':'disabled'}>코트 아웃만</button><button class="cancel" data-act="close-modal">닫기</button></div></div></div>`;
  }
  return '';
}

function renderMatch(){
  const [a,b]=state.playing; if(!a||!b) return `<p class="sub">경기를 선택하세요</p><button class="btn btn-cta" data-act="go" data-screen="matchSelect">경기 선택</button>`;
  const tab=state.matchTab; let body='';
  if(tab==='lineup'){
    body=`<div class="lineup-grid">${[a,b].map(t=>`<div class="lineup-col team-${t}"><div class="team-head">TEAM ${t}</div><div class="roster">${(state.teams[t]||[]).map(n=>`<div class="prow"><button type="button" class="${state.selectedPlayer===n?'tap':''}" data-act="open-record" data-name="${n}" data-team="${t}">${state.coaches[t]===n?'<span class="cap">C</span>':''}${n}</button></div>`).join('')}</div>
      <button class="btn-sub" data-act="open-sub" data-team="${t}">선수교체</button>
      <button class="btn-add" data-act="open-add" data-team="${t}">선수추가</button>
    </div>`).join('')}</div>
    <div class="section-card"><h3>타임라인</h3><ul class="timeline">${(state.timeline||[]).map(e=>`<li>[${e.time}] <span class="t-${e.team}">${e.player}</span> · ${statLabel(e.stat)}${e.assist?` (도움:${e.assist})`:''}</li>`).join('')||'<li style="color:var(--muted)">기록 없음</li>'}</ul></div>
    <div class="act2"><button class="u" data-act="undo-rec">스탯 취소</button><button class="e" data-act="ask-end-match">현재 경기 종료</button></div>`;
  } else if(tab==='standings'){
    body=standingsTableHtml();
  } else {
    const atk=topList('atk').slice(0,3), dfn=topList('dfn').slice(0,3);
    const rows=Object.entries(state.playerStats).map(([name,s])=>({name,...s,mp:mpOf(s)})).filter(p=>((state.teams[a]||[]).includes(p.name)||(state.teams[b]||[]).includes(p.name))).sort((x,y)=>y.mp-x.mp);
    body=`<div class="result-card mvp-mini"><h3>공격 MVP TOP3</h3>${atk.map((p,i)=>`<div class="row"><span class="rk r${i+1}">${i+1}</span><span class="nm">${p.name}</span><span>${p.v}P</span></div>`).join('')||'<p class="sub">기록 없음</p>'}
    <h3 style="margin-top:14px">수비 MVP TOP3</h3>${dfn.map((p,i)=>`<div class="row"><span class="rk r${i+1}">${i+1}</span><span class="nm">${p.name}</span><span>${p.v}P</span></div>`).join('')||'<p class="sub">기록 없음</p>'}</div>
    <div class="result-card stats-card"><h3>선수 기록</h3><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.name}</td><td>${p.goal||0}</td><td>${p.assist||0}</td><td>${p.defense||0}</td><td>${p.save||0}</td><td class="mp">${p.mp}</td></tr>`).join('')||'<tr><td colspan="6">기록 없음</td></tr>'}</tbody></table></div>`;
  }
  const ratio=state.duration>0?Math.max(0,Math.min(1,state.secondsLeft/state.duration)):0;
  const circ=2*Math.PI*46;
  const dash=circ*(1-ratio);
  return `<div class="score-big"><div class="side t-${a}">TEAM ${a}<div style="font-size:1.5rem;margin-top:4px">${state.score.A}</div></div><div class="sep">:</div><div class="side t-${b}">TEAM ${b}<div style="font-size:1.5rem;margin-top:4px">${state.score.B}</div></div></div>
<div class="ctrl-row"><button type="button" class="btn-sm gray" data-act="reset-score">리셋</button>
<div class="timer-ring-wrap"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="track" cx="56" cy="56" r="46"></circle><circle class="prog" id="timer-prog" cx="56" cy="56" r="46" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"></circle></svg><div class="timer-center"><div class="t" id="timer-text">${fmtTime(state.secondsLeft)}</div><div class="l">남은 시간</div></div></div>
<button type="button" class="btn-sm blue" data-act="toggle-timer">${state.timerRunning?'일시정지':'시작'}</button></div>
<div class="tabs"><button type="button" class="${tab==='lineup'?'on':''}" data-act="match-tab" data-tab="lineup">라인업</button><button type="button" class="${tab==='standings'?'on':''}" data-act="match-tab" data-tab="standings">팀 순위</button><button type="button" class="${tab==='stats'?'on':''}" data-act="match-tab" data-tab="stats">개인기록</button></div>
${body}
<button class="btn btn-danger" style="margin-top:10px" data-act="ask-end-session">전체 세션 종료</button>
${navRow('matchSelect',null,false,'data-act="ask-end-match"', state.editingMatchId?'수정 저장 →':'경기 종료 →')}
${modalHtml()}`;}

function renderResults(){const atk=topList('atk'),dfn=topList('dfn');
return `<h2>오늘의 경기 결과</h2><p class="sub">${formatDateLabel(state.sessionDate)} · ${state.teamMode}팀</p>
<div class="result-card mvp-mini"><h3>공격 MVP TOP3</h3>${atk.map((p,i)=>`<div class="row"><span class="rk r${i+1}">${i+1}</span><span class="nm">${p.name}</span><span>${p.v}P</span></div>`).join('')||'<p class="sub">기록 없음</p>'}
<h3 style="margin-top:14px">수비 MVP TOP3</h3>${dfn.map((p,i)=>`<div class="row"><span class="rk r${i+1}">${i+1}</span><span class="nm">${p.name}</span><span>${p.v}P</span></div>`).join('')||'<p class="sub">기록 없음</p>'}</div>
<div class="award-g"><div class="award"><b>TOP SCORER</b>${(()=>{const t=topList('goal');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div><div class="award"><b>TOP ASSIST</b>${(()=>{const t=topList('assist');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div><div class="award"><b>TOP DEFENSE</b>${(()=>{const t=topList('defense');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div><div class="award"><b>TOP SAVE</b>${(()=>{const t=topList('save');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div></div>
<h3 style="font-size:0.95rem;font-weight:900;margin:4px 0 8px">팀 순위</h3>${standingsTableHtml()}
${activeDetailOrder().map(t=>teamPlayerTable(t).replace('class="result-card','class="result-card stats-card')).join('')}
<p class="hint">공격P=득점×2+도움×2 · 수비P=수비+선방 · MP=공격P+수비P</p>
<div class="result-btns"><button class="btn btn-green" data-act="go" data-screen="edit">기록 수정하기</button><button class="btn btn-cta" data-act="save-new">기록 저장 & NEW 세션</button><button class="btn btn-danger" data-act="reset-new">기록 리셋 & NEW 세션</button></div>
${navRow('matchSelect','edit',false,null,'기록 수정 →')}`;}
function renderEdit(){return `<h2>기록 수정</h2><p class="sub">숫자 변경 시 MP 재계산</p>${activeDetailOrder().map(t=>{const names=state.teams[t]||[];return `<div class="result-card team-${t}"><div class="team-title t-${t}">TEAM ${t}</div><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${names.map(n=>{const s=ensureStat(n,t);return `<tr data-edit-name="${n}"><td>${n}</td><td><input type="number" min="0" data-f="goal" value="${s.goal||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="assist" value="${s.assist||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="defense" value="${s.defense||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="save" value="${s.save||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td class="mp" data-mp>${mpOf(s)}</td></tr>`;}).join('')}</tbody></table></div>`;}).join('')}<div class="result-btns"><button class="btn btn-cta" data-act="save-edit">수정 완료 → 결과로</button></div>${navRow('results',null,false,'data-act="save-edit"','수정 완료 →')}`;}

function stopTimer(){state.timerRunning=false;if(timerId){clearInterval(timerId);timerId=null;}}
function updateTimerUI(){const text=document.getElementById('timer-text'); if(text) text.textContent=fmtTime(state.secondsLeft); const prog=document.getElementById('timer-prog'); if(prog){const circ=2*Math.PI*46; const ratio=state.duration>0?Math.max(0,Math.min(1,state.secondsLeft/state.duration)):0; prog.style.strokeDasharray=String(circ); prog.style.strokeDashoffset=String(circ*(1-ratio));}}
function toggleTimer(){if(state.timerRunning){stopTimer();render();return;}state.timerRunning=true;timerId=setInterval(()=>{if(state.secondsLeft<=0){stopTimer();toast('경기 시간 종료');render();return;}state.secondsLeft--;updateTimerUI();},1000);render();}

function rebuildTeamStatsFromHistory(){
  const stats=emptyTeamStats();
  (state.matchHistory||[]).forEach(h=>{
    const A=stats[h.a], B=stats[h.b]; if(!A||!B) return;
    A.matchesPlayed++; B.matchesPlayed++;
    A.goalsFor+=h.scoreA; A.goalsAgainst+=h.scoreB; B.goalsFor+=h.scoreB; B.goalsAgainst+=h.scoreA;
    if(h.scoreA>h.scoreB){A.wins++;B.losses++;} else if(h.scoreA<h.scoreB){B.wins++;A.losses++;} else {A.draws++;B.draws++;}
  });
  state.teamStats=stats;
}

function endMatch(){
  stopTimer(); const [a,b]=state.playing; const sa=state.score.A, sb=state.score.B;
  const entry={id:state.editingMatchId||Date.now(), num:state.editingMatchId? (state.matchHistory.find(x=>x.id===state.editingMatchId)||{}).num || state.matchCount : state.matchCount, a,b,scoreA:sa,scoreB:sb,timeline:[...(state.timeline||[])]};
  if(state.editingMatchId){const i=state.matchHistory.findIndex(x=>x.id===state.editingMatchId); if(i>=0) state.matchHistory[i]=entry; else state.matchHistory.push(entry);}
  else {state.matchHistory.push(entry); state.matchCount++;}
  // player WDL for this match only when not editing complex - simplify: rebuild team stats from history
  rebuildTeamStatsFromHistory();
  // approximate player WDL from homeTeam + teamStats is already in playerStats from session; for mock keep cumulative from live play:
  if(!state.editingMatchId){
    let resA='draw'; if(sa>sb)resA='win'; else if(sa<sb)resA='loss';
    (state.teams[a]||[]).forEach(n=>{const s=ensureStat(n,a); if(resA==='win')s.wins++; else if(resA==='loss')s.losses++; else s.draws++;});
    (state.teams[b]||[]).forEach(n=>{const s=ensureStat(n,b); if(resA==='win')s.losses++; else if(resA==='loss')s.wins++; else s.draws++;});
  }
  state.playing=[]; state.score={A:0,B:0}; state.selectedPlayer=null; state.recordStack=[]; state.timeline=[]; state.editingMatchId=null; state.modal=null;
  toast('경기 종료 · 다음 경기 선택'); go('matchSelect');
}

function bind(){
  const dateEl=document.getElementById('session-date'); if(dateEl) dateEl.onchange=()=>{state.sessionDate=dateEl.value||todayStr();};
  const dur=document.getElementById('duration'); if(dur) dur.onchange=()=>{state.duration=Number(dur.value); state.secondsLeft=state.duration;};
  document.querySelectorAll('[data-act]').forEach(el=>{el.onclick=()=>{
    const act=el.dataset.act;
    if(act==='toggle-att'){const n=el.dataset.name; if(state.attending.includes(n)) state.attending=state.attending.filter(x=>x!==n); else state.attending.push(n); render();}
    else if(act==='set-mode'){state.teamMode=Number(el.dataset.mode); Object.keys(state.coaches).forEach(t=>{if(!teamNames().includes(t)) delete state.coaches[t];}); render();}
    else if(act==='load-last-att') loadLastAttending();
    else if(act==='select-all'){state.attending=PLAYERS.filter(p=>!p.isMercenary).map(p=>p.name); render();}
    else if(act==='clear-att'){state.attending=[]; render();}
    else if(act==='to-coach'){if(state.attending.length<state.teamMode) return toast('인원 부족'); saveLastAttending(state.attending); state.coachPickTeam=teamNames()[0]; go('coach');}
    else if(act==='pick-slot'){state.coachPickTeam=el.dataset.team; render();}
    else if(act==='set-coach-name'){const n=el.dataset.name; const t=state.coachPickTeam||teamNames().find(x=>!state.coaches[x]); if(!t)return; Object.keys(state.coaches).forEach(k=>{if(state.coaches[k]===n) delete state.coaches[k];}); state.coaches[t]=n; state.coachPickTeam=teamNames().find(x=>!state.coaches[x])||t; render();}
    else if(act==='to-draft'){if(!teamNames().every(t=>state.coaches[t])) return toast('감독을 모두 지정하세요'); state.teams=emptyTeams(); teamNames().forEach(t=>{if(state.coaches[t]) state.teams[t].push(state.coaches[t]);}); rebuildDraftSlots(); go('draft');}
    else if(act==='reset-snake-order'){state.draftSlots=state.draftSlots.map((s,i)=>({team:snakeTeamAt(i),name:s.name})); applyDraftSlotsToTeams(); render();}
    else if(act==='clear-draft-names'){state.draftSlots.forEach(s=>s.name=null); applyDraftSlotsToTeams(); rebuildDraftSlots(); render();}
    else if(act==='cycle-team'){cycleSlotTeam(Number(el.dataset.idx),1); render();}
    else if(act==='move-slot'){moveSlot(Number(el.dataset.idx), Number(el.dataset.dir)); render();}
    else if(act==='clear-pick'){state.draftSlots[Number(el.dataset.idx)].name=null; applyDraftSlotsToTeams(); render();}
    else if(act==='pick-player'){const idx=currentDraftIdx(); if(idx<0) return toast('빈 칸 없음'); state.draftSlots[idx].name=el.dataset.name; applyDraftSlotsToTeams(); render();}
    else if(act==='to-lineup'){applyDraftSlotsToTeams(); if(remainingPool().length) return toast('선수를 모두 배정하세요'); Object.entries(state.teams).forEach(([t,names])=>names.forEach(n=>ensureStat(n,t))); go('lineup');}
    else if(act==='toggle-play'){const t=el.dataset.team; if(state.playing.includes(t)) state.playing=state.playing.filter(x=>x!==t); else if(state.playing.length<2) state.playing.push(t); else toast('2팀만 선택'); render();}
    else if(act==='start-match'){if(state.playing.length!==2) return toast('2팀을 선택하세요'); const d=document.getElementById('duration'); if(d) state.duration=Number(d.value); state.secondsLeft=state.duration; state.score={A:0,B:0}; state.selectedPlayer=null; state.recordStack=[]; state.timeline=[]; state.editingMatchId=null; state.matchTab='lineup'; stopTimer(); go('match');}
    else if(act==='edit-match'){const id=Number(el.dataset.id); const h=state.matchHistory.find(x=>x.id===id); if(!h) return; state.editingMatchId=h.id; state.playing=[h.a,h.b]; state.score={A:h.scoreA,B:h.scoreB}; state.timeline=[...(h.timeline||[])]; state.matchTab='lineup'; state.secondsLeft=state.duration; stopTimer(); go('match'); toast(`Match #${h.num} 수정`);}
    else if(act==='match-tab'){state.matchTab=el.dataset.tab; render();}
    else if(act==='toggle-timer') toggleTimer();
    else if(act==='reset-score'){state.score={A:0,B:0}; toast('스코어 리셋'); render();}
    else if(act==='open-record'){state.selectedPlayer=el.dataset.name; state.modal={type:'record',name:el.dataset.name,team:el.dataset.team}; render();}
    else if(act==='close-modal'){state.modal=null; render();}
    else if(act==='rec'){const stat=el.dataset.stat; const n=state.modal.name; const t=state.modal.team; const s=ensureStat(n,t); s[stat]=(s[stat]||0)+1; const time=elapsedClock(); state.recordStack.push({name:n,stat,team:t}); if(stat==='goal'){const [xa,xb]=state.playing; if(t===xa) state.score.A++; if(t===xb) state.score.B++; state.timeline.push({time,player:n,team:t,stat:'goal'}); state.modal={type:'assist',scorer:n,team:t,time};} else {state.timeline.push({time,player:n,team:t,stat}); state.modal=null; toast(`${n} ${statLabel(stat)}+1`);} render();}
    else if(act==='pick-assist'){const an=el.dataset.name; if(an){const s=ensureStat(an,state.modal.team); s.assist=(s.assist||0)+1; state.recordStack.push({name:an,stat:'assist',team:state.modal.team}); const last=state.timeline[state.timeline.length-1]; if(last&&last.stat==='goal') last.assist=an; toast(`${an} 도움+1`);} state.modal=null; render();}
    else if(act==='undo-rec'){const last=state.recordStack.pop(); if(!last) return toast('취소할 기록 없음'); const s=ensureStat(last.name,last.team); s[last.stat]=Math.max(0,(s[last.stat]||0)-1); if(last.stat==='goal'){const [xa,xb]=state.playing; if(last.team===xa) state.score.A=Math.max(0,state.score.A-1); if(last.team===xb) state.score.B=Math.max(0,state.score.B-1);} state.timeline.pop(); toast('스탯 취소'); render();}
    else if(act==='ask-end-match'){state.modal={type:'confirm-end-match'}; render();}
    else if(act==='confirm-end-match') endMatch();
    else if(act==='ask-end-session'){state.modal={type:'confirm-end-session'}; render();}
    else if(act==='confirm-end-session'){stopTimer(); state.sessionLabel=formatDateLabel(state.sessionDate)+' · 세션 종료'; state.modal=null; go('results');}
    else if(act==='open-add'){state.modal={type:'add',targetTeam:el.dataset.team||state.playing[0]}; render();}
    else if(act==='add-target'){state.modal={...state.modal,targetTeam:el.dataset.team}; render();}
    else if(act==='do-add'){const name=el.dataset.name; const from=el.dataset.from; const to=state.modal.targetTeam; if(from){state.teams[from]=(state.teams[from]||[]).filter(n=>n!==name);} Object.keys(state.teams).forEach(t=>{state.teams[t]=(state.teams[t]||[]).filter(n=>n!==name);}); state.teams[to]=state.teams[to]||[]; if(!state.teams[to].includes(name)) state.teams[to].push(name); ensureStat(name,to); state.modal=null; toast(`${name} → ${to}`); render();}
    else if(act==='open-sub'){state.modal={type:'sub',team:el.dataset.team||state.playing[0],out:null}; render();}
    else if(act==='sub-out'){state.modal={...state.modal,out:el.dataset.name}; render();}
    else if(act==='do-sub'){const out=state.modal.out; const inn=el.dataset.name; const from=el.dataset.from; const team=state.modal.team; if(!out) return; state.teams[team]=(state.teams[team]||[]).filter(n=>n!==out); if(from) state.teams[from]=(state.teams[from]||[]).filter(n=>n!==inn); Object.keys(state.teams).forEach(t=>{state.teams[t]=(state.teams[t]||[]).filter(n=>n!==inn);}); if(!state.teams[team].includes(inn)) state.teams[team].push(inn); // put out to waiting first team if any
      const wait=waitingTeams()[0]; if(wait&&!state.teams[wait].includes(out)) state.teams[wait].push(out); ensureStat(inn,team); state.modal=null; toast(`${out} ↔ ${inn}`); render();}
    else if(act==='do-sub-remove'){const out=state.modal.out; const team=state.modal.team; if(!out) return; state.teams[team]=(state.teams[team]||[]).filter(n=>n!==out); const wait=waitingTeams()[0]; if(wait) state.teams[wait].push(out); state.modal=null; toast(`${out} 코트 아웃`); render();}
    else if(act==='go-step'){const s=el.dataset.screen; if(!FLOW.includes(s)&&s!=='edit') return; stopTimer(); go(s);} else if(act==='go') go(el.dataset.screen);
    else if(act==='save-new') saveSession(true);
    else if(act==='reset-new') softNewSession(true);
    else if(act==='save-edit'){document.querySelectorAll('tr[data-edit-name]').forEach(row=>{const n=row.dataset.editName; const s=ensureStat(n); row.querySelectorAll('input[data-f]').forEach(inp=>{s[inp.dataset.f]=Math.max(0,Number(inp.value)||0);});}); toast('수정 반영'); go('results');}
  };});
  document.querySelectorAll('tr[data-edit-name] input[data-f]').forEach(inp=>{inp.oninput=()=>{const row=inp.closest('tr'); const tmp={goal:0,assist:0,defense:0,save:0}; row.querySelectorAll('input[data-f]').forEach(el=>{tmp[el.dataset.f]=Math.max(0,Number(el.value)||0);}); const cell=row.querySelector('[data-mp]'); if(cell) cell.textContent=mpOf(tmp);};});
}

function render(){renderSteps(); const map={attendance:renderAttendance,coach:renderCoach,draft:renderDraft,lineup:renderLineup,matchSelect:renderMatchSelect,match:renderMatch,results:renderResults,edit:renderEdit}; document.getElementById('main').innerHTML=(map[state.screen]||renderAttendance)(); bind();}
(function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get('embed')==='1'){ document.body.style.padding='0'; document.body.style.background='#fff'; const phone=document.getElementById('phone'); if(phone){ phone.style.borderRadius='0'; phone.style.border='none'; phone.style.boxShadow='none'; phone.style.minHeight='100dvh'; phone.style.maxWidth='100%'; } }
  if(q.get('nov7')==='1') loadNov7(q.get('embed')==='1');
  else if(q.get('demo')) loadDemo(q.get('demo'));
  else render();
})();
</script>
