<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>JMFC 세션 · 참석→결과</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f0f0f2; --card:#fff; --text:#18181b; --muted:#52525b;
      --border:#e4e4e7; --border-strong:#a1a1aa;
      --red:#dc2626; --blue:#2563eb; --black:#27272a;
      --yellow:#fde047; --yellow-text:#f59e0b;
      --gold:#c9a227; --gold-light:#f5e6b8; --neon:#a3e635;
      --green:#16a34a; --primary:#2563eb; --sub:#7c3aed; --sub-dark:#5b21b6;
      --safe-b:env(safe-area-inset-bottom,0px);
      --font-stat:0.9rem; --font-name:0.98rem; --touch-min:48px; --font-btn:0.94rem;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;justify-content:center;padding:12px 10px calc(16px + var(--safe-b))}
    .phone{width:100%;max-width:420px;background:var(--card);border-radius:24px;border:1.5px solid var(--border-strong);box-shadow:0 16px 48px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;min-height:min(100dvh - 24px,920px);position:relative}
    .jmfc-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid #c4c4c8;background:#fff;flex-shrink:0}
    .jmfc-bar img.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
    .jmfc-brand strong{display:block;font-family:Cinzel,Georgia,serif;font-size:0.82rem;font-weight:900;letter-spacing:0.06em}
    .jmfc-brand span{display:block;font-size:0.68rem;color:var(--muted);font-weight:600;margin-top:1px}
    .steps{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--border);background:#fafafa;flex-shrink:0}
    .steps span{flex:0 0 auto;padding:4px 8px;border-radius:999px;font-size:0.65rem;font-weight:800;color:var(--muted);background:#fff;border:1px solid var(--border)}
    .steps span.on{background:var(--primary);color:#fff;border-color:var(--primary)}
    .steps span.done{color:var(--green);border-color:#86efac;background:#f0fdf4}
    .body{padding:12px 14px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
    h2{font-size:1.1rem;font-weight:900;margin-bottom:8px}
    .sub{font-size:0.78rem;color:var(--muted);margin-bottom:10px;line-height:1.45}
    .field{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--border);padding:8px 12px;font:inherit;font-weight:700;margin-bottom:10px;background:#fff}
    .label-sm{display:block;font-size:0.78rem;font-weight:700;color:var(--muted);margin-bottom:4px}
    .seg{display:flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
    .seg button{flex:1;min-height:44px;border:none;background:#fafafa;font-weight:800;font-size:0.85rem;font-family:inherit;color:var(--muted);cursor:pointer}
    .seg button.on{background:var(--primary);color:#fff}
    .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .mini{padding:6px 10px;border-radius:8px;border:1.5px solid var(--border);background:#f4f4f5;font-size:0.75rem;font-weight:700;font-family:inherit;cursor:pointer}
    .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .chip{min-height:52px;border-radius:12px;border:1.5px solid var(--border);background:#fafafa;font-weight:800;font-size:var(--font-name);font-family:inherit;color:var(--text);cursor:pointer;padding:6px 4px;line-height:1.2}
    .chip .role{display:block;font-size:0.62rem;color:var(--muted);font-weight:700;margin-top:2px}
    .chip.on{border-color:var(--green);background:#f0fdf4;color:#166534}
    .chip.off{opacity:.55}
    .chip.merc{border-style:dashed}
    .coach-slots{display:grid;gap:8px;margin-bottom:10px}
    .coach-slots.m2{grid-template-columns:1fr 1fr}
    .coach-slots.m3,.coach-slots.m4{grid-template-columns:1fr 1fr}
    .cslot{min-height:70px;border-radius:12px;border:2px dashed var(--border-strong);padding:10px;text-align:center;font-size:0.72rem;font-weight:800;color:var(--muted);background:#fafafa;cursor:pointer}
    .cslot.active{border-style:solid;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18);background:#eff6ff}
    .cslot.filled{border-style:solid;background:#fff;color:var(--text)}
    .cslot .slot-name{display:block;font-size:0.88rem;font-weight:900;margin-top:4px}
    .section-card{border:1.5px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:12px}
    .section-card h3{font-size:0.85rem;font-weight:900;margin-bottom:8px}
    .draft-row{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;margin-bottom:8px}
    .draft-row .dot{width:36px;height:36px;border-radius:10px;border:2px solid var(--border)}
    .draft-row .dot.RED{background:#fecaca;border-color:var(--red)}
    .draft-row .dot.BLUE{background:#bfdbfe;border-color:var(--blue)}
    .draft-row .dot.YELLOW{background:#fef08a;border-color:var(--yellow)}
    .draft-row .dot.BLACK{background:#d4d4d8;border-color:#52525b}
    .draft-row select,.team-pick-sel{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--border);padding:8px 10px;font:inherit;font-weight:800;background:#fff}
    .team-cards{display:flex;flex-direction:column;gap:14px;margin:14px 0}
    .team-stat-card{padding:16px;border-radius:14px;border:1.5px solid var(--border);background:#fafafa;min-height:110px}
    .team-stat-card.RED{border-left:5px solid var(--red)}
    .team-stat-card.BLUE{border-left:5px solid var(--blue)}
    .team-stat-card.YELLOW{border-left:5px solid var(--yellow);background:linear-gradient(90deg,#fffbeb 0%,#fafafa 40%)}
    .team-stat-card.BLACK{border-left:5px solid #52525b}
    .team-stat-card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
    .team-stat-card .head h4{font-size:0.95rem;font-weight:900}
    .team-stat-card .head .val{font-size:1.05rem;font-weight:900;text-align:right;line-height:1.25}
    .team-stat-card .meta{font-size:0.8rem;font-weight:800;color:var(--muted);margin-bottom:8px}
    .team-stat-card .names{font-size:var(--font-name);font-weight:700;line-height:1.55}
    .team-pick{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:12px;border:2px solid var(--border);background:#fafafa;font-weight:900;font-size:1rem;margin-bottom:10px;cursor:pointer;font-family:inherit;width:100%;text-align:left}
    .team-pick.picked{background:#fff}
    .team-pick.RED.picked{border-color:var(--red);background:#fef2f2}
    .team-pick.BLUE.picked{border-color:var(--blue);background:#eff6ff}
    .team-pick.YELLOW.picked{border-color:var(--yellow);background:#fffbeb}
    .team-pick.BLACK.picked{border-color:#52525b;background:#f4f4f5}
    .flow-note{font-size:0.72rem;color:var(--blue);font-weight:700;padding:8px;background:#eff6ff;border-radius:8px;border:1px solid #bfdbfe;margin-bottom:10px;line-height:1.45}
    .score-big{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:14px;border-radius:14px;border:1.5px solid var(--border);margin-bottom:10px;text-align:center;font-weight:900}
    .score-big .sep{font-size:1.35rem}
    .score-big .side{font-size:0.85rem}
    .score-big .pwr{display:block;font-size:0.72rem;font-weight:700;color:var(--muted);margin-top:4px}
    .ctrl-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
    .timer-box{font-family:ui-monospace,monospace;font-size:1.2rem;font-weight:900;padding:8px 16px;border-radius:12px;background:#fafafa;border:1.5px solid var(--border);min-width:88px;text-align:center}
    .btn-sm{min-height:40px;padding:8px 12px;border-radius:10px;border:none;font-size:0.78rem;font-weight:800;font-family:inherit;color:#fff;cursor:pointer}
    .btn-sm.gray{background:#71717a}.btn-sm.blue{background:var(--blue)}
    .tabs{display:flex;justify-content:space-around;gap:8px;margin-bottom:12px;border-bottom:1.5px solid var(--border);padding:0 4px}
    .tabs button{flex:1;padding:10px 8px;font-size:0.78rem;font-weight:800;color:var(--muted);border:none;background:transparent;border-bottom:3px solid transparent;margin-bottom:-1.5px;font-family:inherit;cursor:pointer}
    .tabs button.on{color:var(--text);border-bottom-color:var(--primary)}
    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .lineup-col{border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06)}
    .lineup-col .team-head{padding:10px 8px;text-align:center;font-family:Cinzel,Georgia,serif;font-size:0.9rem;font-weight:900;letter-spacing:0.1em;color:#fff}
    .lineup-col.team-RED .team-head{background:linear-gradient(135deg,#b91c1c,#dc2626)}
    .lineup-col.team-BLUE .team-head{background:linear-gradient(135deg,#1d4ed8,#2563eb)}
    .lineup-col.team-YELLOW .team-head{background:linear-gradient(135deg,#eab308,#facc15);color:#422006}
    .lineup-col.team-BLACK .team-head{background:linear-gradient(135deg,#27272a,#52525b)}
    .lineup-col .roster{padding:8px 6px 10px}
    .prow{margin-bottom:6px}
    .prow button{width:100%;border:none;font-family:inherit;border-radius:10px;text-align:left;padding:11px 10px;font-size:1.02rem;font-weight:900;background:#f8fafc;border:1.5px solid #e4e4e7;min-height:46px;cursor:pointer}
    .lineup-col.team-RED .prow button{border-left:3px solid var(--red)}
    .lineup-col.team-BLUE .prow button{border-left:3px solid var(--blue)}
    .lineup-col.team-YELLOW .prow button{border-left:3px solid var(--yellow)}
    .lineup-col.team-BLACK .prow button{border-left:3px solid #52525b}
    .prow button.tap{background:#eff6ff;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
    .prow .cap{font-size:0.62rem;font-weight:800;margin-right:4px;background:#18181b;padding:2px 5px;border-radius:4px;color:var(--neon)}
    .btn-sub{width:calc(100% - 12px);margin:8px 6px 10px;min-height:var(--touch-min);padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--sub),var(--sub-dark));color:#fff;font-weight:900;font-size:var(--font-btn);font-family:inherit;cursor:pointer}
    .act2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 0}
    .act2 button{padding:12px;min-height:var(--touch-min);border:none;border-radius:12px;font-weight:800;font-size:var(--font-btn);font-family:inherit;color:#fff;cursor:pointer}
    .act2 .u{background:#71717a}.act2 .e{background:var(--primary)}
    .btn{width:100%;min-height:48px;border:none;border-radius:12px;font-weight:900;font-size:0.94rem;font-family:inherit;cursor:pointer}
    .btn-cta{background:var(--primary);color:#fff}
    .btn-green{background:var(--green);color:#fff}
    .btn-danger{background:#991b1b;color:#fff}
    .btn-sec{background:#fafafa;color:var(--muted);border:1.5px solid var(--border);font-weight:800}
    .btn[disabled]{opacity:.45;cursor:not-allowed}
    .result-btns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
    .nav-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .mvp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .result-hero{padding:12px 8px;border-radius:16px;background:linear-gradient(145deg,#0c0c0e 0%,#1a1a22 55%,#121218 100%);border:1.5px solid var(--gold)}
    .eyebrow{font-family:Cinzel,Georgia,serif;font-size:0.58rem;font-weight:900;letter-spacing:0.1em;color:var(--gold-light);text-align:center}
    .mvp-names{text-align:center;font-size:1.05rem;font-weight:900;color:#fff;margin-top:8px}
    .mp-plain{text-align:center;margin-top:6px;color:var(--gold-light);font-size:0.72rem;font-weight:800;line-height:1.4}
    .award-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .award{padding:10px;border-radius:12px;background:linear-gradient(160deg,#fafafa,#f4f4f5);border:1.5px solid var(--border);font-size:0.78rem;font-weight:700}
    .award b{display:block;font-size:0.68rem;color:#57534e;margin-bottom:4px;font-weight:800}
    .result-card{background:#fff;border-radius:14px;padding:12px;border:1.5px solid var(--border);margin-bottom:10px}
    .team-RED{border-left:4px solid var(--red)}.team-BLUE{border-left:4px solid var(--blue)}.team-YELLOW{border-left:4px solid var(--yellow)}.team-BLACK{border-left:4px solid #52525b}
    .t-RED{color:var(--red)}.t-BLUE{color:var(--blue)}.t-YELLOW{color:var(--yellow-text)}.t-BLACK{color:var(--black)}
    .team-title{font-weight:900;margin-bottom:6px;font-size:0.92rem}
    table.data{width:100%;border-collapse:collapse;font-size:var(--font-stat)}
    table.data th,table.data td{border-bottom:1px solid var(--border);padding:8px 2px;text-align:center;white-space:nowrap}
    table.data th{color:var(--muted);font-weight:800;font-size:0.7rem}
    table.data td:first-child,table.data th:first-child{text-align:left;padding-left:4px;font-size:var(--font-name);font-weight:800}
    table.data .mp{font-variant-numeric:tabular-nums;font-weight:900}
    table.data td{font-weight:700}
    .hint{font-size:0.7rem;color:var(--muted);text-align:center;margin:8px 0 4px;line-height:1.45}
    .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;font-size:0.85rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
    .toast.show{opacity:1}
    .modal-overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-card{width:100%;max-width:300px;background:#fff;border-radius:16px;padding:16px;border:1.5px solid var(--border-strong);box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .modal-card h3{font-size:1.05rem;font-weight:900;text-align:center;margin-bottom:8px}
    .modal-card .msub{font-size:0.8rem;color:var(--muted);text-align:center;margin-bottom:12px}
    .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .modal-btns button{min-height:52px;border:none;border-radius:10px;font-weight:900;font-size:0.9rem;font-family:inherit;cursor:pointer}
    .modal-btns .goal,.modal-btns .def,.modal-btns .save,.modal-btns .assist{background:#18181b;color:var(--neon)}
    .modal-btns .cancel{grid-column:1/-1;background:#f4f4f5;color:var(--muted);border:1.5px solid var(--border);min-height:44px}
    .assist-picks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .assist-picks button{padding:10px 16px;border-radius:999px;border:2px solid var(--border-strong);background:#fafafa;font-weight:800;font-family:inherit;cursor:pointer}
    .assist-picks button.on{border-color:var(--green);background:#f0fdf4;color:#166534}
    .rank-mini{font-size:0.85rem;font-weight:700;line-height:1.6}
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="jmfc-bar">
      <img class="logo" src="../assets/jmfc-logo.png" alt="JMFC" />
      <div class="jmfc-brand"><strong>JMFC FOOTBALL</strong><span id="bar-sub">참석 조사 · 동작판</span></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="body" id="main"></div>
  </div>
  <div class="toast" id="toast"></div>
<script>

function todayStr(){const d=new Date();const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function emptyTeams(){return {RED:[],BLUE:[],YELLOW:[],BLACK:[]};}
function emptyTeamStats(){return Object.fromEntries(TEAM_ALL.map(t=>[t,{matchesPlayed:0,wins:0,draws:0,losses:0,goalsFor:0,goalsAgainst:0}]));}
function personalScore(n){const p=byName[n];if(!p||!(p.ccpPerGame>0))return 0;return (p.ccpPerGame/maxCcpG)*100;}
function calcTeamPower(names){const list=(names||[]).filter(n=>byName[n]);if(!list.length)return 0;return Math.round(Math.min(100,Math.max(0,list.reduce((a,n)=>a+personalScore(n),0)/list.length)));}
function calcTeamWinRate(names){const vals=(names||[]).map(n=>byName[n]).filter(p=>p&&!p.isMercenary&&p.winRatePct>0).map(p=>p.winRatePct);if(!vals.length)return '-';return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+'%';}
function mpOf(s){return (s.goal||0)*2+(s.assist||0)*2+(s.defense||0)+(s.save||0);}
function atkOf(s){return (s.goal||0)*2+(s.assist||0)*2;}
function defOf(s){return (s.defense||0)+(s.save||0);}

  } else if(screen==='coach'){

    teamNames().forEach(t=>{ if(state.coaches[t]) state.teams[t].push(state.coaches[t]); });

    const pool=remainingPool();
    [0,1,2,3].forEach((i)=>{ if(state.draftSlots[i]&&pool[i]) state.draftSlots[i].name=pool[i]; });

function getSnakeSeed(){return [...teamNames()];}
function snakeTeamAt(i){const names=getSnakeSeed();const n=names.length;const round=Math.floor(i/n);const pos=i%n;return round%2===0?names[pos]:names[n-1-pos];}
function remainingPool(){const taken=new Set(TEAM_ALL.flatMap(t=>state.teams[t]||[]));return state.attending.filter(n=>!taken.has(n));}
function rebuildSnakeSlots(){const left=remainingPool();state.draftSlots=left.map((_,i)=>({team:snakeTeamAt(i),name:null}));}
function rebuildManualSlots(){const left=remainingPool();const names=teamNames();if(!state.draftSlots.length){state.draftSlots=left.map((_,i)=>({team:names[i%names.length],name:null}));}else{while(state.draftSlots.length<left.length)state.draftSlots.push({team:names[state.draftSlots.length%names.length],name:null});state.draftSlots=state.draftSlots.slice(0,Math.max(left.length,state.draftSlots.filter(s=>s.name).length));}}
function applyDraftSlotsToTeams(){const base=emptyTeams();teamNames().forEach(t=>{const c=state.coaches[t];if(c)base[t].push(c);});state.draftSlots.forEach(s=>{if(s.name&&s.team&&!base[s.team].includes(s.name))base[s.team].push(s.name);});state.teams=base;}

function renderCoach(){const names=teamNames();const filled=names.filter(t=>state.coaches[t]).length;if(!state.coachPickTeam||!names.includes(state.coachPickTeam))state.coachPickTeam=names.find(t=>!state.coaches[t])||names[0];const picked=new Set(Object.values(state.coaches));const pool=state.attending.filter(n=>!picked.has(n));return `<h2>감독 ${names.length}명 선택</h2><p class="sub">① 팀 슬롯 탭 → ② 선수 탭 · ${filled}/${names.length}</p>
<div class="coach-slots m${names.length}">${names.map(t=>{const c=state.coaches[t];return `<div class="cslot ${c?'filled':''} ${state.coachPickTeam===t?'active':''}" data-act="pick-slot" data-team="${t}"><span class="t-${t}">TEAM ${t}</span><span class="slot-name">${c||'감독?'}</span></div>`;}).join('')}</div>
<div class="chip-grid">${pool.map(n=>{const p=byName[n]||{};return `<button class="chip" data-act="set-coach-name" data-name="${n}">${n}<span class="role">${p.position||'-'} · 점수 ${personalScore(n).toFixed(1)}</span></button>`;}).join('')||'<p class="sub">남은 선수 없음</p>'}</div>
<div class="nav-row"><button class="btn btn-sec" data-act="go" data-screen="attendance">← 이전</button><button class="btn btn-cta" data-act="to-draft" ${filled<names.length?'disabled':''}>드래프트 시작</button></div>`;}

function renderDraft(){applyDraftSlotsToTeams();const left=remainingPool();const unassigned=state.draftSlots.filter(s=>!s.name).length;const optsFor=idx=>{const used=new Set(state.draftSlots.map((s,i)=>i===idx?null:s.name).filter(Boolean));const cur=state.draftSlots[idx]?.name;return state.attending.filter(n=>!Object.values(state.coaches).includes(n)).filter(n=>!used.has(n)||n===cur);};
return `<h2>팀 나누기</h2>
<div class="section-card"><h3>팀 구성 방식</h3>
<div class="seg"><button type="button" class="${state.draftMode==='snake'?'on':''}" data-act="set-draft-mode" data-mode="snake">스네이크 방식</button><button type="button" class="${state.draftMode==='manual'?'on':''}" data-act="set-draft-mode" data-mode="manual">직접 선택</button></div>
<p class="sub" style="margin:0">${state.draftMode==='snake'?'순서: RED→BLUE→YELLOW→YELLOW→BLUE→RED… (라운드마다 역순)':'각 칸의 팀·선수를 직접 고릅니다'}</p></div>
<div class="section-card"><h3>픽 순서 · 남은 ${unassigned}칸</h3>
${state.draftSlots.map((s,i)=>`<div class="draft-row"><div class="dot ${s.team}"></div><div style="display:grid;gap:6px;grid-template-columns:${state.draftMode==='manual'?'90px 1fr':'1fr'}">${state.draftMode==='manual'?`<select data-act-change="slot-team" data-idx="${i}">${teamNames().map(t=>`<option value="${t}" ${s.team===t?'selected':''}>${t}</option>`).join('')}</select>`:''}<select data-act-change="slot-player" data-idx="${i}"><option value="">선수 선택</option>${optsFor(i).map(n=>`<option value="${n}" ${s.name===n?'selected':''}>${n}</option>`).join('')}</select></div></div>`).join('')||'<p class="sub">배정할 선수 없음</p>'}
</div>
<div class="team-cards">${teamNames().map(teamCardHtml).join('')}</div>
<div class="result-btns"><button class="btn btn-cta" data-act="to-lineup" ${left.length||unassigned?'disabled':''}>팀 구성 완료</button><button class="btn btn-sec" data-act="go" data-screen="coach">← 이전</button></div>`;}

function renderLineup(){return `<h2>${state.teamMode}팀 라인업</h2><p class="sub">${formatDateLabel(state.sessionDate)} · 팀파워·팀승률(용병 제외) 확인</p><div class="team-cards">${teamNames().map(teamCardHtml).join('')}</div><div class="result-btns"><button class="btn btn-cta" data-act="go" data-screen="matchSelect">팀 구성 확정 → 경기 선택</button><button class="btn btn-sec" data-act="go" data-screen="draft">← 이전</button></div>`;}

function renderMatchSelect(){const picks=state.playing;const opts=Array.from({length:6},(_,i)=>{const m=i+7;return `<option value="${m*60}" ${state.duration===m*60?'selected':''}>${m}분</option>`;}).join('');return `<h2>경기 선택</h2>
<div class="chip-row"><span class="mini on">Match #${state.matchCount}</span><span class="mini">완료 ${Math.max(0,state.matchCount-1)}경기</span></div>
<div class="flow-note">매 경기 후 동일 화면 · <b>${state.teamMode}팀 모두 표시</b> · 2팀만 선택</div>

${teamNames().map(t=>{const roster=state.teams[t]||[];const st=state.teamStats[t];const on=picks.includes(t);return `<button type="button" class="team-pick ${t} ${on?'picked':''}" data-act="toggle-play" data-team="${t}"><span><span class="t-${t}">TEAM ${t}</span><div style="font-size:0.75rem;font-weight:700;color:var(--muted);margin-top:4px">팀파워 ${calcTeamPower(roster)} · 승률 ${calcTeamWinRate(roster)} · 오늘 ${st.wins}승 ${st.draws}무 ${st.losses}패</div></span><span style="font-size:0.78rem;font-weight:800;color:var(--muted)">${on?'✓ 선택':'—'}</span></button>`;}).join('')}
<div class="result-btns"><button class="btn btn-cta" data-act="start-match" ${picks.length!==2?'disabled':''}>경기 시작</button><button class="btn btn-danger" data-act="go" data-screen="results">전체 세션 종료</button><div class="nav-row" style="margin:0"><button class="btn btn-sec" data-act="go" data-screen="lineup">← 이전</button><button class="btn btn-sec" disabled>다음 →</button></div></div>`;}

function matchModalHtml(){if(!state.modal)return '';if(state.modal.type==='record'){const n=state.modal.name;const t=state.modal.team;return `<div class="modal-overlay"><div class="modal-card"><h3>${n} (TEAM ${t})</h3><p class="msub">기록을 선택하세요</p><div class="modal-btns"><button class="goal" data-act="rec" data-stat="goal">득점</button><button class="assist" data-act="rec" data-stat="assist">도움</button><button class="def" data-act="rec" data-stat="defense">수비</button><button class="save" data-act="rec" data-stat="save">선방</button><button class="cancel" data-act="close-modal">취소</button></div></div></div>`;}
if(state.modal.type==='assist'){const scorer=state.modal.scorer;const team=state.modal.team;const mates=(state.teams[team]||[]).filter(n=>n!==scorer);return `<div class="modal-overlay"><div class="modal-card"><h3>${scorer} 선수 득점!</h3><p class="msub">도움을 준 선수를 선택하세요</p><div class="assist-picks">${mates.map(n=>`<button type="button" data-act="pick-assist" data-name="${n}">${n}</button>`).join('')}<button type="button" data-act="pick-assist" data-name="">없음</button></div><button class="btn btn-sec" style="margin-top:12px" data-act="close-modal">취소</button></div></div>`;}
return '';}

function renderMatch(){const [a,b]=state.playing;if(!a||!b)return `<p class="sub">경기를 선택하세요</p><button class="btn btn-cta" data-act="go" data-screen="matchSelect">경기 선택</button>`;
const tab=state.matchTab;let body='';
if(tab==='lineup'){body=`<div class="lineup-grid">${[a,b].map(t=>`<div class="lineup-col team-${t}"><div class="team-head">TEAM ${t}</div><div class="roster">${(state.teams[t]||[]).map(n=>`<div class="prow"><button type="button" class="${state.selectedPlayer===n?'tap':''}" data-act="open-record" data-name="${n}" data-team="${t}">${state.coaches[t]===n?'<span class="cap">C</span>':''}${n}</button></div>`).join('')}</div></div>`).join('')}</div>
<div class="act2"><button class="u" data-act="undo-rec">스탯 취소</button><button class="e" data-act="end-match">현재 경기 종료</button></div>`;}
else if(tab==='standings'){body=`<div class="section-card rank-mini">${teamNames().map(t=>{const s=state.teamStats[t];return `<div><b class="t-${t}">${t}</b> · ${s.wins}승 ${s.draws}무 ${s.losses}패 · 득실 ${s.goalsFor}:${s.goalsAgainst}</div>`;}).join('')}</div>`;}
else{const rows=Object.entries(state.playerStats).map(([name,s])=>({name,...s,mp:mpOf(s)})).filter(p=>((state.teams[a]||[]).includes(p.name)||(state.teams[b]||[]).includes(p.name))).sort((x,y)=>y.mp-x.mp);body=`<div class="result-card"><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.name}</td><td>${p.goal||0}</td><td>${p.assist||0}</td><td>${p.defense||0}</td><td>${p.save||0}</td><td class="mp">${p.mp}</td></tr>`).join('')||'<tr><td colspan="6">기록 없음</td></tr>'}</tbody></table></div>`;}
return `<div class="score-big"><div class="side t-${a}">TEAM ${a}<div style="font-size:1.5rem;margin-top:4px">${state.score.A}</div><span class="pwr">팀파워 ${calcTeamPower(state.teams[a])}</span></div><div class="sep">:</div><div class="side t-${b}">TEAM ${b}<div style="font-size:1.5rem;margin-top:4px">${state.score.B}</div><span class="pwr">팀파워 ${calcTeamPower(state.teams[b])}</span></div></div>
<div class="ctrl-row"><button type="button" class="btn-sm gray" data-act="reset-score">🔄 스코어리셋</button><div class="timer-box">${fmtTime(state.secondsLeft)}</div><button type="button" class="btn-sm blue" data-act="toggle-timer">${state.timerRunning?'일시정지':'시작'}</button></div>
<div class="tabs"><button type="button" class="${tab==='lineup'?'on':''}" data-act="match-tab" data-tab="lineup">라인업</button><button type="button" class="${tab==='standings'?'on':''}" data-act="match-tab" data-tab="standings">팀 순위</button><button type="button" class="${tab==='stats'?'on':''}" data-act="match-tab" data-tab="stats">개인기록</button></div>
${body}
<p class="flow-note" style="margin-top:10px">현재 경기 종료 → <b>경기 선택</b> 화면으로</p>
<button class="btn btn-danger" data-act="go" data-screen="results">🚨 전체 세션 종료</button>
<div class="nav-row"><button class="btn btn-sec" data-act="go" data-screen="matchSelect">← 이전</button><button class="btn btn-sec" disabled>다음 →</button></div>
${matchModalHtml()}`;
}

function standingsRows(){const active=teamNames();const ranked=active.map(t=>{const s=state.teamStats[t];const gd=s.goalsFor-s.goalsAgainst;const pts=s.wins*3+s.draws;const wr=(s.wins+s.losses)>0?Math.round(s.wins/(s.wins+s.losses)*100)+'%':'-';return {t,...s,gd,pts,wr};}).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.goalsFor-a.goalsFor);const rankMap={};ranked.forEach((r,i)=>rankMap[r.t]=i+1);return activeStandingsOrder().map(t=>{const s=state.teamStats[t];const gd=s.goalsFor-s.goalsAgainst;const pts=s.wins*3+s.draws;const wr=(s.wins+s.losses)>0?Math.round(s.wins/(s.wins+s.losses)*100)+'%':'-';return {t,rank:rankMap[t],...s,gd,pts,wr};});}
function topList(kind){return Object.entries(state.playerStats).map(([name,s])=>{let v=0;if(kind==='atk')v=atkOf(s);else if(kind==='dfn')v=defOf(s);else v=s[kind]||0;return {name,v,...s};}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v||a.name.localeCompare(b.name,'ko'));}
function teamPlayerTable(t){const names=state.teams[t]||[];const list=names.map(n=>{const s=ensureStat(n,t);return {name:n,...s,mp:mpOf(s)};}).sort((a,b)=>b.mp-a.mp||a.name.localeCompare(b.name,'ko'));return `<div class="result-card team-${t}"><div class="team-title t-${t}">TEAM ${t}</div><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${list.map(p=>`<tr><td>${p.name}</td><td>${p.goal||0}</td><td>${p.assist||0}</td><td>${p.defense||0}</td><td>${p.save||0}</td><td class="mp">${p.mp}</td></tr>`).join('')||'<tr><td colspan="6">없음</td></tr>'}</tbody></table></div>`;}
function renderResults(){const atk=topList('atk'),dfn=topList('dfn'),atkM=atk[0],defM=dfn[0],rows=standingsRows();return `<h2>오늘의 경기 결과</h2><p class="sub">${formatDateLabel(state.sessionDate)} · ${state.teamMode}팀</p>
<div class="mvp-row"><div class="result-hero"><div class="eyebrow">ATTACK MVP</div><div class="mvp-names">${atkM?atk.filter(x=>x.v===atkM.v).map(x=>x.name).join(' · '):'-'}</div><div class="mp-plain">${atkM?`공격P ${atkM.v}<br>${atkM.goal||0}득점${atkM.assist||0}도움`:'-'}</div></div><div class="result-hero"><div class="eyebrow">DEFENSE MVP</div><div class="mvp-names">${defM?dfn.filter(x=>x.v===defM.v).map(x=>x.name).join(' · '):'-'}</div><div class="mp-plain">${defM?`수비P ${defM.v}<br>${defM.defense||0}수비${defM.save||0}선방`:'-'}</div></div></div>
<div class="award-g"><div class="award"><b>TOP SCORER</b>${(()=>{const t=topList('goal');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div><div class="award"><b>TOP ASSIST</b>${(()=>{const t=topList('assist');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div><div class="award"><b>TOP DEFENSE</b>${(()=>{const t=topList('defense');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div><div class="award"><b>TOP SAVE</b>${(()=>{const t=topList('save');return t[0]?`${t.filter(x=>x.v===t[0].v).map(x=>x.name).join(' · ')} ${t[0].v}`:'-';})()}</div></div>
<div class="result-card" style="overflow-x:auto"><table class="data"><thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>득실</th><th>승률</th><th>승점</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank}</td><td class="t-${r.t}" style="font-weight:900">${r.t}</td><td>${r.matchesPlayed}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.goalsFor}</td><td>${r.goalsAgainst}</td><td>${r.gd>0?'+':''}${r.gd}</td><td>${r.wr}</td><td>${r.pts}</td></tr>`).join('')}</tbody></table></div>
${activeDetailOrder().map(teamPlayerTable).join('')}
<p class="hint">공격P=득점×2+도움×2 · 수비P=수비+선방 · MP=공격P+수비P</p>
<div class="result-btns"><button class="btn btn-green" data-act="go" data-screen="edit">기록 수정하기</button><button class="btn btn-cta" data-act="save-new">기록 저장 & NEW 세션</button><button class="btn btn-danger" data-act="reset-new">기록 리셋 & NEW 세션</button></div>`;}
function renderEdit(){return `<h2>기록 수정</h2><p class="sub">숫자 변경 시 MP·MVP 재계산</p>${activeDetailOrder().map(t=>{const names=state.teams[t]||[];return `<div class="result-card team-${t}"><div class="team-title t-${t}">TEAM ${t}</div><table class="data"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead><tbody>${names.map(n=>{const s=ensureStat(n,t);return `<tr data-edit-name="${n}"><td>${n}</td><td><input type="number" min="0" data-f="goal" value="${s.goal||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="assist" value="${s.assist||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="defense" value="${s.defense||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td><input type="number" min="0" data-f="save" value="${s.save||0}" style="width:2.6rem;text-align:center;font-weight:800;border:1px solid #d4d4d8;border-radius:8px;padding:4px 0" /></td><td class="mp" data-mp>${mpOf(s)}</td></tr>`;}).join('')}</tbody></table></div>`;}).join('')}<div class="result-btns"><button class="btn btn-cta" data-act="save-edit">수정 완료 → 결과로</button></div>`;}

function stopTimer(){state.timerRunning=false;if(timerId){clearInterval(timerId);timerId=null;}}
function toggleTimer(){if(state.timerRunning){stopTimer();render();return;}state.timerRunning=true;timerId=setInterval(()=>{if(state.secondsLeft<=0){stopTimer();toast('경기 시간 종료');render();return;}state.secondsLeft--;const box=document.querySelector('.timer-box');if(box)box.textContent=fmtTime(state.secondsLeft);},1000);render();}
function endMatch(){stopTimer();const [a,b]=state.playing;const sa=state.score.A,sb=state.score.B;const A=state.teamStats[a],B=state.teamStats[b];A.matchesPlayed++;B.matchesPlayed++;A.goalsFor+=sa;A.goalsAgainst+=sb;B.goalsFor+=sb;B.goalsAgainst+=sa;let resA='draw';if(sa>sb){A.wins++;B.losses++;resA='win';}else if(sa<sb){B.wins++;A.losses++;resA='loss';}else{A.draws++;B.draws++;}(state.teams[a]||[]).forEach(n=>{const s=ensureStat(n,a);if(resA==='win')s.wins++;else if(resA==='loss')s.losses++;else s.draws++;});(state.teams[b]||[]).forEach(n=>{const s=ensureStat(n,b);if(resA==='win')s.losses++;else if(resA==='loss')s.wins++;else s.draws++;});state.matchCount++;state.playing=[];state.score={A:0,B:0};state.selectedPlayer=null;state.recordStack=[];state.modal=null;toast('경기 종료 · 다음 경기 선택');go('matchSelect');}

function bind(){const dateEl=document.getElementById('session-date');if(dateEl)dateEl.onchange=()=>{state.sessionDate=dateEl.value||todayStr();};
const dur=document.getElementById('duration');if(dur)dur.onchange=()=>{state.duration=Number(dur.value);state.secondsLeft=state.duration;};
document.querySelectorAll('[data-act-change]').forEach(el=>{el.onchange=()=>{const act=el.dataset.actChange;const idx=Number(el.dataset.idx);if(act==='slot-team'){state.draftSlots[idx].team=el.value;applyDraftSlotsToTeams();render();}else if(act==='slot-player'){state.draftSlots[idx].name=el.value||null;applyDraftSlotsToTeams();render();};};});
document.querySelectorAll('[data-act]').forEach(el=>{el.onclick=()=>{const act=el.dataset.act;
if(act==='toggle-att'){const n=el.dataset.name;if(state.attending.includes(n))state.attending=state.attending.filter(x=>x!==n);else state.attending.push(n);render();}
else if(act==='set-mode'){state.teamMode=Number(el.dataset.mode);Object.keys(state.coaches).forEach(t=>{if(!teamNames().includes(t))delete state.coaches[t];});render();}
else if(act==='load-last-att')loadLastAttending();
else if(act==='select-all'){state.attending=PLAYERS.filter(p=>!p.isMercenary).map(p=>p.name);render();}
else if(act==='clear-att'){state.attending=[];render();}
else if(act==='to-coach'){if(state.attending.length<state.teamMode)return toast('인원 부족');saveLastAttending(state.attending);state.coachPickTeam=teamNames()[0];go('coach');}
else if(act==='pick-slot'){state.coachPickTeam=el.dataset.team;render();}
else if(act==='set-coach-name'){const n=el.dataset.name;const t=state.coachPickTeam||teamNames().find(x=>!state.coaches[x]);if(!t)return;Object.keys(state.coaches).forEach(k=>{if(state.coaches[k]===n)delete state.coaches[k];});state.coaches[t]=n;state.coachPickTeam=teamNames().find(x=>!state.coaches[x])||t;render();}
else if(act==='to-draft'){if(!teamNames().every(t=>state.coaches[t]))return toast('감독을 모두 지정하세요');state.teams=emptyTeams();teamNames().forEach(t=>{if(state.coaches[t])state.teams[t].push(state.coaches[t]);});state.draftMode='snake';rebuildSnakeSlots();go('draft');}
else if(act==='set-draft-mode'){state.draftMode=el.dataset.mode;if(state.draftMode==='snake')rebuildSnakeSlots();else{state.draftSlots=state.draftSlots.map((s,i)=>({team:s.team||teamNames()[i%teamNames().length],name:s.name}));if(!state.draftSlots.length)rebuildManualSlots();}render();}
else if(act==='to-lineup'){applyDraftSlotsToTeams();if(remainingPool().length)return toast('선수를 모두 배정하세요');Object.entries(state.teams).forEach(([t,names])=>names.forEach(n=>ensureStat(n,t)));go('lineup');}
else if(act==='toggle-play'){const t=el.dataset.team;if(state.playing.includes(t))state.playing=state.playing.filter(x=>x!==t);else if(state.playing.length<2)state.playing.push(t);else toast('2팀만 선택');render();}
else if(act==='start-match'){if(state.playing.length!==2)return toast('2팀을 선택하세요');const d=document.getElementById('duration');if(d)state.duration=Number(d.value);state.secondsLeft=state.duration;state.score={A:0,B:0};state.selectedPlayer=null;state.recordStack=[];state.matchTab='lineup';stopTimer();go('match');}
else if(act==='match-tab'){state.matchTab=el.dataset.tab;render();}
else if(act==='toggle-timer')toggleTimer();
else if(act==='reset-score'){state.score={A:0,B:0};toast('스코어 리셋');render();}
else if(act==='open-record'){state.selectedPlayer=el.dataset.name;state.modal={type:'record',name:el.dataset.name,team:el.dataset.team};render();}
else if(act==='close-modal'){state.modal=null;render();}
else if(act==='rec'){const stat=el.dataset.stat;const n=state.modal.name;const t=state.modal.team;const s=ensureStat(n,t);s[stat]=(s[stat]||0)+1;state.recordStack.push({name:n,stat,team:t});if(stat==='goal'){const [a,b]=state.playing;if(t===a)state.score.A++;if(t===b)state.score.B++;state.modal={type:'assist',scorer:n,team:t};}else{state.modal=null;toast(`${n} ${stat}+1`);}render();}
else if(act==='pick-assist'){const an=el.dataset.name;if(an){const s=ensureStat(an,state.modal.team);s.assist=(s.assist||0)+1;state.recordStack.push({name:an,stat:'assist',team:state.modal.team});toast(`${an} 도움+1`);}state.modal=null;render();}
else if(act==='undo-rec'){const last=state.recordStack.pop();if(!last)return toast('취소할 기록 없음');const s=ensureStat(last.name,last.team);s[last.stat]=Math.max(0,(s[last.stat]||0)-1);if(last.stat==='goal'){const [a,b]=state.playing;if(last.team===a)state.score.A=Math.max(0,state.score.A-1);if(last.team===b)state.score.B=Math.max(0,state.score.B-1);}toast('스탯 취소');render();}
else if(act==='end-match')endMatch();
else if(act==='go')go(el.dataset.screen);
else if(act==='save-new')saveSession(true);
else if(act==='reset-new')softNewSession(true);
else if(act==='save-edit'){document.querySelectorAll('tr[data-edit-name]').forEach(row=>{const n=row.dataset.editName;const s=ensureStat(n);row.querySelectorAll('input[data-f]').forEach(inp=>{s[inp.dataset.f]=Math.max(0,Number(inp.value)||0);});});toast('수정 반영');go('results');}
};});
document.querySelectorAll('tr[data-edit-name] input[data-f]').forEach(inp=>{inp.oninput=()=>{const row=inp.closest('tr');const tmp={goal:0,assist:0,defense:0,save:0};row.querySelectorAll('input[data-f]').forEach(el=>{tmp[el.dataset.f]=Math.max(0,Number(el.value)||0);});const cell=row.querySelector('[data-mp]');if(cell)cell.textContent=mpOf(tmp);};});}

function render(){renderSteps();const map={attendance:renderAttendance,coach:renderCoach,draft:renderDraft,lineup:renderLineup,matchSelect:renderMatchSelect,match:renderMatch,results:renderResults,edit:renderEdit};document.getElementById('main').innerHTML=(map[state.screen]||renderAttendance)();bind();}
(function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get('embed')==='1'){ document.body.style.padding='0'; document.body.style.background='#fff'; const phone=document.getElementById('phone'); if(phone){ phone.style.borderRadius='0'; phone.style.border='none'; phone.style.boxShadow='none'; phone.style.minHeight='100dvh'; phone.style.maxWidth='100%'; } }
  if(q.get('nov7')==='1') loadNov7(q.get('embed')==='1');
  else if(q.get('demo')) loadDemo(q.get('demo'));
  else render();
})();
</script>
</body>
