<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>JMFC 실험실 · 팀파워 풀플로우</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --text: #18181b; --muted: #52525b;
      --red: #dc2626; --blue: #2563eb; --yellow: #ca8a04; --black: #18181b;
      --border: #d4d4d8; --ok: #16a34a; --primary: #2563eb; --cta: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .top { max-width: 720px; margin: 0 auto; padding: 0.85rem 1rem 0; }
    .top h1 { font-size: 1.15rem; }
    .top .meta { font-size: 0.78rem; color: var(--muted); line-height: 1.45; margin-top: 0.25rem; }
    .formula {
      max-width: 720px; margin: 0.65rem auto 0; padding: 0.65rem 0.85rem;
      background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px;
      font-size: 0.75rem; line-height: 1.5; color: #9a3412;
    }
    .formula code { background: #ffedd5; padding: 0 0.25rem; border-radius: 3px; }
    .steps { max-width: 720px; margin: 0.75rem auto 0; padding: 0 1rem; display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .steps span { font-size: 0.65rem; font-weight: 800; padding: 0.2rem 0.45rem; border-radius: 999px; background: #e4e4e7; color: #52525b; }
    .steps span.on { background: var(--primary); color: #fff; }
    .steps span.done { background: #bbf7d0; color: #166534; }
    #app { max-width: 720px; margin: 0.75rem auto 2rem; padding: 0 1rem; }
    .screen { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; }
    h2 { font-size: 1.25rem; font-weight: 900; margin-bottom: 0.35rem; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.85rem; line-height: 1.45; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
    label { font-size: 0.85rem; font-weight: 700; }
    select, button {
      font: inherit; border: 1px solid var(--border); background: #fff;
      border-radius: 10px; padding: 0.55rem 0.75rem; cursor: pointer;
    }
    button.cta { width: 100%; background: var(--cta); color: #fff; border-color: var(--cta); font-weight: 900; font-size: 1rem; padding: 0.85rem; margin-top: 0.75rem; }
    button.sec { background: #f4f4f5; width: 100%; font-weight: 700; margin-top: 0.45rem; }
    button.danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; width: 100%; font-weight: 800; margin-top: 0.45rem; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .chip { background: #eef2ff; color: #3730a3; font-size: 0.75rem; font-weight: 800; padding: 0.25rem 0.55rem; border-radius: 999px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

    /* 통일 선수 카드: 이름 + 포지션 · 점수 · 승률 (한 줄) */
    .pcard {
      border: 2px solid var(--border); border-radius: 12px; padding: 0.55rem 0.65rem;
      text-align: left; background: #fff; cursor: pointer;
      display: flex; align-items: baseline; gap: 0.45rem; flex-wrap: wrap;
    }
    .pcard.on { outline: 2px solid var(--primary); background: #eff6ff; border-color: #93c5fd; }
    .pcard.merc { border-style: dashed; color: #71717a; }
    .pcard .nm { font-weight: 900; font-size: 0.92rem; color: var(--text); }
    .pcard .meta { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
    .pcard.sm { padding: 0.4rem 0.5rem; }
    .pcard.sm .nm { font-size: 0.82rem; }
    .pcard.static { cursor: default; }

    .coach-slots { display: grid; gap: 0.45rem; margin-bottom: 0.75rem; }
    .coach-slots.m2 { grid-template-columns: 1fr 1fr; }
    .coach-slots.m3 { grid-template-columns: 1fr 1fr 1fr; }
    .coach-slots.m4 { grid-template-columns: 1fr 1fr; }
    .cslot {
      border: 2px dashed var(--border); border-radius: 12px; padding: 0.7rem; text-align: center;
      font-size: 0.75rem; font-weight: 800; color: var(--muted); cursor: pointer; min-height: 64px;
    }
    .cslot.active { box-shadow: 0 0 0 3px rgba(37,99,235,0.25); border-color: var(--primary); }
    .cslot.filled { border-style: solid; color: var(--text); }
    .cslot.RED.filled { border-color: var(--red); background: #fef2f2; }
    .cslot.BLUE.filled { border-color: var(--blue); background: #eff6ff; }
    .cslot.YELLOW.filled { border-color: #eab308; background: #fffbeb; }
    .cslot.BLACK.filled { border-color: #18181b; background: #f4f4f5; }
    .tname-RED { color: var(--red); } .tname-BLUE { color: var(--blue); }
    .tname-YELLOW { color: var(--yellow); } .tname-BLACK { color: var(--black); }

    .team-card {
      border: 3px solid var(--border); border-radius: 14px; padding: 0.75rem; margin-bottom: 0.65rem;
      background: #fff;
    }
    .team-card.RED { border-color: #ef4444; background: #fff7f7; }
    .team-card.BLUE { border-color: #3b82f6; background: #f5f9ff; }
    .team-card.YELLOW { border-color: #eab308; background: #fffbeb; }
    .team-card.BLACK { border-color: #52525b; background: #fafafa; }
    .team-card.pickable { cursor: pointer; }
    .team-card.selected { box-shadow: 0 0 0 3px rgba(37,99,235,0.35); }
    .team-card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .team-card .head h3 { font-size: 1rem; }
    .team-card .val { font-weight: 900; font-size: 0.95rem; }
    .team-card .sub { font-size: 0.78rem; color: var(--muted); margin: 0.25rem 0 0.55rem; line-height: 1.4; }
    .team-card .plist { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; }
    @media (max-width: 520px) { .team-card .plist { grid-template-columns: 1fr; } }

    .live-banner {
      background: #18181b; color: #fff; border-radius: 12px; padding: 0.7rem 0.85rem;
      font-weight: 800; margin-bottom: 0.65rem; font-size: 0.9rem;
    }
    .live-banner.RED { background: #991b1b; }
    .live-banner.BLUE { background: #1d4ed8; }
    .live-banner.YELLOW { background: #a16207; }
    .live-banner.BLACK { background: #27272a; }

    .scoreboard {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.5rem; align-items: center;
      text-align: center; margin: 0.75rem 0; font-weight: 900;
    }
    .scoreboard .sc { font-size: 2.4rem; }
    .tabs { display: flex; gap: 0.35rem; margin-bottom: 0.65rem; }
    .tabs button { flex: 1; font-weight: 800; background: #f4f4f5; }
    .tabs button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .lineup-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .lineup-cols .side { border: 3px solid var(--border); border-radius: 12px; padding: 0.5rem; }
    .lineup-cols .side.RED { border-color: #ef4444; background: #fff7f7; }
    .lineup-cols .side.BLUE { border-color: #3b82f6; background: #f5f9ff; }
    .match-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-top: 0.55rem; }
    .timeline { font-size: 0.78rem; margin: 0.55rem 0; max-height: 120px; overflow: auto; list-style: none; }
    .timeline li { padding: 0.3rem 0.45rem; border-radius: 8px; margin-bottom: 0.25rem; font-weight: 700; }
    .timeline li.RED { background: #fee2e2; color: #991b1b; }
    .timeline li.BLUE { background: #dbeafe; color: #1e40af; }
    .timeline li.YELLOW { background: #fef9c3; color: #854d0e; }
    .timeline li.BLACK { background: #e4e4e7; color: #27272a; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
    .modal .box { background: #fff; border-radius: 16px; padding: 1rem; width: min(420px, 100%); max-height: 90vh; overflow: auto; }
    .modal h3 { font-size: 1.1rem; margin-bottom: 0.65rem; }
    .modal .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
    .btn-goal { background: #16a34a !important; color: #fff !important; border-color: #15803d !important; font-weight: 900; }
    .btn-own { background: #dc2626 !important; color: #fff !important; border-color: #b91c1c !important; font-weight: 900; }
    .btn-def { background: #eab308 !important; color: #111 !important; border-color: #ca8a04 !important; font-weight: 900; }
    .btn-save { background: #7c3aed !important; color: #fff !important; border-color: #6d28d9 !important; font-weight: 900; }
    .btn-assist { background: #2563eb !important; color: #fff !important; border-color: #1d4ed8 !important; font-weight: 900; }
    .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: #18181b; color: #fff; padding: 0.65rem 1rem; border-radius: 10px; font-weight: 700; z-index: 60; font-size: 0.85rem; }
    table.rank { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    table.rank th, table.rank td { border-bottom: 1px solid #e4e4e7; padding: 0.35rem 0.25rem; text-align: left; }
    .status { font-size: 0.75rem; color: var(--muted); }
    .status.ok { color: var(--ok); } .status.err { color: #ea580c; }
    .nav-back { background: transparent; border: none; font-weight: 800; color: var(--muted); padding: 0.25rem 0; margin-bottom: 0.35rem; }
  </style>
</head>
<body>
  <div class="top">
    <h1>JMFC 실험실 · 풀플로우</h1>
    <p class="meta">운영 GAS 아님 · 시트 데이터로 참석→감독→드래프트→라인업→경기→결과</p>
  </div>
  <div class="formula">
    <b>팀파워</b> = 팀원 개인점수 평균 · 개인점수 = <code>(CCP/G ÷ 전선수 최고 CCP/G) × 100</code>
    · <b>승률</b> = <code>용병*</code> 제외
  </div>
  <div class="steps" id="steps"></div>
  <div class="row top" style="max-width:720px;padding:0.5rem 1rem 0;gap:0.4rem">
    <button id="btn-load" style="background:var(--primary);color:#fff;border-color:var(--primary);font-weight:800">시트 새로고침</button>
    <button id="btn-snap">스냅샷</button>
    <span class="status" id="load-status">대기</span>
  </div>
  <div id="app"></div>
  <div id="modal-root"></div>

<script>
const SHEET_ID = '1leKbnUoUy2gCO-0O-xWAa07mE7q68aXnflnhbaL2tBk';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
const TEAM_ORDER = ['RED', 'BLUE', 'YELLOW', 'BLACK'];
const STEP_DEFS = [
  ['attendance', '참석'], ['coach', '감독'], ['draft', '드래프트'],
  ['lineup', '라인업'], ['matchSelect', '경기선택'], ['match', '경기'], ['results', '결과'],
];

let players = [];
let byName = {};
let refs = { maxCcpG: 1, maxPlayerName: '-' };

const state = {
  screen: 'attendance',
  teamMode: 3,
  attending: [],
  coaches: {},
  coachPickTeam: null,
  teams: emptyTeams(),
  originalTeams: null,
  draftPool: [],
  draftTurn: 0,
  draftHistory: [],
  playing: [],
  duration: 480,
  matchCount: 1,
  score: { A: 0, B: 0 },
  timeline: [],
  recordStack: [],
  teamStats: {},
  playerStats: {},
  matchTab: 'lineup',
  timerOn: false,
  secondsLeft: 480,
  timerId: null,
  benchPool: [],
};

function emptyTeams() {
  return Object.fromEntries(TEAM_ORDER.map(t => [t, { players: [], coach: null }]));
}

function teamNames() {
  return TEAM_ORDER.slice(0, Number(state.teamMode) || 3);
}

function isMerc(name) { return String(name || '').startsWith('용병'); }

function parseWinRatePct(raw) {
  const n = Number(String(raw ?? '0').replace('%', '').trim());
  if (!Number.isFinite(n)) return 0;
  return n > 1 ? n : n * 100;
}

function normalizePlayer(p) {
  const name = String(p.name || '').trim();
  return {
    name,
    position: p.position || '',
    att: Number(p.att) || 0,
    def: Number(p.def) || 0,
    sum: Number(p.sum) || (Number(p.att) || 0) + (Number(p.def) || 0),
    winRatePct: Number(p.winRatePct) || 0,
    ccpPerGame: Number(p.ccpPerGame) || 0,
    isMercenary: p.isMercenary ?? isMerc(name),
  };
}

function rebuildRefs() {
  let maxCcpG = 0, maxPlayerName = '-';
  players.forEach(p => {
    if (p.ccpPerGame > maxCcpG) { maxCcpG = p.ccpPerGame; maxPlayerName = p.name; }
  });
  refs = { maxCcpG: maxCcpG > 0 ? maxCcpG : 1, maxPlayerName };
  byName = Object.fromEntries(players.map(p => [p.name, p]));
}

function personalScore(nameOrP) {
  const p = typeof nameOrP === 'string' ? byName[nameOrP] : nameOrP;
  if (!p || !(p.ccpPerGame > 0) || !(refs.maxCcpG > 0)) return 0;
  return (p.ccpPerGame / refs.maxCcpG) * 100;
}

function calcTeamPower(names) {
  const list = (names || []).map(n => byName[n]).filter(Boolean);
  if (!list.length) return 0;
  return Math.round(Math.min(100, Math.max(0, list.reduce((a, p) => a + personalScore(p), 0) / list.length)));
}

function calcTeamWinRate(names) {
  const vals = (names || []).map(n => byName[n]).filter(p => p && !p.isMercenary && p.winRatePct > 0).map(p => p.winRatePct);
  if (!vals.length) return '-';
  return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) + '%';
}

function teamRoster(t) {
  const td = state.teams[t] || { players: [], coach: null };
  const names = [...td.players];
  if (td.coach && !names.includes(td.coach)) names.unshift(td.coach);
  return names;
}

/** 스네이크: R>B>Y>Y>B>R>R>… */
function snakeTeamAt(turnIndex) {
  const names = teamNames();
  const n = names.length;
  const round = Math.floor(turnIndex / n);
  const pos = turnIndex % n;
  return round % 2 === 0 ? names[pos] : names[n - 1 - pos];
}

function playerCardHtml(p, opts = {}) {
  if (!p) return '';
  const on = opts.on ? ' on' : '';
  const merc = p.isMercenary ? ' merc' : '';
  const sm = opts.sm ? ' sm' : '';
  const stat = opts.static ? ' static' : '';
  const score = personalScore(p).toFixed(1);
  const wr = p.isMercenary ? '-' : (p.winRatePct.toFixed(1) + '%');
  const tag = opts.coach ? ' (C)' : '';
  const attrs = opts.act ? `data-act="${opts.act}" ${opts.nameAttr ? `data-name="${p.name}"` : ''} ${opts.extra || ''}` : '';
  const tagName = opts.static ? 'div' : 'button type="button"';
  const close = opts.static ? 'div' : 'button';
  return `<${tagName} class="pcard${on}${merc}${sm}${stat}" ${attrs}>
    <span class="nm">${p.name}${tag}${p.isMercenary ? ' · 용병' : ''}</span>
    <span class="meta">${p.position || '-'} · 점수 ${score} · 승률 ${wr}</span>
  </${close}>`;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

function setStatus(msg, cls) {
  const el = document.getElementById('load-status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function parseCsv(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (c === '"' && inQ && n === '"') { cur += '"'; i++; continue; }
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { row.push(cur); cur = ''; continue; }
    if ((c === '\n' || c === '\r') && !inQ) {
      if (c === '\r' && n === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(x => x.trim())) rows.push(row);
      row = []; continue;
    }
    cur += c;
  }
  if (cur.length || row.length) { row.push(cur); if (row.some(x => x.trim())) rows.push(row); }
  return rows;
}

function playersFromCsv(text) {
  const rows = parseCsv(text);
  const h = rows[0].map(x => x.trim());
  const idx = (name) => h.indexOf(name);
  return rows.slice(1).map(r => normalizePlayer({
    name: r[idx('이름')], position: r[idx('포지션')], att: r[idx('공격(임의)')], def: r[idx('수비(임의)')],
    sum: r[idx('합산')], winRatePct: parseWinRatePct(r[idx('승률')]), ccpPerGame: r[idx('CCP/G')],
  })).filter(p => p.name);
}

async function loadLive() {
  setStatus('시트 로딩…');
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    players = playersFromCsv(await res.text());
    rebuildRefs();
    setStatus(`시트 OK · ${players.length}명`, 'ok');
    render();
  } catch (e) {
    setStatus('fetch 실패 → 스냅샷: ' + e.message, 'err');
    await loadSnapshot();
  }
}

async function loadSnapshot() {
  const data = await (await fetch('./players-snapshot.json', { cache: 'no-store' })).json();
  players = data.map(normalizePlayer);
  rebuildRefs();
  setStatus(`스냅샷 · ${players.length}명`, 'ok');
  render();
}

function ensureTeamStats() {
  teamNames().forEach(t => {
    if (!state.teamStats[t]) state.teamStats[t] = { matchesPlayed: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 };
  });
}

function ensurePlayerStat(name) {
  if (!state.playerStats[name]) state.playerStats[name] = { goal: 0, assist: 0, defense: 0, save: 0, ownGoal: 0 };
  return state.playerStats[name];
}

function cloneTeams(src) {
  const out = emptyTeams();
  TEAM_ORDER.forEach(t => {
    out[t] = { players: [...(src[t]?.players || [])], coach: src[t]?.coach || null };
  });
  return out;
}

function restoreOriginalLineup() {
  if (!state.originalTeams) return;
  state.teams = cloneTeams(state.originalTeams);
}

function go(screen) { state.screen = screen; render(); }

function renderSteps() {
  const order = STEP_DEFS.map(x => x[0]);
  const idx = order.indexOf(state.screen);
  document.getElementById('steps').innerHTML = STEP_DEFS.map(([id, label], i) =>
    `<span class="${i === idx ? 'on' : (i < idx ? 'done' : '')}">${i + 1}. ${label}</span>`
  ).join('');
}

function render() {
  renderSteps();
  const map = {
    attendance: renderAttendance, coach: renderCoach, draft: renderDraft,
    lineup: renderLineup, matchSelect: renderMatchSelect, match: renderMatch, results: renderResults,
  };
  document.getElementById('app').innerHTML = (map[state.screen] || renderAttendance)();
  bind();
}

function renderAttendance() {
  const list = [...players].sort((a, b) => personalScore(b) - personalScore(a));
  return `<div class="screen">
    <h2>참석 조사</h2>
    <p class="hint">참석자 선택 · 팀 모드</p>
    <div class="row">
      <label>팀 구성
        <select id="team-mode">
          <option value="2" ${state.teamMode===2?'selected':''}>2팀</option>
          <option value="3" ${state.teamMode===3?'selected':''}>3팀</option>
          <option value="4" ${state.teamMode===4?'selected':''}>4팀</option>
        </select>
      </label>
      <button type="button" data-act="select-all">전체 선택(용병제외)</button>
      <button type="button" data-act="clear-att">해제</button>
    </div>
    <div class="chip-row"><span class="chip">참석 ${state.attending.length}명</span></div>
    <div class="grid2">${list.map(p => playerCardHtml(p, {
      on: state.attending.includes(p.name), act: 'toggle-att', nameAttr: true
    })).join('')}</div>
    <button class="cta" data-act="to-coach" ${state.attending.length < state.teamMode ? 'disabled' : ''}>참석 완료 → 감독 선택</button>
  </div>`;
}

function renderCoach() {
  const names = teamNames();
  const filled = names.filter(t => state.coaches[t]).length;
  const pool = state.attending.filter(n => !Object.values(state.coaches).includes(n)).map(n => byName[n]).filter(Boolean)
    .sort((a, b) => personalScore(b) - personalScore(a));
  if (!state.coachPickTeam) state.coachPickTeam = names.find(t => !state.coaches[t]) || names[0];
  return `<div class="screen">
    <button class="nav-back" data-act="go" data-screen="attendance">← 참석</button>
    <h2>감독 ${names.length}명 선택</h2>
    <p class="hint">슬롯 탭 → 선수 탭</p>
    <div class="coach-slots m${names.length}">${names.map(t => {

        })).join('')}

      <div class="side ${b}"><div class="tname-${b}" style="font-weight:900;margin-bottom:0.35rem">${b}</div>
        ${rosterB.map(n => playerCardHtml(byName[n], {
          sm: true, act: 'record', nameAttr: true, extra: `data-team="${b}"`, coach: state.teams[b].coach===n
        })).join('')}
      </div>
    </div>
    <div class="match-actions">
      <button type="button" data-act="open-swap">선수교체</button>

      const s = state.teamStats[t];
      const gd = s.goalsFor - s.goalsAgainst;
      return { t, ...s, gd, pts: s.wins*3+s.draws, wr: (s.wins+s.losses)>0?((s.wins/(s.wins+s.losses))*100).toFixed(0)+'%':'-' };
    }).sort((x,y)=>y.pts-x.pts||y.gd-x.gd);
    body = `<table class="rank"><thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>득실</th><th>승률</th><th>승점</th></tr></thead>

    const arr = Object.entries(state.playerStats).map(([name,s])=>({name,...s,mp:s.goal*2+s.assist*2+s.defense+s.save})).sort((a,b)=>b.mp-a.mp).slice(0,10);
    body = `<table class="rank"><thead><tr><th>선수</th><th>득</th><th>도</th><th>수</th><th>선</th><th>MP</th></tr></thead>
      <tbody>${arr.map(p=>`<tr><td>${p.name}</td><td>${p.goal}</td><td>${p.assist}</td><td>${p.defense}</td><td>${p.save}</td><td>${p.mp}</td></tr>`).join('')||'<tr><td colspan="6">기록 없음</td></tr>'}</tbody></table>`;

    <h2>Match #${state.matchCount}</h2>
    <div class="scoreboard">
      <div><div class="tname-${a}">${a}</div><div style="font-size:0.75rem;color:var(--muted)">파워 ${calcTeamPower(rosterA)}</div></div>

      <div><div class="tname-${b}">${b}</div><div style="font-size:0.75rem;color:var(--muted)">파워 ${calcTeamPower(rosterB)}</div></div>
    </div>
    <div class="row" style="justify-content:center">
      <b style="font-size:1.4rem">${mm}:${ss}</b>
      <button type="button" data-act="toggle-timer">${state.timerOn?'일시정지':'시작'}</button>
    </div>
    <div class="tabs">
      <button type="button" class="${tab==='lineup'?'on':''}" data-act="tab" data-tab="lineup">라인업</button>
      <button type="button" class="${tab==='table'?'on':''}" data-act="tab" data-tab="table">팀 순위</button>
      <button type="button" class="${tab==='stats'?'on':''}" data-act="tab" data-tab="stats">개인기록</button>
    </div>
    ${body}
    <ul class="timeline">${state.timeline.map(e =>
      `<li class="${e.team}">[${e.time}] ${e.team} ${e.player}: ${e.stat}</li>`

function renderResults() {
  ensureTeamStats();
  const rows = teamNames().map(t => {
    const s = state.teamStats[t];
    const roster = teamRoster(t);
    return {
      t, ...s, gd: s.goalsFor - s.goalsAgainst, pts: s.wins*3+s.draws,

      <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="tname-${r.t}">${r.t}</td><td><b>${r.power}</b></td><td>${r.wrSheet}</td><td>${r.pts}</td><td>${r.wins}/${r.draws}/${r.losses}</td><td>${r.gd>0?'+':''}${r.gd}</td><td>${r.wrSession}</td></tr>`).join('')}</tbody>

      <tbody>${mvps.slice(0,12).map(p=>`<tr><td>${p.name}</td><td>${p.goal}</td><td>${p.assist}</td><td>${p.defense}</td><td>${p.save}</td><td>${p.mp}</td></tr>`).join('')||'<tr><td colspan="6">없음</td></tr>'}</tbody>
    </table>
    <button class="cta" data-act="reset-session">기록 리셋 & NEW 세션</button>

  </div>`;

function startDraft() {
  const names = teamNames();
  state.teams = emptyTeams();
  names.forEach(t => {
    state.teams[t].coach = state.coaches[t] || null;
    if (state.coaches[t]) state.teams[t].players = [state.coaches[t]];
  });
  const used = new Set(Object.values(state.coaches));
  state.draftPool = state.attending.filter(n => !used.has(n));
  state.draftTurn = 0;
  state.draftHistory = [];
  ensureTeamStats();
  go('draft');
}

function draftPick(name) {
  const t = snakeTeamAt(state.draftTurn);
  if (!state.draftPool.includes(name)) return;
  state.draftPool = state.draftPool.filter(n => n !== name);
  if (!state.teams[t].players.includes(name)) state.teams[t].players.push(name);
  state.draftHistory.push({ team: t, name });
  state.draftTurn++;
  render();
}

function draftUndo() {
  const last = state.draftHistory.pop();
  if (!last) return;
  state.teams[last.team].players = state.teams[last.team].players.filter(n => n !== last.name);
  state.draftPool.push(last.name);
  state.draftTurn = Math.max(0, state.draftTurn - 1);
  render();
}

function draftAutobuild() {
  const names = teamNames();
  const pool = [...state.draftPool].map(n => byName[n]).filter(Boolean).sort((a,b)=>personalScore(b)-personalScore(a));
  pool.forEach(p => {
    const target = [...names].sort((a,b)=>calcTeamPower(teamRoster(a))-calcTeamPower(teamRoster(b))||teamRoster(a).length-teamRoster(b).length)[0];
    state.teams[target].players.push(p.name);
    state.draftHistory.push({ team: target, name: p.name });
  });
  state.draftPool = [];
  render();
}

function endMatch() {
  const [a, b] = state.playing;
  ensureTeamStats();
  const sa = state.score.A, sb = state.score.B;
  state.teamStats[a].matchesPlayed++; state.teamStats[b].matchesPlayed++;
  state.teamStats[a].goalsFor += sa; state.teamStats[a].goalsAgainst += sb;
  state.teamStats[b].goalsFor += sb; state.teamStats[b].goalsAgainst += sa;
  if (sa > sb) { state.teamStats[a].wins++; state.teamStats[b].losses++; }
  else if (sa < sb) { state.teamStats[b].wins++; state.teamStats[a].losses++; }
  else { state.teamStats[a].draws++; state.teamStats[b].draws++; }
  stopTimer();
  state.matchCount++;
  state.playing = [];
  state.score = { A: 0, B: 0 };
  state.timeline = [];
  state.recordStack = [];
  state.secondsLeft = state.duration;
  go('matchSelect');
}

function openRecordModal(team, player) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal"><div class="box">
    <h3>${player} <span class="tname-${team}">(${team})</span></h3>
    <p class="hint">기록 선택</p>
    <div class="acts">
      <button class="btn-goal" data-rec="goal">득점</button>
      <button class="btn-own" data-rec="ownGoal">자책골</button>
      <button class="btn-def" data-rec="defense">수비</button>
      <button class="btn-save" data-rec="save">선방</button>
    </div>
    <button class="sec" id="modal-cancel">취소</button>
  </div></div>`;
  root.querySelector('#modal-cancel').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-rec]').forEach(btn => {
    btn.onclick = () => {
      const stat = btn.dataset.rec;
      root.innerHTML = '';
      if (stat === 'goal') openAssistModal(team, player);
      else applyRecord(team, player, stat, null);
    };
  });
}

function openAssistModal(team, player) {
  const mates = teamRoster(team).filter(n => n !== player);
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal"><div class="box">
    <h3>${player} 득점!</h3>
    <p class="hint">도움을 준 선수를 선택하세요</p>
    <div class="grid2" style="margin-bottom:0.5rem">
      ${mates.map(n => `<button class="btn-assist" data-assist="${n}">${n}</button>`).join('') || '<p class="hint">후보 없음</p>'}
    </div>
    <button class="sec" data-assist="">도움 없음</button>
    <button class="sec" id="modal-cancel">취소(득점 취소)</button>
  </div></div>`;
  root.querySelector('#modal-cancel').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-assist]').forEach(btn => {
    btn.onclick = () => {
      const assist = btn.dataset.assist || null;
      root.innerHTML = '';
      applyRecord(team, player, 'goal', assist);
    };
  });
}

function matchClock() {
  const elapsed = state.duration - state.secondsLeft;
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');
  return `${mm}:${ss}`;
}

function applyRecord(team, player, stat, assist) {
  const [a, b] = state.playing;
  const time = matchClock();
  const snap = {
    team, player, stat, assist,
    scoreA: state.score.A, scoreB: state.score.B,
  };
  ensurePlayerStat(player);
  if (stat === 'goal') {
    state.playerStats[player].goal++;
    if (team === a) state.score.A++; else state.score.B++;
    if (assist) { ensurePlayerStat(assist).assist++; }
    state.timeline.push({ time, team, player, stat: assist ? `득점 (도움:${assist})` : '득점' });
  } else if (stat === 'ownGoal') {
    state.playerStats[player].ownGoal++;
    if (team === a) state.score.B++; else state.score.A++;
    state.timeline.push({ time, team, player, stat: '자책골' });
  } else if (stat === 'defense') {
    state.playerStats[player].defense++;
    state.timeline.push({ time, team, player, stat: '수비' });
  } else if (stat === 'save') {
    state.playerStats[player].save++;
    state.timeline.push({ time, team, player, stat: '선방' });
  }
  state.recordStack.push(snap);
  render();
}

function undoRecord() {
  const last = state.recordStack.pop();
  if (!last) return;
  state.timeline.pop();
  const s = ensurePlayerStat(last.player);
  if (last.stat === 'goal') {
    s.goal = Math.max(0, s.goal - 1);
    if (last.assist) ensurePlayerStat(last.assist).assist = Math.max(0, ensurePlayerStat(last.assist).assist - 1);
  } else if (last.stat === 'ownGoal') s.ownGoal = Math.max(0, s.ownGoal - 1);
  else if (last.stat === 'defense') s.defense = Math.max(0, s.defense - 1);
  else if (last.stat === 'save') s.save = Math.max(0, s.save - 1);
  state.score.A = last.scoreA;
  state.score.B = last.scoreB;
  toast('기록 취소됨');
  render();
}

function openSwapModal() {
  const [a, b] = state.playing;
  const root = document.getElementById('modal-root');
  const sides = [a, b].map(t => `<div>
    <div class="tname-${t}" style="font-weight:900;margin:0.35rem 0">${t} OUT</div>
    ${teamRoster(t).map(n => `<button data-swap-out="${n}" data-team="${t}" style="width:100%;margin-bottom:0.3rem">${n}</button>`).join('')}
  </div>`).join('');
  root.innerHTML = `<div class="modal"><div class="box">
    <h3>선수교체</h3>
    <p class="hint">교체 OUT 선수 선택 → 벤치/타팀 IN 선택</p>
    <div class="grid2">${sides}</div>
    <button class="sec" id="modal-cancel">취소</button>
  </div></div>`;
  root.querySelector('#modal-cancel').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-swap-out]').forEach(btn => {
    btn.onclick = () => pickSwapIn(btn.dataset.team, btn.dataset.swapOut);
  });
}

function pickSwapIn(outTeam, outName) {
  const root = document.getElementById('modal-root');
  const others = state.attending.filter(n => !teamNames().some(t => teamRoster(t).includes(n)) ||
    teamNames().filter(t => t !== outTeam).some(t => teamRoster(t).includes(n)));
  // candidates: not on outTeam currently, from attending
  const cands = state.attending.filter(n => n !== outName && !teamRoster(outTeam).includes(n));
  root.innerHTML = `<div class="modal"><div class="box">
    <h3>${outName} ↔ IN 선택</h3>
    <div class="grid2">${cands.map(n => {
      const from = teamNames().find(t => teamRoster(t).includes(n));
      return `<button data-swap-in="${n}" data-from="${from||''}">${n}${from?` (${from})`:''}</button>`;
    }).join('') || '<p class="hint">후보 없음</p>'}</div>
    <button class="sec" id="modal-cancel">취소</button>
  </div></div>`;
  root.querySelector('#modal-cancel').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-swap-in]').forEach(btn => {
    btn.onclick = () => {
      const inName = btn.dataset.swapIn;
      const from = btn.dataset.from;
      // remove out from outTeam
      state.teams[outTeam].players = state.teams[outTeam].players.filter(n => n !== outName);
      if (state.teams[outTeam].coach === outName) { /* keep coach flag but move player slot */ }
      if (from) {
        state.teams[from].players = state.teams[from].players.filter(n => n !== inName);
        if (!state.teams[from].players.includes(outName) && state.teams[from].coach !== outName) {
          state.teams[from].players.push(outName);
        } else if (state.teams[from].coach !== outName) {
          state.teams[from].players.push(outName);
        }
      }
      if (!state.teams[outTeam].players.includes(inName) && state.teams[outTeam].coach !== inName) {
        state.teams[outTeam].players.push(inName);
      }
      // if coaches swapped oddly, keep coach names but ensure in players lists
      root.innerHTML = '';
      toast(`${outName} ↔ ${inName}`);
      render();
    };
  });
}

function openAddModal() {
  const [a, b] = state.playing;
  const free = state.attending.filter(n => !teamNames().some(t => teamRoster(t).includes(n)));
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal"><div class="box">
    <h3>선수추가</h3>
    <p class="hint">미배정 참석자를 경기에 추가</p>
    <div class="row">
      <button data-add-team="${a}" class="tname-${a}" style="flex:1;font-weight:900">${a}에 추가</button>
      <button data-add-team="${b}" class="tname-${b}" style="flex:1;font-weight:900">${b}에 추가</button>
    </div>
    <div id="add-pool" class="grid2" style="margin-top:0.5rem">${free.map(n =>
      `<button data-add-name="${n}">${n}</button>`
    ).join('') || '<p class="hint">미배정 선수 없음</p>'}</div>
    <button class="sec" id="modal-cancel">취소</button>
  </div></div>`;
  let target = a;
  root.querySelectorAll('[data-add-team]').forEach(btn => {
    btn.onclick = () => { target = btn.dataset.addTeam; toast(`${target} 선택`); };
  });
  root.querySelector('#modal-cancel').onclick = () => { root.innerHTML = ''; };
  root.querySelectorAll('[data-add-name]').forEach(btn => {
    btn.onclick = () => {
      const n = btn.dataset.addName;
      if (!state.teams[target].players.includes(n) && state.teams[target].coach !== n) {
        state.teams[target].players.push(n);
      }
      root.innerHTML = '';
      toast(`${n} → ${target}`);
      render();
    };
  });
}

function stopTimer() {
  state.timerOn = false;
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}

function toggleTimer() {
  if (state.timerOn) { stopTimer(); render(); return; }
  state.timerOn = true;
  state.timerId = setInterval(() => {
    if (state.secondsLeft <= 0) { stopTimer(); toast('시간 종료'); render(); return; }
    state.secondsLeft--;
    if (state.screen === 'match') {
      const clock = document.querySelector('[data-act="toggle-timer"]')?.previousElementSibling;
      if (clock) {
        const mm = String(Math.floor(state.secondsLeft/60)).padStart(2,'0');
        const ss = String(state.secondsLeft%60).padStart(2,'0');
        clock.textContent = `${mm}:${ss}`;
      }
    }
  }, 1000);
  render();
}

function resetSession() {
  stopTimer();
  Object.assign(state, {
    screen: 'attendance', attending: [], coaches: {}, coachPickTeam: null,
    teams: emptyTeams(), originalTeams: null, draftPool: [], draftTurn: 0, draftHistory: [],
    playing: [], matchCount: 1, score: { A: 0, B: 0 }, timeline: [], recordStack: [],
    teamStats: {}, playerStats: {}, matchTab: 'lineup', secondsLeft: state.duration,
  });
  toast('새 세션');
  render();
}

function bind() {
  const app = document.getElementById('app');
  app.onclick = (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'toggle-att') {
      const n = t.dataset.name;
      const i = state.attending.indexOf(n);
      if (i >= 0) state.attending.splice(i, 1); else state.attending.push(n);
      render();
    } else if (act === 'select-all') {
      state.attending = players.filter(p => !p.isMercenary).map(p => p.name); render();
    } else if (act === 'clear-att') {
      state.attending = []; render();
    } else if (act === 'to-coach') {
      state.teamMode = Number(document.getElementById('team-mode')?.value || state.teamMode);
      if (state.attending.length < state.teamMode) return toast('인원 부족');
      state.coaches = {}; state.coachPickTeam = teamNames()[0]; go('coach');
    } else if (act === 'pick-slot') {
      state.coachPickTeam = t.dataset.team; render();
    } else if (act === 'set-coach') {
      const team = state.coachPickTeam || teamNames().find(x => !state.coaches[x]);
      if (!team) return;
      Object.keys(state.coaches).forEach(k => { if (state.coaches[k] === t.dataset.name) delete state.coaches[k]; });
      state.coaches[team] = t.dataset.name;
      state.coachPickTeam = teamNames().find(x => !state.coaches[x]) || team;
      render();
    } else if (act === 'to-draft') startDraft();
    else if (act === 'draft-pick') draftPick(t.dataset.name);
    else if (act === 'draft-undo') draftUndo();
    else if (act === 'draft-autobuild') draftAutobuild();
    else if (act === 'to-lineup') {
      state.originalTeams = cloneTeams(state.teams);
      go('lineup');
    }
    else if (act === 'to-match-select') {
      if (!state.originalTeams) state.originalTeams = cloneTeams(state.teams);
      go('matchSelect');
    }
    else if (act === 'toggle-play') {
      const team = t.dataset.team;
      if (state.playing.includes(team)) state.playing = state.playing.filter(x => x !== team);
      else if (state.playing.length < 2) state.playing.push(team);
      else toast('2팀만 선택');
      render();
    } else if (act === 'start-match') {
      state.duration = Number(document.getElementById('duration')?.value || state.duration);
      // 매 경기 시작: 최초 라인업으로 자동 복귀
      restoreOriginalLineup();
      state.secondsLeft = state.duration;
      state.score = { A: 0, B: 0 };
      state.timeline = [];
      state.recordStack = [];
      state.matchTab = 'lineup';
      stopTimer();
      go('match');
    } else if (act === 'tab') { state.matchTab = t.dataset.tab; render(); }
    else if (act === 'record') openRecordModal(t.dataset.team, t.dataset.name);
    else if (act === 'toggle-timer') toggleTimer();
    else if (act === 'end-match') endMatch();
    else if (act === 'undo-record') undoRecord();
    else if (act === 'open-swap') openSwapModal();
    else if (act === 'open-add') openAddModal();
    else if (act === 'to-results') { stopTimer(); go('results'); }
    else if (act === 'reset-session') resetSession();
    else if (act === 'go') go(t.dataset.screen);
  };
  const mode = document.getElementById('team-mode');
  if (mode) mode.onchange = () => { state.teamMode = Number(mode.value); render(); };
  const dur = document.getElementById('duration');
  if (dur) dur.onchange = () => { state.duration = Number(dur.value); };
}

document.getElementById('btn-load').onclick = loadLive;
document.getElementById('btn-snap').onclick = loadSnapshot;
loadLive();
</script>
</body>
